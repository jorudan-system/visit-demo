<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TOYAMA LOCAL TRACKS 富山へのアクセス</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Noto+Serif+JP:wght@500;700&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F1E8}
a{color:#2F4A3C}a:hover{color:#1E3328}
.sp-only{display:none !important}
.hide{display:none !important}
.scroller{scrollbar-width:thin}
details.menu>summary{list-style:none;cursor:pointer}
details.menu>summary::-webkit-details-marker{display:none}
.spots{display:flex;gap:24px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:12px}
.spots>*{flex:0 0 320px;scroll-snap-align:start}
.route-inner .route-card{flex:1 1 0 !important;min-width:0}
@media (max-width:767px){
.pc-only{display:none !important}.sp-only{display:flex !important}.sp-hide{display:none !important}
.spots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;overflow:visible}
.spots>*{flex:none}
.route-inner{width:max-content !important;max-width:none !important}
.route-inner .route-card{flex:0 0 168px !important}
.fare-grid{min-width:0 !important}
.qk-opt{grid-template-columns:1fr !important}
.rt-row{grid-template-columns:1fr !important}
.rt-row>div:first-child{justify-content:flex-start !important;padding:10px 14px !important}
.rt-row>div:nth-child(2) span:not(:nth-child(2)){display:none}
.rt-row>div:nth-child(2) span:nth-child(2){text-align:left !important}
.rt-row>div:last-child{display:none !important}
.rt-dest{display:block !important}
.fare-grid>div{padding:10px 3px !important;font-size:12px !important;word-break:keep-all;overflow-wrap:anywhere}
.tt-grid{padding-left:10px !important;padding-right:10px !important;gap:6px !important}
.tt-grid>span{font-size:11px}
}

html{scroll-behavior:smooth}
body{overflow-wrap:break-word}
h1,h2,h3,button,a,span,p,li,td,th{overflow-wrap:anywhere;word-break:normal}
details.lang>summary::-webkit-details-marker{display:none}
.hero-slides{position:relative;overflow:hidden}
.hero-slides>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;animation:heroFade 15s infinite}
.hero-slides>img:nth-of-type(1){position:relative;opacity:1;animation:none}
.hero-slides>img:nth-of-type(2){animation-delay:5s}
.hero-slides>img:nth-of-type(3){animation-delay:10s}
@keyframes heroFade{0%{opacity:0}4%{opacity:1}33%{opacity:1}37%{opacity:0}100%{opacity:0}}
.hero-dots{position:absolute;right:20px;bottom:16px;display:flex;gap:6px;z-index:2}
.hero-dots>span{width:22px;height:4px;background:rgba(255,255,255,0.5);animation:heroDot 15s infinite}
.hero-dots>span:nth-child(2){animation-delay:5s}.hero-dots>span:nth-child(3){animation-delay:10s}
@keyframes heroDot{0%{background:#FFFFFF}33%{background:#FFFFFF}34%{background:rgba(255,255,255,0.5)}100%{background:rgba(255,255,255,0.5)}}
@media (prefers-reduced-motion: reduce){.hero-slides>img{animation:none}.hero-slides>img:nth-of-type(1){opacity:1}}
@media (max-width:767px){.origin-chip{flex:1 1 calc(25% - 8px) !important;padding:0 6px !important;font-size:15px !important}}
</style>
</head><body style="margin:0"><div id="dc-root"></div>
<script>window.__DC_TPL="\n\n<div style=\"font-family: 'Noto Sans JP', sans-serif; color: #2B2B2B; background: #F5F1E8; min-height: 100vh\">\n\n  <!-- 運行・災害情報テロップ -->\n  <sc-if value=\"{{ normal }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"background: #E3ECE4; border-bottom: 1px solid #B9CDBD; font-size: 14px\">\n      <div style=\"max-width: 1280px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 10px 16px; align-items: center\">\n        <span style=\"background: #2B2B2B; color: #FFFFFF; font-weight: 700; font-size: 12px; padding: 4px 10px; border-radius: 2px; white-space: nowrap\">運行・災害情報</span>\n        <span style=\"display: flex; align-items: center; gap: 6px; font-weight: 700; color: #2F4A3C; white-space: nowrap\"><span style=\"width: 10px; height: 10px; border-radius: 50%; background: #3E7A55\"></span>平常運行</span>\n        <span class=\"pc-only\" style=\"font-size: 12px; color: #5E5648; white-space: nowrap\">○時○分 更新</span>\n        <a href=\"Service.html\" style=\"margin-left: auto; font-size: 13px; font-weight: 700; white-space: nowrap\">詳しく見る →</a>\n      </div>\n    </div>\n  </sc-if>\n  <sc-if value=\"{{ alert }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"background: #8A3B26; color: #FFFFFF; font-size: 14px\">\n      <div style=\"max-width: 1280px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 10px 16px; align-items: center\">\n        <span style=\"background: #FFFFFF; color: #8A3B26; font-weight: 700; font-size: 12px; padding: 4px 10px; border-radius: 2px; white-space: nowrap\">運行・災害情報</span>\n        <span style=\"display: flex; align-items: center; gap: 6px; font-weight: 700; white-space: nowrap\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\"><path d=\"M12 3 2 21h20L12 3z\"></path><path d=\"M12 10v5M12 18v.5\"></path></svg>遅れ・運休あり</span>\n        <span class=\"pc-only\" style=\"font-size: 12px; white-space: nowrap\">○時○分 更新</span>\n        <a href=\"Service.html\" style=\"margin-left: auto; font-size: 13px; font-weight: 700; color: #FFFFFF; white-space: nowrap\">詳しく見る →</a>\n      </div>\n    </div>\n  </sc-if>\n\n  <!-- ヘッダー -->\n  <header style=\"border-bottom: 1px solid #D8CFBD; background: #F5F1E8; position: relative\">\n    <div style=\"max-width: 1280px; margin: 0 auto; padding: 14px 16px; display: flex; gap: 12px 32px; align-items: center\">\n      <a href=\"Main.html\" style=\"flex: 1 1 auto; text-decoration: none; color: #2B2B2B; display: flex; flex-direction: column; gap: 2px; min-width: 0\">\n        <span style=\"font-family: 'Cormorant Garamond', serif; font-size: clamp(16px, 2vw, 28px); font-weight: 600; letter-spacing: 0.1em; white-space: nowrap\">TOYAMA LOCAL TRACKS</span>\n        <span style=\"font-size: 11px; letter-spacing: 0.2em; color: #5E5648\">富山地方鉄道 観光ガイド</span>\n      </a>\n      <nav class=\"pc-only\" aria-label=\"メインメニュー\" style=\"display: flex; flex-wrap: wrap; gap: 4px 20px; font-size: 14px; font-weight: 500\"><a href=\"Tateyama.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 0\">エリア</a><a href=\"Courses.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 0\">モデルコース</a><a href=\"Tickets.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 0\">お得なチケット</a><a href=\"RideRail.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 0\">乗り方・きっぷ購入</a><a href=\"Feature.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 0\">特集</a><a href=\"Access.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 0; border-bottom: 2px solid #2B2B2B\">アクセス</a><a href=\"FAQ.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 0\">よくある質問</a></nav>\n      <details class=\"lang\" style=\"flex: 0 0 auto; position: relative\">\n        <summary aria-label=\"言語を選択\" style=\"list-style: none; cursor: pointer; font-family: inherit; font-size: 13px; background: transparent; border: 1px solid #8C8270; border-radius: 2px; padding: 0 12px; color: #2B2B2B; display: flex; gap: 6px; align-items: center; justify-content: center; min-height: 44px; min-width: 44px; box-sizing: border-box\">\n          <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18\"></path></svg>\n          <span class=\"pc-only\">日本語</span><span aria-hidden=\"true\" style=\"font-size: 10px\">▼</span>\n        </summary>\n        <div role=\"menu\" style=\"position: absolute; right: 0; top: calc(100% + 6px); z-index: 60; background: #FFFFFF; border: 1px solid #B7AC97; box-shadow: 0 10px 24px rgba(0,0,0,0.18); min-width: 180px; padding: 4px 0; display: flex; flex-direction: column\">\n          <a role=\"menuitem\" href=\"#\" style=\"text-decoration: none; color: #2B2B2B; font-weight: 700; background: #EEF3EE; padding: 10px 16px; font-size: 14px\">✓ 日本語</a>\n          <a role=\"menuitem\" href=\"#\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 16px; font-size: 14px\">English</a>\n          <a role=\"menuitem\" href=\"#\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 16px; font-size: 14px\">简体中文</a>\n          <a role=\"menuitem\" href=\"#\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 16px; font-size: 14px\">繁體中文</a>\n          <a role=\"menuitem\" href=\"#\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 16px; font-size: 14px\">한국어</a>\n          <a role=\"menuitem\" href=\"#\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 16px; font-size: 14px\">ภาษาไทย</a>\n        </div>\n      </details>\n      <details class=\"menu sp-only\" style=\"flex: 0 0 auto\">\n        <summary aria-label=\"メニューを開く\" style=\"width: 44px; height: 44px; border: 1px solid #2B2B2B; border-radius: 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; box-sizing: border-box\">\n          <span style=\"width: 20px; height: 2px; background: #2B2B2B\"></span><span style=\"width: 20px; height: 2px; background: #2B2B2B\"></span><span style=\"width: 20px; height: 2px; background: #2B2B2B\"></span>\n        </summary>\n        <nav aria-label=\"メインメニュー\" style=\"position: absolute; left: 0; right: 0; top: 100%; z-index: 10; background: #F5F1E8; border-bottom: 1px solid #D8CFBD; padding: 8px 20px 20px; display: flex; flex-direction: column; font-size: 16px; font-weight: 500; box-shadow: 0 12px 24px rgba(60,45,20,0.12)\"><a href=\"Tateyama.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">エリア<span aria-hidden=\"true\">›</span></a><a href=\"Courses.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">モデルコース<span aria-hidden=\"true\">›</span></a><a href=\"Tickets.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">お得なチケット<span aria-hidden=\"true\">›</span></a><a href=\"RideRail.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">乗り方・きっぷ購入<span aria-hidden=\"true\">›</span></a><a href=\"Feature.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">特集<span aria-hidden=\"true\">›</span></a><a href=\"Access.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">アクセス<span aria-hidden=\"true\">›</span></a><a href=\"FAQ.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">よくある質問<span aria-hidden=\"true\">›</span></a></nav>\n      </details>\n    </div>\n  </header>\n\n  <!-- ページ見出しと経路検索 -->\n  <section style=\"position: relative; background: #2F4A3C; color: #F5F1E8; overflow: hidden\">\n    <img src=\"img/hero_top.jpg\" alt=\"\" aria-hidden=\"true\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.22\">\n    <div style=\"position: relative; max-width: 1280px; margin: 0 auto; padding: 64px 24px 56px; display: flex; flex-wrap: wrap; gap: 32px 48px; align-items: center\">\n      <div style=\"flex: 1 1 380px; display: flex; flex-direction: column; gap: 12px\">\n        <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 20px; letter-spacing: 0.3em; color: #D9C9A6\">GETTING TO TOYAMA</span>\n        <h1 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: clamp(30px, 3.8vw, 46px); line-height: 1.4\">富山へのアクセス</h1>\n        <p style=\"margin: 0; font-size: 15px; line-height: 1.9; color: #E2DACA\">東京から北陸新幹線で約2時間。大阪・名古屋からも特急や高速バスで乗り換えなく富山へ。富山駅に着いたら、隣の電鉄富山駅から地鉄で立山・宇奈月温泉へ向かえます。</p>\n      </div>\n      <div style=\"flex: 0 1 520px; min-width: 0; background: #FFFDF8; color: #2B2B2B; padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.2)\">\n        <span style=\"display: flex; gap: 10px; align-items: baseline\"><span style=\"font-size: 17px; font-weight: 700\">富山までの行き方を調べる</span><span style=\"font-size: 12px; color: #5E5648\">JORUDAN VISIT</span></span>\n        <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) 48px; grid-template-rows: auto auto; gap: 8px 10px; align-items: end\">\n          <label style=\"grid-column: 1; grid-row: 1; display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #4A4438\">出発地<input type=\"text\" placeholder=\"駅名・空港・バス停\" style=\"font-family: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid #B7AC97; border-radius: 2px; background: #FFFFFF; min-height: 48px; width: 100%; box-sizing: border-box\"></label>\n          <button aria-label=\"出発地と到着地を入れ替える\" style=\"grid-column: 2; grid-row: 1 / span 2; align-self: center; width: 48px; height: 48px; border-radius: 50%; border: 1px solid #2F4A3C; background: #FFFFFF; color: #2F4A3C; font-size: 18px\">⇄</button>\n          <label style=\"grid-column: 1; grid-row: 2; display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #4A4438\">到着地\n            <select value=\"{{ dest }}\" onChange=\"{{ onDest }}\" style=\"font-family: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid #B7AC97; border-radius: 2px; background: #FFFFFF; min-height: 48px; width: 100%; box-sizing: border-box\"><option>富山</option><option>電鉄富山</option><option>宇奈月温泉</option><option>立山</option></select>\n          </label>\n        </div>\n        <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px\">\n          <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #4A4438\">日付<input type=\"text\" value=\"2026/10/12\" style=\"font-family: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid #B7AC97; border-radius: 2px; background: #FFFFFF; min-height: 48px; width: 100%; box-sizing: border-box\"></label>\n          <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #4A4438\">時刻<input type=\"text\" value=\"9:00\" style=\"font-family: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid #B7AC97; border-radius: 2px; background: #FFFFFF; min-height: 48px; width: 100%; box-sizing: border-box\"></label>\n        </div>\n        <div role=\"radiogroup\" style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid #B7AC97\">\n          <sc-for list=\"{{ modes }}\" as=\"m\" hint-placeholder-count=\"4\"><button role=\"radio\" onClick=\"{{ m.pick }}\" style=\"font-family: inherit; font-size: 14px; font-weight: 700; border: none; border-right: 1px solid #E6DECC; background: {{ m.bg }}; color: {{ m.color }}; min-height: 44px\">{{ m.label }}</button></sc-for>\n        </div>\n        <a href=\"https://visit.jorudan.co.jp/trip/ja/?tp=\" style=\"text-align: center; text-decoration: none; font-size: 16px; font-weight: 700; color: #FFFFFF; background: #B5523B; padding: 14px\">検索する（JORUDAN VISITで開きます）↗</a>\n        <span style=\"font-size: 12px; color: #6B6458; line-height: 1.6\">到着地は「富山」を入れた状態で表示しています。宇奈月温泉・立山などの目的地にも切り替えられます。</span>\n      </div>\n    </div>\n  </section>\n  <!-- 出発地から選ぶ -->\n  <section style=\"padding: 64px 24px 0\">\n    <div style=\"max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px\">\n      <div style=\"display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; justify-content: space-between\">\n        <div style=\"display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline\">\n          <h2 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: 28px\">どこから来ますか？</h2>\n          <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 18px; letter-spacing: 0.2em; color: #8A4A35\">FROM WHERE?</span>\n        </div><span style=\"font-size: 13px; color: #5E5648\">富山駅までの所要時間の目安</span>\n      </div>\n      <div role=\"tablist\" style=\"display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 4px\">\n        <sc-for list=\"{{ origins }}\" as=\"o\" hint-placeholder-count=\"7\">\n          <button role=\"tab\" onClick=\"{{ o.pick }}\" class=\"origin-chip\" style=\"flex: 0 0 auto; font-family: inherit; font-size: 16px; font-weight: 700; border: 2px solid {{ o.border }}; background: {{ o.bg }}; color: {{ o.color }}; border-radius: 999px; padding: 0 22px; min-height: 48px\">{{ o.name }}</button>\n        </sc-for>\n      </div>\n      <div style=\"background: #FFFDF8; border: 1px solid #D8CFBD; padding: 24px; display: flex; flex-direction: column; gap: 18px\">\n        <div style=\"display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline\">\n          <span style=\"font-family: 'Noto Serif JP', serif; font-size: 24px; font-weight: 700\">{{ originName }} → 富山</span>\n          <span style=\"font-size: 14px; color: #4A4438\">{{ originNote }}</span>\n        </div>\n        <sc-for list=\"{{ opts }}\" as=\"p\" hint-placeholder-count=\"3\">\n          <div style=\"display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 8px 20px; align-items: center\" class=\"qk-opt\">\n            <div style=\"display: flex; gap: 12px; align-items: center\">\n              <span style=\"flex: 0 0 44px; height: 44px; border-radius: 50%; background: {{ p.color }}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700\">{{ p.icon }}</span>\n              <span style=\"display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 16px; font-weight: 700\">{{ p.mode }}</span><sc-if value=\"{{ p.best }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"align-self: flex-start; font-size: 11px; font-weight: 700; color: #FFFFFF; background: #B5523B; padding: 1px 8px\">いちばん早い</span></sc-if></span>\n            </div>\n            <div style=\"display: flex; flex-direction: column; gap: 6px; min-width: 0\">\n              <div style=\"display: flex; align-items: center; gap: 12px\">\n                <span style=\"height: 18px; width: {{ p.w }}; min-width: 18px; background: {{ p.color }}; border-radius: 0 9px 9px 0\"></span>\n                <span style=\"font-size: 22px; font-weight: 700; white-space: nowrap; color: {{ p.color }}\">{{ p.time }}</span>\n              </div>\n              <span style=\"font-size: 14px; line-height: 1.7; color: #3A342C\">{{ p.route }}</span>\n              <div style=\"display: flex; flex-wrap: wrap; gap: 6px\"><sc-for list=\"{{ p.tags }}\" as=\"t\" hint-placeholder-count=\"2\"><span style=\"font-si
