<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Noto+Serif+JP:wght@500;700&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F1E8}
a{color:#2F4A3C}a:hover{color:#1E3328}
.sp-only{display:none !important}
.scroller{scrollbar-width:thin}
details.menu>summary{list-style:none;cursor:pointer}
details.menu>summary::-webkit-details-marker{display:none}
@media (max-width:767px){.pc-only{display:none !important}.sp-only{display:flex !important}}

@media (max-width:767px){.float-ticket{left:12px !important;right:12px !important;bottom:12px !important}.float-ticket .ft-link{width:100%}.float-ticket>button{right:-4px !important;top:-14px !important}.float-ticket .ft-body{flex-direction:row !important;align-items:center !important;gap:8px !important;padding:10px 14px !important;flex:1 1 auto}.float-ticket .ft-sub{display:none !important}.float-ticket .ft-arrow{display:block !important}}

body{overflow-wrap:break-word}
h1,h2,h3,button,a,span,p,li,td,th{overflow-wrap:anywhere;word-break:normal}
details.lang>summary::-webkit-details-marker{display:none}
.hero-slides{position:relative;overflow:hidden}
.hero-slides>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;animation:heroFade 15s infinite}
.hero-slides>img:nth-of-type(1){position:relative;opacity:1;animation:none}
.hero-slides>img:nth-of-type(2){animation-delay:5s}
.hero-slides>img:nth-of-type(3){animation-delay:10s}
@keyframes heroFade{0%{opacity:0}4%{opacity:1}33%{opacity:1}37%{opacity:0}100%{opacity:0}}
.hero-dots{position:absolute;right:20px;bottom:16px;display:flex;gap:6px;z-index:2}
.hero-dots>span{width:22px;height:4px;background:rgba(255,255,255,0.5);animation:heroDot 15s infinite}
.hero-dots>span:nth-child(2){animation-delay:5s}.hero-dots>span:nth-child(3){animation-delay:10s}
@keyframes heroDot{0%{background:#FFFFFF}33%{background:#FFFFFF}34%{background:rgba(255,255,255,0.5)}100%{background:rgba(255,255,255,0.5)}}
@media (prefers-reduced-motion: reduce){.hero-slides>img{animation:none}.hero-slides>img:nth-of-type(1){opacity:1}}

.spot-track{animation:spotMove 60s linear infinite;padding-left:24px}
.spot-marquee:hover .spot-track,.spot-marquee:focus-within .spot-track{animation-play-state:paused}
@keyframes spotMove{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion: reduce){.spot-track{animation:none}}
@media (max-width:767px){.area-grid{grid-template-columns:1fr !important}}
.area-grid>a>div:first-child{aspect-ratio:16 / 9 !important}
</style>

分 更新</span>\n        <a href=\"Service.html\" style=\"margin-left: auto; font-size: 13px; font-weight: 700; color: #FFFFFF; white-space: nowrap\">詳しく見る →</a>\n      </div>\n    </div>\n  </sc-if>\n\n  <!-- ヘッダー -->\n  <header style=\"border-bottom: 1px solid #D8CFBD; background: #F5F1E8; position: relative\">\n    <div style=\"max-width: 1280px; margin: 0 auto; padding: 14px 16px; display: flex; gap: 12px 32px; align-items: center\">\n      <a href=\"Main.html\" style=\"flex: 1 1 auto; text-decoration: none; color: #2B2B2B; display: flex; flex-direction: column; gap: 2px; min-width: 0\">\n        <span style=\"font-family: 'Cormorant Garamond', serif; font-size: clamp(16px, 2vw, 28px); font-weight: 600; letter-spacing: 0.1em; white-space: nowrap\">TOYAMA LOCAL TRACKS</span>\n        <span style=\"font-size: 11px; letter-spacing: 0.2em; color: #5E5648\">富山地方鉄道 観光ガイド</span>\n      </a>\n      <nav class=\"pc-only\" aria-label=\"メインメニュー\" style=\"display: flex; flex-wrap: wrap; gap: 4px 20px; font-size: 14px; font-weight: 500\"><a href=\"Tateyama.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 0\">エリア</a><a href=\"Courses.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 0\">モデルコース</a><a href=\"Tickets.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 0\">お得なチケット</a><a href=\"RideRail.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 0\">乗り方・きっぷ購入</a><a href=\"Feature.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 0\">特集</a><a href=\"Access.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 0\">アクセス</a><a href=\"FAQ.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 0\">よくある質問</a></nav>\n      <details class=\"lang\" style=\"flex: 0 0 auto; position: relative\">\n        <summary aria-label=\"言語を選択\" style=\"list-style: none; cursor: pointer; font-family: inherit; font-size: 13px; background: transparent; border: 1px solid #8C8270; border-radius: 2px; padding: 0 12px; color: #2B2B2B; display: flex; gap: 6px; align-items: center; justify-content: center; min-height: 44px; min-width: 44px; box-sizing: border-box\">\n          <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18\"></path></svg>\n          <span class=\"pc-only\">日本語</span><span aria-hidden=\"true\" style=\"font-size: 10px\">▼</span>\n        </summary>\n        <div role=\"menu\" style=\"position: absolute; right: 0; top: calc(100% + 6px); z-index: 60; background: #FFFFFF; border: 1px solid #B7AC97; box-shadow: 0 10px 24px rgba(0,0,0,0.18); min-width: 180px; padding: 4px 0; display: flex; flex-direction: column\">\n          <a role=\"menuitem\" href=\"#\" style=\"text-decoration: none; color: #2B2B2B; font-weight: 700; background: #EEF3EE; padding: 10px 16px; font-size: 14px\">✓ 日本語</a>\n          <a role=\"menuitem\" href=\"#\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 16px; font-size: 14px\">English</a>\n          <a role=\"menuitem\" href=\"#\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 16px; font-size: 14px\">简体中文</a>\n          <a role=\"menuitem\" href=\"#\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 16px; font-size: 14px\">繁體中文</a>\n          <a role=\"menuitem\" href=\"#\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 16px; font-size: 14px\">한국어</a>\n          <a role=\"menuitem\" href=\"#\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 16px; font-size: 14px\">ภาษาไทย</a>\n        </div>\n      </details>\n      <details class=\"menu sp-only\" style=\"flex: 0 0 auto\">\n        <summary aria-label=\"メニューを開く\" style=\"width: 44px; height: 44px; border: 1px solid #2B2B2B; border-radius: 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; box-sizing: border-box\">\n          <span style=\"width: 20px; height: 2px; background: #2B2B2B\"></span><span style=\"width: 20px; height: 2px; background: #2B2B2B\"></span><span style=\"width: 20px; height: 2px; background: #2B2B2B\"></span>\n        </summary>\n        <nav aria-label=\"メインメニュー\" style=\"position: absolute; left: 0; right: 0; top: 100%; z-index: 10; background: #F5F1E8; border-bottom: 1px solid #D8CFBD; padding: 8px 20px 20px; display: flex; flex-direction: column; font-size: 16px; font-weight: 500; box-shadow: 0 12px 24px rgba(60,45,20,0.12)\"><a href=\"Tateyama.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">エリア<span aria-hidden=\"true\">›</span></a><a href=\"Courses.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">モデルコース<span aria-hidden=\"true\">›</span></a><a href=\"Tickets.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">お得なチケット<span aria-hidden=\"true\">›</span></a><a href=\"RideRail.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">乗り方・きっぷ購入<span aria-hidden=\"true\">›</span></a><a href=\"Feature.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">特集<span aria-hidden=\"true\">›</span></a><a href=\"Access.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">アクセス<span aria-hidden=\"true\">›</span></a><a href=\"FAQ.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">よくある質問<span aria-hidden=\"true\">›</span></a></nav>\n      </details>\n    </div>\n  </header>\n\n  <!-- メインビジュアル -->\n  <section style=\"position: relative\">\n    <img src=\"img/hero_top.jpg\" alt=\"立山連峰の前を走るレトロな電車のイラスト\" style=\"display: block; width: 100%; height: 640px; object-fit: cover; object-position: 30% center\">\n    <div style=\"position: absolute; left: 0; right: 0; top: 0; padding: 56px 20px 0\">\n      <div style=\"max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px\">\n        <p style=\"margin: 0; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: clamp(16px, 1.6vw, 22px); color: #5E4A2E\">Chasing Nostalgia, Station by Station</p>\n        <h1 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-weight: 700; font-size: clamp(28px, 4.2vw, 48px); line-height: 1.5; color: #2B2B2B; letter-spacing: 0.06em\">カタンコトン。<br>あの日の懐かしさを、<br>探しにいこう。</h1>\n      </div>\n    </div>\n    <div style=\"position: absolute; bottom: 32px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px\" aria-hidden=\"true\">\n      <span style=\"width: 28px; height: 3px; background: #F5F1E8\"></span>\n      <span style=\"width: 28px; height: 3px; background: #F5F1E8; opacity: 0.3\"></span>\n      <span style=\"width: 28px; height: 3px; background: #F5F1E8; opacity: 0.3\"></span>\n      <span style=\"width: 28px; height: 3px; background: #F5F1E8; opacity: 0.3\"></span>\n    </div>\n  </section>\n\n  <!-- 導入 -->\n  <section style=\"padding: 96px 24px 64px\">\n    <div style=\"max-width: 1280px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 24px 64px; align-items: flex-end\">\n      <div style=\"flex: 1 1 380px; display: flex; flex-direction: column; gap: 16px\">\n        <p style=\"margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 18px; letter-spacing: 0.2em; color: #8A4A35\">JOURNEY BY RAIL</p>\n        <h2 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: 34px; line-height: 1.6\">車窓に、立山連峰。<br>地鉄でめぐる富山の旅。</h2>\n      </div>\n      <p style=\"flex: 1 1 420px; margin: 0; font-size: 16px; line-height: 2; color: #4A4438\">電鉄富山駅を起点に、立山・黒部宇奈月・魚津・滑川・上市、そして富山の街なかへ。運転を気にせず、窓の外の山並みと田園風景、木造の駅舎を味わう時間も旅のひとつです。</p>\n    </div>\n  </section>\n\n  <!-- エリアガイド -->\n  <section style=\"padding: 0 24px 104px\">\n    <div style=\"max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px\">\n      <div style=\"display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline\">\n        <h2 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: 30px\">エリアガイド</h2>\n        <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 18px; letter-spacing: 0.2em; color: #8A4A35\">AREAS</span>\n      </div>\n      <div class=\"area-grid\" style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px\">\n        <sc-for list=\"{{ areas }}\" as=\"a\" hint-placeholder-count=\"4\">\n          <a href=\"{{ a.href }}\" style=\"text-decoration: none; color: #2B2B2B; display: flex; flex-direction: column; gap: 14px\">\n            <div style=\"aspect-ratio: 3 / 4; overflow: hidden; background: {{ a.tint }}\"><img src=\"{{ a.img }}\" alt=\"{{ a.photo }}\" style=\"display: block; width: 100%; height: 100%; object-fit: cover\"></div>\n            <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 15px; letter-spacing: 0.18em; color: #8A4A35\">{{ a.en }}</span>\n            <span style=\"font-family: 'Noto Serif JP', serif; font-size: 22px; font-weight: 700\">{{ a.name }}</span>\n            <span style=\"font-size: 14px; line-height: 1.8; color: #4A4438\">{{ a.lead }}</span>\n          </a>\n        </sc-for>\n      </div>\n    </div>\n  </section>\n\n  <!-- エリア図 -->\n  <section style=\"padding: 0 24px 96px\">\n    <div style=\"max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px\">\n      <div style=\"display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline\">\n        <h2 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: 30px\">エリア図</h2>\n        <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 18px; letter-spacing: 0.2em; color: #8A4A35\">AREA MAP</span>\n      </div>\n      <figure style=\"margin: 0 auto; width: 100%; max-width: 1000px; background: #FFFDF8; border: 1px solid #D8CFBD; padding: 16px; box-sizing: border-box\">\n        <img src=\"img/st_areamap_jp.jpg\" alt=\"富山県内の富山地方鉄道の路線と、立山・宇奈月温泉・富山市内などの位置を示すエリア図\" style=\"display: block; width: 100%; height: auto\">\n      </figure>\n    </div>\n  </section>\n\n    <!-- 特集 -->\n  <sc-if value=\"{{ showFeature }}\" hint-placeholder-val=\"{{ true }}\">\n  \n  <section style=\"background: #1E1E1C; color: #F5F1E8; padding: 96px 24px\">\n    <div style=\"max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px\">\n      <div style=\"display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline\">\n        <h2 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: 30px\">特集　地鉄は、走る鉄道博物館。</h2>\n        <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 18px; letter-spacing: 0.2em; color: #E2B865\">FEATURES</span>\n        <a class=\"pc-only\" href=\"Feature.html\" style=\"margin-left: auto; font-size: 14px; color: #F5F1E8\">特集ページへ →</a>\n      </div>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 28px\">\n        <a href=\"FeatureDetail.html#cars\" style=\"text-decoration: none; color: #F5F1E8; display: flex; flex-direction: column; gap: 14px\">\n          <div style=\"position: relative; aspect-ratio: 16 / 10; overflow: hidden; background: #2B2B2B\"><img src=\"img/car_canyon.jpg\" alt=\"キャニオンエキスプレス\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover\"><span style=\"position: absolute; left: 14px; top: 14px; font-size: 12px; font-weight: 700; color: #1E1E1C; background: #E2B865; padding: 3px 10px\">01　車両</span></div>\n          <span style=\"font-family: 'Noto Serif JP', serif; font-size: 22px; font-weight: 700; line-height: 1.5\">都会の名車が、第二の人生を走る。地鉄レトロ車両図鑑</span>\n          <span style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 17px; color: #D9CBB0\">Second Life on the Rails</span>\n          <span style=\"font-size: 14px; line-height: 1.8; color: #DCD3BF\">西武の特急、京阪の「かぼちゃ電車」、東急の通勤車両。全国から集まった車両が、立山連峰を背にいまも現役で走ります。</span>\n        </a>\n        <a href=\"FeatureDetail.html#stations\" style=\"text-decoration: none; color: #F5F1E8; display: flex; flex-direction: column; gap: 14px\">\n          <div style=\"position: relative; aspect-ratio: 16 / 10; overflow: hidden; background: #2B2B2B\"><img src=\"img/st_iwakuraji.jpg\" alt=\"岩峅寺駅\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover\"><span style=\"position: absolute; left: 14px; top: 14px; font-size: 12px; font-weight: 700; color: #1E1E1C; background: #E2B865; padding: 3px 10px\">02　駅舎</span></div>\n          <span style=\"font-family: 'Noto Serif JP', serif; font-size: 22px; font-weight: 700; line-height: 1.5\">大正・昭和の駅舎へ、途中下車。レトロ駅舎めぐり10選</span>\n          <span style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 17px; color: #D9CBB0\">Stepping Back in Time</span>\n          <span style=\"font-size: 14px; line-height: 1.8; color: #DCD3BF\">大正10年築の瓦屋根、蔦の絡まる駅舎、田園に佇む無人駅。フリーきっぷで、お気に入りの駅を探しに。</span>\n        </a>\n      </div>\n      <a class=\"sp-only\" href=\"Feature.html\" style=\"justify-content: center; text-decoration: none; font-size: 15px; font-weight: 700; color: #F5F1E8; border: 1px solid #F5F1E8; padding: 14px; min-height: 48px; box-sizing: border-box\">特集ページへ</a>\n    </div>\n  </section>\n  </sc-if>\n\n  <!-- モデルコース -->\n  <section style=\"padding: 104px 0 0\">\n    <div style=\"display: flex; flex-direction: column; gap: 28px\">\n      <d
