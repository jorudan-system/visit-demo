=\"Tickets.html\" style=\"font-size: 13px\">← お得なチケット一覧</a>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 32px 48px; align-items: stretch\">\n        <div class=\"td-img\" style=\"flex: 1 1 420px; min-width: 0; background: #EFE8D8; display: flex; align-items: center; justify-content: center; padding: 32px; box-sizing: border-box; min-height: 360px\">\n          <img src=\"{{ img }}\" alt=\"{{ name }}の券面\" style=\"display: block; max-width: 100%; max-height: 380px; height: auto; box-shadow: 0 6px 20px rgba(0,0,0,0.18)\">\n        </div>\n        <div style=\"flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n          <div style=\"display: flex; flex-wrap: wrap; gap: 8px\"><span style=\"font-size: 12px; font-weight: 700; color: #FFFFFF; background: #2F4A3C; padding: 3px 10px\">{{ typeLabel }}</span><span style=\"font-size: 12px; font-weight: 700; color: #2B2B2B; background: #F5F1E8; border: 1px solid #D8CFBD; padding: 2px 10px\">{{ area }}</span></div>\n          <h1 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: clamp(26px, 3vw, 38px); line-height: 1.4\">{{ name }}</h1>\n          <span style=\"font-family: 'Noto Serif JP', serif; font-size: 18px; color: #8A4A35; line-height: 1.7\">{{ catch }}</span>\n          <p style=\"margin: 0; font-size: 15px; line-height: 1.9; color: #4A4438\">{{ desc }}</p>\n          <div style=\"background: #FFFDF8; border: 1px solid #D8CFBD; padding: 18px 22px; display: flex; flex-wrap: wrap; gap: 12px 32px; align-items: baseline\">\n            <span style=\"display: flex; gap: 10px; align-items: baseline\"><span style=\"font-size: 14px; color: #5E5648\">大人</span><span style=\"font-size: 34px; font-weight: 700; color: #8A3B26\">{{ adult }}</span></span>\n            <span style=\"display: flex; gap: 10px; align-items: baseline\"><span style=\"font-size: 14px; color: #5E5648\">小人</span><span style=\"font-size: 24px; font-weight: 700\">{{ child }}</span></span>\n            <s
