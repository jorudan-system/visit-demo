solid #E2D9C6; display: flex; justify-content: space-between\">エリア<span aria-hidden=\"true\">›</span></a><a href=\"Courses.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">モデルコース<span aria-hidden=\"true\">›</span></a><a href=\"Tickets.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">お得なチケット<span aria-hidden=\"true\">›</span></a><a href=\"RideRail.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">乗り方・きっぷ購入<span aria-hidden=\"true\">›</span></a><a href=\"Feature.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">特集<span aria-hidden=\"true\">›</span></a><a href=\"Access.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">アクセス<span aria-hidden=\"true\">›</span></a><a href=\"FAQ.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">よくある質問<span aria-hidden=\"true\">›</span></a></nav>\n      </details>\n      </div>\n    </div></div>\n    <div class=\"hdb-nav pc-only\" style=\"display: block\"><nav aria-label=\"メインメニュー\"><a href=\"Tateyama.html\">エリア</a><a href=\"Courses.html\">モデルコース</a><a href=\"Tickets.html\">お得なチケット</a><a href=\"RideRail.html\">乗り方・きっぷ購入</a><a href=\"Feature.html\">特集</a><a href=\"Access.html\">アクセス</a><a href=\"FAQ.html\">よくある質問</a></nav></div>\n  </header>\n\n<sc-if value=\"{{ isCar }}\" hint-placeholder-val=\"{{ true }}\">\n  <section style=\"position: relative; background: #141414; color: #F5F1E8\">\n    <img src=\"img/car_canyon.jpg\" alt=\"\" style=\"display: block; width: 100%; height: clamp(420px, 56vw, 680px); object-fit: cover; opacity: 0.78\">\n    <div style=\"position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,10,10,0.15) 20%, rgba(10,10,10,0.88) 100%)\"></div>\n    <div style=\"position: absolute; left: 0; right: 0; bottom: 0; padding: 0 24px 52px\">\n      <div style=\"max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px\">\n        <a href=\"Feature.html\" style=\"color: #E2B865; font-size: 13px\">← 特集一覧 / Features</a>\n        <span style=\"display: flex; gap: 10px; align-items: baseline\"><span style=\"font-size: 13px; font-weight: 700; color: #141414; background: #E2B865; padding: 3px 10px\">特集｜車両</span><span style=\"font-family: 'Cormorant Garamond', serif; font-size: 15px; letter-spacing: 0.3em; color: #E2B865\">ROLLING STOCK</span></span>\n        <h1 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: clamp(28px, 4.4vw, 56px); line-height: 1.4\">都会の名車が、第二の人生を走る。<br>地鉄レトロ車両図鑑</h1>\n        <span style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: clamp(18px, 2.2vw, 26px); color: #E3D8C2\">Second Life on the Rails: Chitetsu’s Legendary Trains</span>\n        <span style=\"font-size: 13px; color: #CFC6B4\">掲載 2026.06　｜　読了 約6分 / 6 min read　｜　写真提供：富山地方鉄道</span>\n      </div>\n    </div>\n  </section>\n  <section style=\"padding: 56px 24px 0\">\n    <div style=\"max-width: 1280px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 32px 48px; align-items: flex-start\">\n      <div style=\"flex: 3 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 24px\">\n        <p style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: 18px; line-height: 2.1\">富山地方鉄道の大きな魅力は、ホームで待つたびに違う車両がやって来ること。西武の特急、京阪の名車、東急の通勤電車——全国から集まった車両たちが、立山連峰を背にいまも現役で走っています。電鉄富山駅の隣、稲荷町の車庫を取材して見えてきた、イチオシの6両を紹介します。</p>\n        <nav aria-label=\"目次\" style=\"background: #FFFDF8; border: 1px solid #D8CFBD; padding: 16px 20px\">\n          <span style=\"display: flex; gap: 10px; align-items: baseline; padding-bottom: 6px\"><span style=\"font-size: 14px; font-weight: 700\">目次</span><span style=\"font-family: 'Cormorant Garamond', serif; font-size: 13px; letter-spacing: 0.2em; color: #6B6458\">CONTENTS</span></span>\n          <a href=\"#c1\" style=\"text-decoration: none; color: #2B2B2B; display: flex; gap: 10px; align-items: baseline; padding: 8px 0; border-top: 1px solid #E6DECC\"><span style=\"font-family: 'Cormorant Garamond', serif; font-size: 16px; color: #8A3B26; min-width: 28px\">01</span><span style=\"font-size: 14px; font-weight: 700\">アルプスエキスプレス</span><span style=\"margin-left: auto; font-size: 12px; color: #6B6458\">Alps Express</span></a><a href=\"#c2\" style=\"text-decoration: none; color: #2B2B2B; display: flex; gap: 10px; align-items: baseline; padding: 8px 0; border-top: 1px solid #E6DECC\"><span style=\"font-family: 'Cormorant Garamond', serif; font-size: 16px; color: #8A3B26; min-width: 28px\">02</span><span style=\"font-size: 14px; font-weight: 700\">キャニオンエキスプレス</span><span style=\"margin-left: auto; font-size: 12px; color: #6B6458\">Canyon Express</span></a><a href=\"#c3\" style=\"text-decoration: none; color: #2B2B2B; display: flex; gap: 10px; align-items: baseline; padding: 8px 0; border-top: 1px solid #E6DECC\"><span style=\"font-family: 'Cormorant Garamond', serif; font-size: 16px; color: #8A3B26; min-width: 28px\">03</span><span style=\"font-size: 14px; font-weight: 700\">かぼちゃ電車</span><span style=\"margin-left: auto; font-size: 12px; color: #6B6458\">The “Pumpkin” Train</span></a><a href=\"#c4\" style=\"text-decoration: none; color: #2B2B2B; display: flex; gap: 10px; align-items: baseline; padding: 8px 0; border-top: 1px solid #E6DECC\"><span style=\"font-family: 'Cormorant Garamond', serif; font-size: 16px; color: #8A3B26; min-width: 28px\">04</span><span style=\"font-size: 14px; font-weight: 700\">元東急の車両</span><span style=\"margin-left: auto; font-size: 12px; color: #6B6458\">Ex-Tokyu Commuter</span></a><a href=\"#c5\" style=\"text-decoration: none; color: #2B2B2B; display: flex; gap: 10px; align-items: baseline; padding: 8px 0; border-top: 1px solid #E6DECC\"><span style=\"font-family: 'Cormorant Garamond', serif; font-size: 16px; color: #8A3B26; min-width: 28px\">05</span><span style=\"font-size: 14px; font-weight: 700\">「とやまもよう」の車両</span><span style=\"margin-left: auto; font-size: 12px; color: #6B6458\">Toyama-Moyō Livery</span></a><a href=\"#c6\" style=\"text-decoration: none; color: #2B2B2B; display: flex; gap: 10px; align-items: baseline; padding: 8px 0; border-top: 1px solid #E6DECC\"><span style=\"font-family: 'Cormorant Garamond', serif; font-size: 16px; color: #8A3B26; min-width: 28px\">06</span><span style=\"font-size: 14px; font-weight: 700\">だいこん電車</span><span style=\"margin-left: auto; font-size: 12px; color: #6B6458\">The “Daikon” Train</span></a>\n        </nav>\n      </div>\n      <aside style=\"flex: 2 1 320px; min-width: 0; background: #1E1E1C; color: #F5F1E8; padding: 22px 24px; position: relative\">\n        <span style=\"display: flex; gap: 10px; align-items: baseline; padding-bottom: 8px\"><span style=\"font-size: 14px; font-weight: 700; color: #E2B865\">データシート</span><span style=\"font-family: 'Cormorant Garamond', serif; font-size: 13px; letter-spacing: 0.25em; color: #B8AE98\">DATA SHEET</span></span>\n        <div style=\"display: grid; grid-template-columns: 120px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid rgba(255,255,255,0.12)\"><span style=\"display: flex; flex-direction: column\"><span style=\"font-size: 12px; color: #B8AE98\">在籍車両</span><span style=\"font-family: 'Cormorant Garamond', serif; font-size: 12px; letter-spacing: 0.1em; color: #8C846F\">Fleet</span></span><span style=\"font-size: 15px; font-weight: 700; line-height: 1.6\">46両</span></div><div style=\"display: grid; grid-template-columns: 120px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid rgba(255,255,255,0.12)\"><span style=\"display: flex; flex-direction: column\"><span style=\"font-size: 12px; color: #B8AE98\">元の所属</span><span style=\"font-family: 'Cormorant Garamond', serif; font-size: 12px; letter-spacing: 0.1em; color: #8C846F\">Origins</span></span><span style=\"font-size: 15px; font-weight: 700; line-height: 1.6\">西武・京阪・東急ほか</span></div><div style=\"display: grid; grid-template-columns: 120px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid rgba(255,255,255,0.12)\"><span style=\"display: flex; flex-direction: column\"><span style=\"font-size: 12px; color: #B8AE98\">車庫</span><span style=\"font-family: 'Cormorant Garamond', serif; font-size: 12px; letter-spacing: 0.1em; color: #8C846F\">Depot</span></span><span style=\"font-size: 15px; font-weight: 700; line-height: 1.6\">稲荷町車庫（電鉄富山の隣・稲荷町駅）</span></div><div style=\"display: grid; grid-template-columns: 120px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid rgba(255,255,255,0.12)\"><span style=\"display: flex; flex-direction: column\"><span style=\"font-size: 12px; color: #B8AE98\">整備体制</span><span style=\"font-family: 'Cormorant Garamond', serif; font-size: 12px; letter-spacing: 0.1em; color: #8C846F\">Maintenance</span></span><span style=\"font-size: 15px; font-weight: 700; line-height: 1.6\">27名のスタッフが日々整備</span></div>\n      </aside>\n    </div>\n  </section>\n  <section style=\"padding: 32px 24px 0\"><div style=\"max-width: 1280px; margin: 0 auto\"><article id=\"c1\" class=\"fd-entry\" style=\"display: flex; flex-wrap: wrap; gap: 28px 48px; align-items: center; padding: 40px 0; border-top: 1px solid #D8CFBD\">\n          <div style=\"flex: 1 1 480px; min-width: 0\"><div style=\"position: relative; aspect-ratio: 4 / 3; background: #2B2B2B\"><div class=\"ph-car\" style=\"position: absolute; inset: 0; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth\"><div id=\"ph1-1\" style=\"flex: 0 0 100%; scroll-snap-align: start; height: 100%\"><img sr アルプスエキスプレス（追加用）</span></div></div></div><div style=\"position: absolute; left: 0; right: 0; bottom: 10px; display: flex; gap: 8px; justify-content: center\"><a href=\"#ph1-1\" aria-label=\"写真1\" style=\"width: 10px; height: 10px; border-radius: 50%; background: #FFFFFF; display: block\"></a><a href=\"#ph1-2\" aria-label=\"写真2\" style=\"width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.55); display: block\"></a><a href=\"#ph1-3\" aria-label=\"写真3\" style=\"width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.55); display: block\"></a></div><span style=\"position: absolute; right: 10px; top: 10px; font-size: 11px; color: #FFFFFF; background: rgba(20,20,20,0.55); padding: 2px 8px\">1 / 3　横にスライド</span></div></div><div style=\"flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 12px\">\n            <div style=\"display: flex; flex-wrap: wrap; gap: 10px; align-items: center\">\n              <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 15px; letter-spacing: 0.2em; color: #8A3B26\">No.01</span>\n              <span style=\"font-size: 13px; font-weight: 700; color: #3A2A10; background: linear-gradient(180deg, #E8C877, #B98E3B); border: 1px solid #8C6A26; padding: 3px 12px; letter-spacing: 0.08em\">16010形</span>\n              <span style=\"display: inline-flex; gap: 8px; align-items: center; font-size: 12px; font-weight: 700; color: #F5F1E8; background: #1E1E1C; padding: 4px 10px\"><span style=\"color: #E2B865\">●</span><span style=\"color: #5A564E\">●</span><span style=\"color: #5A564E\">●</span><span>不定期運行</span><span style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500; color: #B8AE98\">Lucky catch</span></span>\n            </div>\n            <h3 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: clamp(24px, 2.6vw, 32px); line-height: 1.4\">アルプスエキスプレス</h3>\n            <span style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 20px; color: #5E5648\">Alps Express</span>\n            <span style=\"font-family: 'Noto Serif JP', serif; font-size: 17px; color: #8A3B26; line-height: 1.7\">車窓を「絵画」に見立てた、走るギャラリー。</span>\n            <p style=\"margin: 0; font-size: 15px; line-height: 2; color: #3A342C\">九州の観光列車で知られる水戸岡鋭治氏が手がけた内装。木の窓枠が車窓を額縁のように切り取り、外向きのカウンター席からは立山連峰や田園がまっすぐ目に飛び込みます。椅子や照明、飾られた富山の土人形まで、細部すべてが見どころです。</p>\n            <div style=\"border-bottom: 1px solid #E6DECC\"><div style=\"display: grid; grid-template-columns: 130px 1fr; gap: 10px; padding: 9px 0; border-top: 1px solid #E6DECC\"><span style=\"display: flex; flex-direction: column\"><span style=\"font-size: 12px; color: #5E5648\">元の所属</span><span style=\"font-family: 'Cormorant Garamond', serif; font-size: 12px; color: #8C846F\">Former operator</span></span><span style=\"font-size: 14px; font-weight: 700; line-height: 1.6\">西武鉄道 特急「レッドアロー」</span></div><div style=\"display: grid; grid-template-columns: 130px 1fr; gap: 10px; padding: 9px 0; border-top: 1px solid #E6DECC\"><span style=\"display: flex; flex-direction: column\"><span style=\"font-size: 12px; color: #5E5648\">地鉄での活躍</span><span style=\"font-family: 'Cormorant Garamond', serif; font-size: 12px; color: #8C846F\">With Chitetsu</span></span><span style=\"font-size: 14px; font-weight: 700; line-height: 1.6\">約30年（現デザインは2011年から）</span></div><div style=\"display: grid; grid-template-columns: 130px 1fr; gap: 10px; padding: 9px 0; border-top: 1px solid #E6DECC\"><span style=\"display: flex; flex-direction: column\"><span style=\"font-size: 12px; color: #5E5648\">デザイン</span><span style=\"font-family: 'Cormorant Garamond', serif; font-size: 12px; color: #8C846F\">Designer</span></span><span style=\"font-size: 14px; font-weight: 700; line-height: 1.6\">水戸岡鋭治氏</span></div></div>\n          </div>\n        </article><article id=\"c2\" class=\"fd-entry fd-flip\" style=\"display: flex; flex-wrap: wrap; gap: 28px 48px; align-items: center; padding: 40px 0; border-top: 1px solid #D8CFBD\">\n          <div style=\"flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 12px\">\n            <div style=\"display: flex; flex-wrap: wrap; gap: 10px; align-items: center\">\n              <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 15px; letter-spacing: 0.2em; color: #8A3B26\">No.02</span>\n              <span style=\"font-size: 13px; font-weight: 700; color: #3A2A10; background: linear-gradient(180deg, #E8C877, #B98E3B); border: 1px solid #8C6A26; padding: 3px 12px; letter-spacing: 0.08em\">20020形</span>\n              <span style=\"display: inline-flex; gap: 8px; align-items: center; font-size: 12px; font-weight: 700; color: #F5F1E8; background: #1E1E1C; padding: 4px 10px\"><span style=\"color: #E2B865\">●</span><span style=\"color: #5A564E\">●</span><span style=\"color: #5A564E\">●</span><span>不定期運行</span><span style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500; color: #B8AE98\">Lucky catch</span></span>\n            </div>\n            <h3 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: clamp(24px, 2.6vw, 32px); line-height: 1.4\">キャニオンエキスプレス</h3>\n            <span style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 20px; color: #5E5648\">Canyon Express</span>\n            <span style=\"font-family: 'Noto Serif JP', serif; font-size: 17px; color: #8A3B26; line-height: 1.7\">首都圏の特急が、渓谷へ向かう観光列車に。</span>\n            <p style=\"margin: 0; font-size: 15px; line-height: 2; color: #3A342C\">2020年まで西武池袋線・秩父線の特急「ニューレッドアロー」として走っていた車両。座席は広く、ひじ掛けに飲み物を置けるゆとりも。車内にトイレがあるので、宇奈月温泉や立山までの長い乗車も快適です。</p>\n            <div style=\"border-bottom: 1px solid #E6DECC\"><div style=\"display: grid; grid-template-columns: 130px 1fr; gap: 10px; padding: 9px 0; border-top: 1px solid #E6DECC\"><span style=\"display: flex; flex-direction: column\"><span style=\"font-size: 12px; color: #5E5648\">元の所属</span><span style=\"font-family: 'Cormorant Garamond', serif; font-size: 12px; color: #8C846F\">Former operator</span></span><span style=\"font-size: 14px; font-weight: 700; line-height: 1.6\">西武鉄道「ニューレッドアロー」</span></div><div style=\"display: grid; grid-template-columns: 130px 1fr; gap: 10px; padding: 9px 0; border-top: 1px solid #E6DECC\"><span style=\"display: flex; flex-direction: column\"><span style=\"font-size: 12px; color: #5E5648\">前職</span><span style=\"font-family: 'Cormorant Garamond', serif; font-size: 12px; color: #8C846F\">Previous route</span></span><span style=\"font-size: 14px; font-weight: 700; line-height: 1.6\">西武池袋線・西武秩父線の特急（〜2020年）</span></div><div style=\"display: grid; grid-template-columns: 130px 1fr; gap: 10px; padding: 9px 0; border-top: 1px solid #E6DECC\"><span style=\"display: flex; flex-direction: column\"><span style=\"font-size: 12px; color: #5E5648\">車内</span><span style=\"font-family: 'Cormorant Garamond', serif; font-size: 12px; color: #8C846F\">On board</span></span><span style=\"font-size: 14px; font-weight: 700; line-height: 1.6\">ゆったり座席・トイレ付き</span></div></div>\n          </div><div style=\"flex: 1 1 480px; min-width: 0\"><div style=\"position: relative; aspect-ratio: 4 / 3; background: #2B2B2B\"><div class=\"ph-car\" style=\"position: absolute; inset: 0; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth\"><div id=\"ph2-1\" style=\"flex: 0 0 100%; scroll-snap-align: start; height: 100%\"><img src=\"img/car_canyon.jpg\" alt=\"キャニオンエキスプレス\" style=\"width: 100%; height: 100%; object-fit: cover; display: block\"></div><div id=\"ph2-2\" style=\"flex: 0 0 100%; scroll-snap-align: start; height: 100%\"><div style=\"width: 100%; height: 100%; background: #8C7A5E; display: flex; align-items: flex-end; padding: 12px; box-sizing: border-box\"><span style=\"font-size: 12px; color: #FFFFFF; background: rgba(20,20,20,0.6); padding: 2px 8px\">写真2：キャニオンエキスプレス（追加用）</span></div></div><div id=\"ph2-3\" style=\"flex: 0 0 100%; scroll-sna  rgba(20,20,20,0.6); padding: 2px 8px\">写真2：かぼちゃ電車（追加用）</span></div></div><div id=\"ph3-3\" style=\"flex: 0 0 100%; scroll-snap-align: start; height: 100%\"><div style=\"width: 100%; height: 100%; background: #8C7A5E; display: flex; align-items: flex-end; padding: 12px; box-sizing: border-box\"><span style=\"font-size: 12px; color: #FFFFFF; background: rgba(20,20,20,0.6); padding: 2px 8px\">写真3：かぼちゃ電車（追加用）</span></div></div></div><div style=\"position: absolute; left: 0; right: 0; bottom: 10px; display: flex; gap: 8px; justify-content: center\"><a href=\"#ph3-1\" aria-label=\"写真1\" style=\"width: 10px; height: 10px; border-radius: 50%; background: #FFFFFF; display: block\"></a><a href=\"#ph3-2\" aria-label=\"写真2\" style=\"width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.55); display: block\"></a><a href=\"#ph3-3\" aria-label=\"写真3\" style=\"width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.55); display: block\"></a></div><span style=\"position: absolute; right: 10px; top: 10px; font-size: 11px; color: #FFFFFF; background: rgba(20,20,20,0.55); padding: 2px 8px\">1 / 3　横にスライド</span></div></div><div style=\"flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 12px\">\n            <div style=\"display: flex; flex-wrap: wrap; gap: 10px; align-items: center\">\n              <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 15px; letter-spacing: 0.2em; color: #8A3B26\">No.03</span>\n              <span style=\"font-size: 13px; font-weight: 700; color: #3A2A10; background: linear-gradient(180deg, #E8C877, #B98E3B); border: 1px solid #8C6A26; padding: 3px 12px; letter-spacing: 0.08em\">10030形</span>\n              <span style=\"display: inline-flex; gap: 8px; align-items: center; font-size: 12px; font-weight: 700; color: #F5F1E8; background: #1E1E1C; padding: 4px 10px\"><span style=\"color: #E2B865\">●</span><span style=\"color: #E2B865\">●</span><span style=\"color: #E2B865\">●</span><span>よく走っています</span><span style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500; color: #B8AE98\">Common</span></span>\n            </div>\n            <h3 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: clamp(24px, 2.6vw, 32px); line-height: 1.4\">かぼちゃ電車</h3>\n            <span style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 20px; color: #5E5648\">The “Pumpkin” Train</span>\n            <span style=\"font-family: 'Noto Serif JP', serif; font-size: 17px; color: #8A3B26; line-height: 1.7\">40年以上、地鉄の顔として走り続ける名車。</span>\n            <p style=\"margin: 0; font-size: 15px; line-height: 2; color: #3A342C\">山や川に映える黄色と緑の車体から「かぼちゃ電車」の愛称で親しまれる、元京阪の車両。向きを変えられる座席と、昔ながらの窓から眺める田園と山並みは、ローカル線ならではのぜいたくな時間です。</p>\n            <div style=\"border-bottom: 1px solid #E6DECC\"><div style=\"display: grid; grid-template-columns: 130px 1fr; gap: 10px; padding: 9px 0; border-top: 1px solid #E6DECC\"><span style=\"display: flex; flex-direction: column\"><span style=\"font-size: 12px; color: #5E5648\">元の所属</span><span style=\"font-family: 'Cormorant Garamond', serif; font-size: 12px; color: #8C846F\">Former operator</span></span><span style=\"font-size: 14px; font-weight: 700; line-height: 1.6\">京阪電気鉄道</span></div><div style=\"display: grid; grid-template-columns: 130px 1fr; gap: 10px; padding: 9px 0; border-top: 1px solid #E6DECC\"><span style=\"display: flex; flex-direction: column\"><span style=\"font-size: 12px; color: #5E5648\">地鉄での活躍</span><span style=\"font-family: 'Cormorant Garamond', serif; font-size: 12px; color: #8C846F\">With Chitetsu</span></span><span style=\"font-size: 14px; font-weight: 700; line-height: 1.6\">40年以上</span></div><div style=\"display: grid; grid-template-columns: 130px 1fr; gap: 10px; padding: 9px 0; border-top: 1px solid #E6DECC\"><span style=\"display: flex; flex-direction: column\"><span style=\"font-size: 12px; color: #5E5648\">愛称の由来</span><span style=\"font-family: 'Cormorant Garamond', serif; font-size: 12px; color: #8C846F\">Nickname</span></span><span style=\"font-size: 14px; font-weight: 700; line-height: 1.6\">黄色と緑の車体色から</span></div></div>\n          </div>\n        </article><article id=\"c4\" class=\"fd-entry fd-flip\" style=\"display: flex; flex-wrap: wrap; gap: 28px 48px; align-items: center; padding: 40px 0; border-top: 1px solid #D8CFBD\">\n          <div style=\"flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 12px\">\n            <div style=\"display: flex; flex-wrap: wrap; gap: 10px; align-items: center\">\n              <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 15px; letter-spacing: 0.2em; color: #8A3B26\">No.04</span>\n              <span style=\"font-size: 13px; font-weight: 700; color: #3A2A10; background: linear-gradient(180deg, #E8C877, #B98E3B); border: 1px solid #8C6A26; padding: 3px 12px; letter-spacing: 0.08em\">17480形</span>\n              <span style=\"display: inline-flex; gap: 8px; align-items: center; font-size: 12px; font-weight: 700; color: #F5F1E8; background: #1E1E1C; padding: 4px 10px\"><span style=\"color: #E2B865\">●</span><span style=\"color: #E2B865\">●</span><span style=\"color: #E2B865\">●</span><span>よく走っています</span><span style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500; color: #B8AE98\">Common</span></span>\n            </div>\n            <h3 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: clamp(24px, 2.6vw, 32px); line-height: 1.4\">元東急の車両</h3>\n            <span style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 20px; color: #5E5648\">Ex-Tokyu Commuter</span>\n            <span style=\"font-family: 'Noto Serif JP', serif; font-size: 17px; color: #8A3B26; line-height: 1.7\">東京の通勤電車が、立山連峰の麓で第二の人生。</span>\n            <p style=\"margin: 0; font-size: 15px; line-height: 2; color: #3A342C\">かつて東京や神奈川で毎日たくさんの人を運んだステンレスの車両。首都圏で暮らしたことのある人には、どこか懐かしい再会になるかもしれません。</p>\n            <div style=\"border-bottom: 1px solid #E6DECC\"><div style=\"display: grid; grid-template-columns: 130px 1fr; gap: 10px; padding: 9px 0; border-top: 1px solid #E6DECC\"><span style=\"display: flex; flex-direction: column\"><span style=\"font-size: 12px; color: #5E5648\">元の所属</span><span style=\"font-family: 'Cormorant Garamond', serif; font-size: 12px; color: #8C846F\">Former operator</span></span><span style=\"font-size: 14px; font-weight: 700; line-height: 1.6\">東急電鉄</span></div><div style=\"display: grid; grid-template-columns: 130px 1fr; gap: 10px; padding: 9px 0; border-top: 1px solid #E6DECC\"><span style=\"display: flex; flex-direction: column\"><span style=\"font-size: 12px; color: #5E5648\">前職</span><span style=\"font-family: 'Cormorant Garamond', serif; font-size: 12px; color: #8C846F\">Previous route</span></span><span style=\"font-size: 14px; font-weight: 700; line-height: 1.6\">東京・神奈川の通勤路線</span></div><div style=\"display: grid; grid-template-columns: 130px 1fr; gap: 10px; padding: 9px 0; border-top: 1px solid #E6DECC\"><span style=\"display: flex; flex-direction: column\"><span style=\"font-size: 12px; color: #5E5648\">地鉄での活躍</span><span style=\"font-family: 'Cormorant Garamond', serif; font-size: 12px; color: #8C846F\">With Chitetsu</span></span><span style=\"font-size: 14px; font-weight: 700; line-height: 1.6\">約10年</span></div></div>\n          </div><div style=\"flex: 1 1 480px; min-width: 0\"><div style=\"position: relative; aspect-ratio: 4 / 3; background: #2B2B2B\"><div class=\"ph-car\" style=\"position: absolute; inset: 0; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth\"><div id=\"ph4-1\" style=\"flex: 0 0 100%; scroll-snap-align: start; height: 100%\"><img src=\"img/car_extokyu.jpg\" alt=\"元東急の車両\" style=\"width: 100%; height: 100%; object-fit: cover; display: block\"></div><div id=\"ph4-2\" style=\"flex: 0 0 100%; scroll-snap-align: start; height: 100%\"><div style=\"width: 100%; height: 100%; background: #8C7A5E; display: flex; align-items: flex-end; padding: 12px; box-sizing: border-box\"><span style=\"font-size: 12px; color: #FFFFFF; background: rgba(20,20,20,0.6); padding: 2px 8px\">写真2：元東急の車両（追加用）</span></div></div><div id=\"ph4-3\" style=\"flex: 0 0 100%; scroll-snap-align: start; height: 100%\"><div style=\"width: 100%; height: 100%; background: #8C7A5E; display: flex; align-items: flex-end; padding: 12px; box-sizing: border-box\"><span style=\"font-size: 12px; color: #FFFFFF; background: rgba(20,20,20,0.6); padding: 2px 8px\">写真3：元東急の車両（追加用）</span></div></div></div><div style=\"position: absolute; left: 0; right: 0; bottom: 10px; display: flex; gap: 8px; justify-content: center\"><a href=\"#ph4-1\" aria-label=\"写真1\" style=\"width: 10px; height: 10px; border-radius: 50%; background: #FFFFFF; display: block\"></a><a href=\"#ph4-2\" aria-label=\"写真2\" style=\"width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.55); display: block\"></a><a href=\"#ph4-3\" aria-label=\"写真3\" style=\"width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.55); display: block\"></a></div><span style=\"position: absolute; right: 10px; top: 10px; font-size: 11px; color: #FFFFFF; background: rgba(20,20,20,0.55); padding: 2px 8px\">1 / 3　横にスライド</span></div></div>\n        </article><article id=\"c5\" class=\"fd-entry\" style=\"display: flex; flex-wrap: wrap; gap: 28px 48px; align-items: center; padding: 40px 0; border-top: 1px solid #D8CFBD\">\n          <div style=\"flex: 1 1 480px; min-width: 0\"><div style=\"position: relative; aspect-ratio: 4 / 3; background: #2B2B2B\"><div class=\"ph-car\" style=\"position: absolute; inset: 0; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth\"><div id=\"ph5-1\" style=\"flex: 0 0 100%; scroll-snap-align: start; height: 100%\"><img src=\"img/car_toyamamoyo.jpg\" alt=\"「とやまもよう」の車両\" style=\"width: 100%; height: 100%; object-fit: cover; display: block\"></div><div id=\"ph5-2\" style=\"flex: 0 0 100%; scroll-snap-align: start; height: 100%\"><div style=\"width: 100%; height: 100%; background: #8C7A5E; display: flex; align-items: flex-end; padding: 12px; box-sizing: border-box\"><span style=\"font-size: 12px; color: #FFFFFF; background: rgba(20,20,20,0.6); padding: 2px 8px\">写真2：「とやまもよう」の車両（追加用）</span></div></div><div id=\"ph5-3\" style=\"flex: 0 0 100%; scroll-snap-align: start; height: 100%\"><div style=\"width: 100%; height: 100%; background: #8C7A5E; display: flex; align-items: flex-end; padding: 12px; box-sizing: border-box\"><span style=\"font-size: 12px; color: #FFFFFF; background: rgba(20,20,20,0.6); padding: 2px 8px\">写真3：「とやまもよう」の車両（追加用）</span></div></div></div><div style=\"position: absolute; left: 0; right: 0; bottom: 10px; display: flex; gap: 8px; justify-content: center\"><a href=\"#ph5-1\" aria-label=\"写真1\" style=\"width: 10px; height: 10px; border-radius: 50%; background: #FFFFFF; display: block\"></a><a href=\"#ph5-2\" aria-label=\"写真2\" style=\"width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.55); display: block\"></a><a href=\"#ph5-3\" aria-label=\"写真3\" style=\"width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.55); display: block\"></a></div><span style=\"position: absolute; right: 10px; top: 10px; font-size: 11px; color: #FFFFFF; background: rgba(20,20,20,0.55); padding: 2px 8px\">1 / 3　横にスライド</span></div></div><div style=\"flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 12px\">\n            <div style=\"display: flex; flex-wrap: wrap; gap: 10px; align-items: center\">\n              <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 15px; letter-spacing: 0.2em; color: #8A3B26\">No.05</span>\n              <span style=\"font-size: 13px; font-weight: 700; color: #3A2A10; background: linear-gradient(180deg, #E8C877, #B98E3B); border: 1px solid #8C6A26; padding: 3px 12px; letter-spacing: 0.08em\">[形式確認中]</span>\n              <span style=\"display: inline-flex; gap: 8px; align-items: center; font-size: 12px; font-weight: 700; color: #F5F1E8; background: #1E1E1C; padding: 4px 10px\"><span style=\"color: #E2B865\">●</span><span style=\"color: #E2B865\">●</span><span style=\"color: #5A564E\">●</span><span>出会えたら撮りたい</span><span style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500; color: #B8AE98\">Photo target</span></span>\n            </div>\n            <h3 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: clamp(24px, 2.6vw, 32px); line-height: 1.4\">「とやまもよう」の車両</h3>\n            <span style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 20px; color: #5E5648\">Toyama-Moyō Livery</span>\n            <span style=\"font-family: 'Noto Serif JP', serif; font-size: 17px; color: #8A3B26; line-height: 1.7\">富山の県鳥・雷鳥をまとった、街なかで目を引く一両。</span>\n            <p style=\"margin: 0; font-size: 15px; line-height: 2; color: #3A342C\">県の鳥・雷鳥をモチーフにしたデザインの車両。駅や沿線で見かけると、思わずカメラを向けたくなる個性的なカラーです。</p>\n            <div style=\"border-bottom: 1px solid #E6DECC\"><div style=\"display: grid; grid-template-columns: 130px 1fr; gap: 10px; padding: 9px 0; border-top: 1px solid #E6DECC\"><span style=\"display: flex; flex-direction: column\"><span style=\"font-size: 12px; color: #5E5648\">デザイン</span><span style=\"font-family: 'Cormorant Garamond', serif; font-size: 12px; color: #8C846F\">Design</span></span><span style=\"font-size: 14px; font-weight: 700; line-height: 1.6\">雷鳥をモチーフにした「とやまもよう」</span></div><div style=\"display: grid; grid-template-columns: 130px 1fr; gap: 10px; padding: 9px 0; border-top: 1px solid #E6DECC\"><span style=\"display: flex; flex-direction: column\"><span style=\"font-size: 12px; color: #5E5648\">見どころ</span><span style=\"font-family: 'Cormorant Garamond', serif; font-size: 12px; color: #8C846F\">Look for</span></span><span style=\"font-size: 14px; font-weight: 700; line-height: 1.6\">赤・白・緑の大胆な配色</span></div></div>\n          </div>\n        </article><article id=\"c6\" class=\"fd-entry fd-flip\" style=\"display: flex; flex-wrap: wrap; gap: 28px 48px; align-items: center; padding: 40px 0; border-top: 1px solid #D8CFBD\">\n          <div style=\"flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 12px\">\n            <div style=\"display: flex; flex-wrap: wrap; gap: 10px; align-items: center\">\n              <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 15px; letter-spacing: 0.2em; color: #8A3B26\">No.06</span>\n              <span style=\"font-size: 13px; font-weight: 700; color: #3A2A10; background: linear-gradient(180deg, #E8C877, #B98E3B); border: 1px solid #8C6A26; padding: 3px 12px; letter-spacing: 0.08em\">[形式確認中]</span>\n              <span style=\"display: inline-flex; gap: 8px; align-items: center; font-size: 12px; font-weight: 700; color: #F5F1E8; background: #1E1E1C; padding: 4px 10px\"><span style=\"color: #E2B865\">●</span><span style=\"color: #E2B865\">●</span><span style=\"color: #E2B865\">●</span><span>よく走っています</span><span style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500; color: #B8AE98\">Common</span></span>\n            </div>\n            <h3 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: clamp(24px, 2.6vw, 32px); line-height: 1.4\">だいこん電車</h3>\n            <span style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 20px; color: #5E5648\">The “Daikon” Train</span>\n            <span style=\"font-family: 'Noto Serif JP', serif; font-size: 17px; color: #8A3B26; line-height: 1.7\">見れば納得。親しみを込めて「だいこん」。</span>\n            <p style=\"margin: 0; font-size: 15px; line-height: 2; color: #3A342C\">その色合いから「だいこん電車」と呼ばれ、沿線で親しまれている車両。見るたびに「確かにだいこんだ」と思わずうなずいてしまう、地鉄らしいユーモアのある一両です。</p>\n            <div style=\"border-bottom: 1px solid #E6DECC\"><div style=\"display: grid; grid-template-columns: 130px 1fr; gap: 10px; padding: 9px 0; border-top: 1px solid #E6DECC\"><span style=\"display: flex; flex-direction: column\"><span style=\"font-size: 12px; color: #5E5648\">愛称の由来</span><span style=\"font-family: 'Cormorant Garamond', serif; font-size: 12px; color: #8C846F\">Nickname</span></span><span style=\"font-size: 14px; font-weight: 700; line-height: 1.6\">白い車体と色合いから</span></div><div style=\"display: grid; grid-template-columns: 130px 1fr; gap: 10px; padding: 9px 0; border-top: 1px solid #E6DECC\"><span style=\"display: flex; flex-direction: column\"><span style=\"font-size: 12px; color: #5E5648\">見どころ</span><span style=\"font-family: 'Cormorant Garamond', serif; font-size: 12px; color: #8C846F\">Look for</span></span><span style=\"font-size: 14px; font-weight: 700; line-height: 1.6\">昔ながらの地鉄カラー</span></div></div>\n          </div><div style=\"flex: 1 1 480px; min-width: 0\"><div style=\"position: relative; aspect-ratio: 4 / 3; background: #2B2B2B\"><div class=\"ph-car\" style=\"position: absolute; inset: 0; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth\"><div id=\"ph6-1\" style=\"flex: 0 0 100%; scroll-snap-align: start; height: 100%\"><img src=\"img/car_daikon.jpg\" alt=\"だいこん電車\" style=\"width: 100%; height: 100%; object-fit: cover; display: block\"></div><div id=\"ph6-2\" style=\"flex: 0 0 100%; scroll-snap-align: start; height: 100%\"><div style=\"width: 100%; height: 100%; background: #8C7A5E; display: flex; align-items: flex-end; padding: 12px; box-sizing: border-box\"><span style=\"font-size: 12px; color: #FFFFFF; background: rgba(20,20,20,0.6); padding: 2px 8px\">写真2：だいこん電車（追加用）</span></div></div><div id=\"ph6-3\" style=\"flex: 0 0 100%; scroll-snap-align: start; height: 100%\"><div style=\"width: 100%; height: 100%; background: #8C7A5E; display: flex; align-items: flex-end; padding: 12px; box-sizing: border-box\"><span style=\"font-size: 12px; color: #FFFFFF; background: rgba(20,20,20,0.6); padding: 2px 8px\">写真3：だいこん電車（追加用）</span></div></div></div><div style=\"position: absolute; left: 0; right: 0; bottom: 10px; display: flex; gap: 8px; justify-content: center\"><a href=\"#ph6-1\" aria-label=\"写真1\" style=\"width: 10px; height: 10px; border-radius: 50%; background: #FFFFFF; display: block\"></a><a href=\"#ph6-2\" aria-label=\"写真2\" style=\"width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.55); display: block\"></a><a href=\"#ph6-3\" aria-label=\"写真3\" style=\"width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.55); display: block\"></a></div><span style=\"position: absolute; right: 10px; top: 10px; font-size: 11px; color: #FFFFFF; background: rgba(20,20,20,0.55); padding: 2px 8px\">1 / 3　横にスライド</span></div></div>\n        </article></div></section>\n  <section style=\"padding: 64px 24px 0\"><div style=\"max-width: 1280px; margin: 0 auto; background: #1E1E1C; color: #F5F1E8; padding: 28px 32px; display: flex; flex-direction: column; gap: 16px\">\n      <span style=\"display: flex; gap: 10px; align-items: baseline\"><span style=\"font-family: 'Noto Serif JP', serif; font-size: 22px; font-weight: 700\">鉄道ファンのためのヒント</span><span style=\"font-family: 'Cormorant Garamond', serif; font-size: 14px; letter-spacing: 0.25em; color: #E2B865\">TIPS FOR RAILFANS</span></span>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px\"><div style=\"border-top: 2px solid #E2B865; padding-top: 12px; display: flex; flex-direction: column; gap: 6px\"><span style=\"font-size: 15px; font-weight: 700\">不定期運行の車両</span><span style=\"font-size: 14px; line-height: 1.8; color: #D9D3C6\">アルプスエキスプレス・キャニオンエキスプレスは不定期運行。乗れたらラッキーな「レア車両」です。</span></div><div style=\"border-top: 2px solid #E2B865; padding-top: 12px; display: flex; flex-direction: column; gap: 6px\"><span style=\"font-size: 15px; font-weight: 700\">1日フリーきっぷ</span><span style=\"font-size: 14px; line-height: 1.8; color: #D9D3C6\">鉄道線・市内電車の全線と特急自由席が1日乗り放題。車両めぐりの強い味方です。</span></div><div style=\"border-top: 2px solid #E2B865; padding-top: 12px; display: flex; flex-direction: column; gap: 6px\"><span style=\"font-size: 15px; font-weight: 700\">撮影マナー</span><span style=\"font-size: 14px; line-height: 1.8; color: #D9D3C6\">ホームでは黄色い線の内側から。フラッシュや三脚の使用、線路への立ち入りはご遠慮ください。</span></div></div>\n    </div></section>\n  <section style=\"padding: 64px 24px 104px\"><div style=\"max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px\">\n      <a href=\"TicketDetail.html#t4\" style=\"text-decoration: none; color: #F5F1E8; background: #2F4A3C; padding: 26px; display: flex; flex-direction: column; gap: 8px; justify-content: center\">\n        <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 14px; letter-spacing: 0.3em; color: #E2B865\">ONE-DAY PASS</span>\n        <span style=\"font-family: 'Noto Serif JP', serif; font-size: 22px; font-weight: 700\">鉄道線・市内電車1日フリーきっぷ</span>\n        <span style=\"font-size: 14px; color: #DCD3BF\">全線と特急自由席が1日乗り放題　大人 3,400円</span>\n        <span style=\"font-size: 14px; font-weight: 700; margin-top: 4px\">きっぷを見る →</span>\n      </a>\n      <a href=\"FeatureDetail.html#stations\" style=\"text-decoration: none; color: #2B2B2B; background: #FFFDF8; border: 1px solid #D8CFBD; display: flex; gap: 16px; align-items: stretch; overflow: hidden\">\n        <img src=\"img/st_iwakuraji.jpg\" alt=\"\" style=\"flex: 0 0 42%; width: 42%; object-fit: cover\">\n        <span style=\"padding: 20px 20px 20px 0; display: flex; flex-direction: column; gap: 6px; justify-content: center\"><span style=\"font-size: 12px; color: #8A3B26; font-weight: 700\">次の特集 / NEXT STORY</span><span style=\"font-family: 'Noto Serif JP', serif; font-size: 18px; font-weight: 700; line-height: 1.5\">大正・昭和の駅舎へ、途中下車。レトロ駅舎めぐり10選</span><span style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 15px; color: #5E5648\">10 Retro Stations on the Chitetsu Line</span></span>\n      </a>\n    </div></section>\n\n</sc-if>\n<sc-if value=\"{{ isSt }}\" hint-placeholder-val=\"{{ false }}\">\n  <section style=\"position: relative; background: #141414; color: #F5F1E8\">\n    <img src=\"img/st_overview.jpg\" alt=\"\" style=\"display: block; width: 100%; height: clamp(420px, 56vw, 680px); object-fit: cover; opacity: 0.78\">\n    <div style=\"position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,10,10,0.15) 20%, rgba(10,10,10,0.88) 100%)\"></div>\n    <div style=\"position: absolute; left: 0; right: 0; bottom: 0; padding: 0 24px 52px\">\n      <div style=\"max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px\">\n        <a href=\"Feature.html\" style=\"color: #E2B865; font-size: 13px\">← 特集一覧 / Features</a>\n        <span style=\"display: flex; gap: 10px; align-items: baseline\"><span style=\"font-size: 13px; font-weight: 700; color: #141414; background: #E2B865; padding: 3px 10px\">特集｜駅舎</span><span style=\"font-family: 'Cormorant Garamond', serif; font-size: 15px; letter-spacing: 0.3em; color: #E2B865\">STATIONS</span></span>\n        <h1 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: clamp(28px, 4.4vw, 56px); line-height: 1.4\">大正・昭和の駅舎へ、途中下車。<br>レトロ駅舎めぐり10選</h1>\n        <span style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: clamp(18px, 2.2vw, 26px); color: #E3D8C2\">Stepping Back in Time: 10 Retro Stations on the Chitetsu Line</span>\n        <span style=\"font-size: 13px; color: #CFC6B4\">掲載 2026.07　｜　読了 約8分 / 8 min read　｜　写真提供：とやま観光推進機構</span>\n      </div>\n    </div>\n  </section>\n  <section style=\"padding: 56px 24px 0\">\n    <div style=\"max-width: 1280px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 32px 48px; align-items: flex-start\">\n      <div style=\"flex: 3 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 24px\">\n        <p style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: 18px; line-height: 2.1\">蔦の絡まる駅舎、大正生まれの瓦屋根、田園にぽつんと立つ無人駅。富山地方鉄道の沿線には、時が止まったかのような駅舎がいまも現役で残っています。フリーきっぷを片手に途中下車をくり返し、自分だけのお気に入りの駅を探しに出かけましょう。</p>\n        <nav aria-label=\"目次\" style=\"background: #FFFDF8; border: 1px solid #D8CFBD; padding: 16px 20px\">\n          <span style=\"display: flex; gap: 10px; align-items: baseline; padding-bottom: 6px\"><span style=\"font-size: 14px; font-weight: 700\">目次</span><span style=\"font-family: 'Cormorant Garamond', serif; font-size: 13px; letter-spacing: 0.2em; color: #6B6458\">CONTENTS</span></span>\n          <a href=\"#s1\" style=\"text-decoration: none; color: #2B2B2B; display: flex; gap: 10px; align-items: baseline; padding: 8px 0; border-top: 1px solid #E6DECC\"><span style=\"font-family: 'Cormorant Garamond', serif; font-size: 16px; color: #8A3B26; min-width: 28px\">T61</span><span style=\"font-size: 14px; font-weight: 700\">南富山駅</span><span style=\"margin-left: auto; font-size: 12px; color: #6B6458\">Minami-Toyama</span></a><a href=\"#s2\" style=\"text-decoration: none; color: #2B2B2B; display: flex; gap: 10px; align-items: baseline; padding: 8px 0; border-top: 1px solid #E6DECC\"><span style=\"font-family: 'Cormorant Garamond', serif; font-size: 16px; color: #8A3B26; min-width: 28px\">T08</span><span style=\"font-size: 14px; font-weight: 700\">寺田駅</span><span style=\"margin-left: auto; font-size: 12px; color: #6B6458\">Terada</span></a><a href=\"#s3\" style=\"text-decoration: none; color: #2B2B2B; display: flex; gap: 10px; align-items: baseline; padding: 8px 0; border-top: 1px solid #E6DECC\"><span style=\"font-family: 'Cormorant Garamond', serif; font-size: 16px; color: #8A3B26; min-width: 28px\">T51</span><span style=\"font-size: 14px; font-weight: 700\">岩峅寺駅</span><span style=\"margin-left: auto; font-size: 12px; color: #6B6458\">Iwakuraji</span></a><a href=\"#s4\" style=\"text-decoration: none; color: #2B2B2B; display: flex; gap: 10px; align-items: baseline; padding: 8px 0; border-top: 1px solid #E6 d #3A9A3A; border-radius: 6px; background: #FFFFFF; line-height: 1\"><span style=\"font-size: 12px; font-weight: 700; color: #3A9A3A\">T</span><span style=\"font-size: 20px; font-weight: 700; color: #3A9A3A\">51</span></span>\n              <span style=\"display: flex; flex-direction: column; gap: 2px\"><h3 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: clamp(24px, 2.6vw, 32px); line-height: 1.3\">岩峅寺駅</h3><span style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 19px; color: #5E5648\">Iwakuraji Station</span></span>\n            </div>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 6px; align-items: center\"><span style=\"font-size: 12px; font-weight: 700; color: #FFFFFF; background: #3A9A3A; padding: 2px 10px\">立山線</span><span style=\"font-size: 12px; font-weight: 700; color: #FFFFFF; background: #E2662A; padding: 2px 10px\">不二越・上滝線</span><span style=\"font-size: 13px; font-weight: 700; color: #3A2A10; background: linear-gradient(180deg, #E8C877, #B98E3B); border: 1px solid #8C6A26; padding: 3px 12px\">1921年（大正10年）築</span></div>\n            <p style=\"margin: 0; font-size: 15px; line-height: 2; color: #3A342C\">100年を超える歴史をもつ駅舎。どこを切り取っても絵になる瓦屋根が目印です。立山線と不二越・上滝線が乗り入れる2面4線の構内も、入場券（240円）で見学できます。</p>\n            <div style=\"background: #F3EEE2; border-left: 3px solid #8A3B26; padding: 10px 14px\"><span style=\"font-size: 12px; font-weight: 700; color: #8A3B26\">見どころ <span style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500\">Look for</span></span><ul style=\"margin: 4px 0 0; padding-left: 18px; font-size: 14px; line-height: 1.9\"><li>大正10年築の駅舎</li><li>特徴的な瓦屋根</li><li>2面4線の構内</li></ul></div>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n              <a href=\"https://visit.jorudan.co.jp/trip/ja/?tp=\" style=\"text-decoration: none; font-size: 14px; font-weight: 700; color: #FFFFFF; background: #2F4A3C; padding: 11px 16px\">この駅へ行く（JORUDAN VISIT ign: start; height: 100%\"><div style=\"width: 100%; height: 100%; background: #8C7A5E; display: flex; align-items: flex-end; padding: 12px; box-sizing: border-box\"><span style=\"font-size: 12px; color: #FFFFFF; background: rgba(20,20,20,0.6); padding: 2px 8px\">写真3：浜加積駅（追加用）</span></div></div></div><div style=\"position: absolute; left: 0; right: 0; bottom: 10px; display: flex; gap: 8px; justify-content: center\"><a href=\"#ph11-1\" aria-label=\"写真1\" style=\"width: 10px; height: 10px; border-radius: 50%; background: #FFFFFF; display: block\"></a><a href=\"#ph11-2\" aria-label=\"写真2\" style=\"width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.55); display: block\"></a><a href=\"#ph11-3\" aria-label=\"写真3\" style=\"width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.55); display: block\"></a></div><span style=\"position: absolute; right: 10px; top: 10px; font-size: 11px; color: #FFFFFF; background: rgba(20,20,20,0.55); padding: 2px 8px\">1 / 3　横にスライド</span></div></div><div style=\"flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 12px\">\n            <div style=\"display: flex; gap: 14px; align-items: center\">\n              <span style=\"display: inline-flex; flex-direction: column; align-items: center; justify-content: center; width: 52px; height: 52px; border: 3px solid #1E6FB8; border-radius: 6px; background: #FFFFFF; line-height: 1\"><span style=\"font-size: 12px; font-weight: 700; color: #1E6FB8\">T</span><span style=\"font-size: 20px; font-weight: 700; color: #1E6FB8\">19</span></span>\n              <span style=\"display: flex; flex-direction: column; gap: 2px\"><h3 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: clamp(24px, 2.6vw, 32px); line-height: 1.3\">浜加積駅</h3><span style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 19px; color: #5E5648\">Hama-Kazumi Station</span></span>\n            </div>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 6px; align-items: center\"><span style=\"font-size: 12px; font-weight: 700; color: #FFFFFF; background: #1E6FB8; padding: 2px 10px\">本線</span></div>\n            <p style=\"margin: 0; font-size: 15px; line-height: 2; color: #3A342C\">外からは想像できない、レトロな空間が駅舎の中に。ホームの前には田園が広がり、映画のワンシーンのような景色に出会えます。</p>\n            <div style=\"background: #F3EEE2; border-left: 3px solid #8A3B26; padding: 10px 14px\"><span style=\"font-size: 12px; font-weight: 700; color: #8A3B26\">見どころ <span style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500\">Look for</span></span><ul style=\"margin: 4px 0 0; padding-left: 18px; font-size: 14px; line-height: 1.9\"><li>驚くほどレトロな駅舎内</li><li>ホームの前の田園</li></ul></div>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n              <a href=\"https://visit.jorudan.co.jp/trip/ja/?tp=\" style=\"text-decoration: none; font-size: 14px; font-weight: 700; color: #FFFFFF; background: #2F4A3C; padding: 11px 16px\">この駅へ行く（JORUDAN VISIT）↗</a>\n              <a href=\"https://www.chitetsu.co.jp/?station_info=%E6%B5%9C%E5%8A%A0%E7%A9%8D%E9%A7%85\" style=\"text-decoration: none; font-size: 14px; font-weight: 700; color: #2F4A3C; border: 1px solid #2F4A3C; padding: 10px 16px\">駅情報（富山地方鉄道）↗</a>\n            </div>\n          </div>\n        </article><article id=\"s6\" class=\"fd-entry fd-flip\" style=\"display: flex; flex-wrap: wrap; gap: 28px 48px; align-items: center; padding: 40px 0; border-top: 1px solid #D8CFBD\">\n          <div style=\"flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 12px\">\n            <div style=\"display: flex; gap: 14px; align-items: center\">\n              <span style=\"display: inline-flex; flex-direction: column; align-items: center; justify-content: center; width: 52px; height: 52px; border: 3px solid #1E6FB8; border-radius: 6px; background: #FFFFFF; line-height: 1\"><span style=\"font-size: 12px; font-weight: 700; color: #1E6FB8\" 930年（昭和5年）\",\"1930년（쇼와 5년）\",\"ปี 1930 (โชวะปีที่ 5)\"],\"93.2 km\":[\"93.2 km\",\"93.2 km\",\"93.2 km\",\"93.2 km\",\"93.2 km\"],\"軌道線（市内電車）\":[\"Streetcar lines\",\"轨道线（市内电车）\",\"軌道線（市內電車）\",\"궤도선（노면전차）\",\"สายรถราง\"],\"15.2 km\":[\"15.2 km\",\"15.2 km\",\"15.2 km\",\"15.2 km\",\"15.2 km\"],\"鉄道の系統\":[\"Railway lines\",\"铁道线路\",\"鐵道路線\",\"철도 계통\",\"สายรถไฟ\"],\"4 系統\":[\"4 lines\",\"4条线路\",\"4條路線\",\"4계통\",\"4 สาย\"],\"TOYAMA LOCAL TRACKS\":[\"TOYAMA LOCAL TRACKS\",\"TOYAMA LOCAL TRACKS\",\"TOYAMA LOCAL TRACKS\",\"TOYAMA LOCAL TRACKS\",\"TOYAMA LOCAL TRACKS\"],\"← 特集一覧 / Features\":[\"← All features\",\"← 专题一览\",\"← 專題一覽\",\"← 특집 목록\",\"← บทความพิเศษทั้งหมด\"],\"都会の名車が、第二の人生を走る。\\n地鉄レトロ車両図鑑\":[\"Famous City Trains on Their Second Run\\nChitetsu's Retro Train Guide\",\"都市名车开启第二人生\\n地铁复古车辆图鉴\",\"都市名車開啟第二人生\\n地鐵復古車輛圖鑑\",\"도시의 명차가 제2의 인생을 달린다\\n지테쓰 레트로 차량 도감\",\"รถไฟชื่อดังในชีวิตที่สอง\\nสมุดภาพรถไฟเรโทรของจิเท็ตสึ\"],\"Second Life on the Rails: Chitetsu’s Legendary Trains\":[\"Second Life on the Rails: Chitetsu’s Legendary Trains\",\"Second Life on the Rails: Chitetsu’s Legendary Trains\",\"Second Life on the Rails: Chitetsu’s Legendary Trains\",\"Second Life on the Rails: Chitetsu’s Legendary Trains\",\"Second Life on the Rails: Chitetsu’s Legendary Trains\"],\"掲載 2026.06　｜　読了 約6分 / 6 min read　｜　写真提供：富山地方鉄道\":[\"Published 2026.06　|　6 min read　|　Photos: Toyama Chiho Railway\",\"发布 2026.06　｜　阅读约6分钟　｜　照片提供：富山地方铁道\",\"發布 2026.06　｜　閱讀約6分鐘　｜　照片提供：富山地方鐵道\",\"게재 2026.06　｜　읽는 시간 약 6분　｜　사진 제공: 도야마 지방철도\",\"เผยแพร่ 2026.06　｜　อ่าน 6 นาที　｜　ภาพ: รถไฟโทยามะ ชิโฮ\"],\"富山地方鉄道の大きな魅力は、ホームで待つたびに違う車両がやって来ること。西武の特急、京阪の名車、東急の通勤電車——全国から集まった車両たちが、立山連峰を背にいまも現役で走っています。電鉄富山駅の隣、稲荷町の車庫を取材して見えてきた、イチオシの6両を紹介します。\":[\"One of the joys of Toyama Chiho Railway is that a different train pulls in every time you wait. Seibu limited expresses, Keihan classics, Tokyu commuter trains — cars from all over Japan still run here against the Tateyama Range. Here are our 6 favorites, from a visit to the Inarimachi depot next to Dentetsu-Toyama.\",\"富山地方铁道的一大魅力，是每次在站台等车都会来不同的车辆。西武特急、京阪名车、东急通勤电车——来自全国的车辆至今仍以立山连峰为背景活跃运行。探访电铁富山站旁的稻荷町车库后，为您介绍6辆推荐车辆。\",\"富山地方鐵道的一大魅力，是每次在月台等車都會來不同的車輛。西武特急、京阪名車、東急通勤電車——來自全國的車輛至今仍以立山連峰為背景活躍運行。探訪電鐵富山站旁的稻荷町車庫後，為您介紹6輛推薦車輛。\",\"도야마 지방철도의 큰 매력은 승강장에서 기다릴 때마다 다른 차량이 온다는 것. 세이부 특급, 게이한 명차, 도큐 통근 전차—전국에서 모인 차량들이 다테야마 연봉을 배경으로 지금도 현역으로 달립니다. 덴테쓰토야마역 옆 이나리마치 차고를 취재해 찾은 추천 6량을 소개합니다.\",\"เสน่ห์ของรถไฟโทยามะ ชิโฮคือทุกครั้งที่รอ จะมีรถไฟคนละแบบมาจอด รถด่วนเซบุ รถคลาสสิกเคฮัง รถโดยสารโทคิว รถไฟจากทั่วญี่ปุ่นยังวิ่งโดยมีเทือกเขาทาเตยามะเป็นฉากหลัง นี่คือ 6 ขบวนเด็ดจากการเยือนโรงซ่อมอินาริมาจิ ข้างสถานีเด็นเท็ตสึ-โทยามะ\"],\"The “Pumpkin” Train\":[\"The “Pumpkin” Train\",\"The “Pumpkin” Train\",\"The “Pumpkin” Train\",\"The “Pumpkin” Train\",\"The “Pumpkin” Train\"],\"Ex-Tokyu Commuter\":[\"Ex-Tokyu Commuter\",\"Ex-Tokyu Commuter\",\"Ex-Tokyu Commuter\",\"Ex-Tokyu Commuter\",\"Ex-Tokyu Commuter\"],\"Toyama-Moyō Livery\":[\"Toyama-Moyō Livery\",\"Toyama-Moyō Livery\",\"Toyama-Moyō Livery\",\"Toyama-Moyō Livery\",\"Toyama-Moyō Livery\"],\"The “Daikon” Train\":[\"The “Daikon” Train\",\"The “Daikon” Train\",\"The “Daikon” Train\",\"The “Daikon” Train\",\"The “Daikon” Train\"],\"稲荷町車庫（電鉄富山の隣・稲荷町駅）\":[\"Inarimachi Depot (Inarimachi Station, next to Dentetsu-Toyama)\",\"稻荷町车库（电铁富山旁・稻荷町站）\",\"稻荷町車庫（電鐵富山旁・稻荷町站）\",\"이나리마치 차고（덴테쓰토야마 옆・이나리마치역）\",\"โรงซ่อมอินาริมาจิ (สถานีอินาริมาจิ ข้างเด็นเท็ตสึ-โทยามะ)\"],\"写真2：アルプスエキスプレス（追加用）\":[\"Photo 2: Alps Express (extra)\",\"照片2：阿尔卑斯快车（追加用）\",\"照片2：阿爾卑斯快車（追加用）\",\"사진2: 알프스 익스프레스（추가용）\",\"ภาพ 2: แอลป์เอกซ์เพรส (เพิ่มเติม)\"],\"写真3：アルプスエキスプレス（追加用）\":[\"Photo 3: Alps Express (extra)\",\"照片3：阿尔卑斯快车（追加用）\",\"照片3：阿爾卑斯快車（追加用）\",\"사진3: 알프스 익스프레스（추가용）\",\"ภาพ 3: แอลป์เอกซ์เพรส (เพิ่มเติม)\"],\"車窓を「絵画」に見立てた、走るギャラリー。\":[\"A rolling gallery that frames the view like a painting.\",\"将车窗比作“画作”的移动画廊。\",\"將車窗比作「畫作」的移動畫廊。\",\"차창을 '그림'처럼 담은 달리는 갤러리.\",\"แกลเลอรีเคลื่อนที่ที่ทำให้วิวเหมือนภาพวาด\"],\"九州の観光列車で知られる水戸岡鋭治氏が手がけた内装。木の窓枠が車窓を額縁のように切り取り、外向きのカウンター席からは立山連峰や田園がまっすぐ目に飛び込みます。椅子や照明、飾られた富山の土人形まで、細部すべてが見どころです。\":[\"Interiors by Eiji Mitooka, famous for Kyushu's sightseeing trains. Wooden frames turn the windows into pictures, and window-facing counter seats put the Tateyama Range and rice fields right in front of you. Every detail — chairs, lights, even the Toyama clay dolls on display — is worth a look.\",\"内装由以九州观光列车闻名的水户冈锐治设计。木制窗框将车窗框成画，面向窗外的吧台座位让立山连峰和田园直入眼帘。座椅、灯具乃至装饰的富山土人偶，每个细节都值得一看。\",\"內裝由以九州觀光列車聞名的水戶岡銳治設計。木製窗框將車窗框成畫，面向窗外的吧台座位讓立山連峰和田園直入眼簾。座椅、燈具乃至裝飾的富山土人偶，每個細節都值得一看。\",\"규슈 관광열차로 유명한 미토오카 에이지가 디자인한 내장. 나무 창틀이 차창을 액자처럼 담고, 바깥을 향한 카운터석에서는 다테야마 연봉과 논밭이 곧장 눈에 들어옵니다. 의자, 조명, 장식된 도야마 흙인형까지 모든 디테일이 볼거리.\",\"ภายในออกแบบโดยเอจิ มิโตโอกะ ผู้มีชื่อเสียงจากรถไฟท่องเที่ยวคิวชู กรอบไม้ทำให้หน้าต่างเหมือนภาพ ที่นั่งเคาน์เตอร์หันออกนอกมองเห็นเทือกเขาทาเตยามะและทุ่งนา ทุกรายละเอียด ทั้งเก้าอี้ ไฟ และตุ๊กตาดินโทยามะ น่าชมทั้งหมด\"],\"Former operator\":[\"Former operator\",\"Former operator\",\"Former operator\",\"Former operator\",\"Former operator\"],\"西武鉄道 特急「レッドアロー」\":[\"Seibu Railway Red Arrow limited express\",\"西武铁道 特急“Red Arrow”\",\"西武鐵道 特急「Red Arrow」\",\"세이부 철도 특급 '레드 애로'\",\"รถด่วนพิเศษเรดแอร์โรว์ของเซบุ\"],\"約30年（現デザインは2011年から）\":[\"About 30 years (current design since 2011)\",\"约30年（现设计自2011年起）\",\"約30年（現設計自2011年起）\",\"약 30년（현 디자인은 2011년부터）\",\"ประมาณ 30 ปี (ดีไซน์ปัจจุบันตั้งแต่ปี 2011)\"],\"首都圏の特急が、渓谷へ向かう観光列車に。\":[\"A Tokyo-area express reborn as a sightseeing train to the gorge.\",\"首都圈特急，变身前往峡谷的观光列车。\",\"首都圈特急，變身前往峽谷的觀光列車。\",\"수도권 특급이 계곡으로 향하는 관광열차로.\",\"รถด่วนจากโตเกียว กลายเป็นรถไฟท่องเที่ยวสู่หุบเขา\"],\"2020年まで西武池袋線・秩父線の特急「ニューレッドアロー」として走っていた車両。座席は広く、ひじ掛けに飲み物を置けるゆとりも。車内にトイレがあるので、宇奈月温泉や立山までの長い乗車も快適です。\":[\"This train ran as the New Red Arrow limited express on Seibu's Ikebukuro and Chichibu lines until 2020. Roomy seats with space for a drink on the armrest, plus an on-board toilet, make long rides to Unazuki Onsen or Tateyama comfortable.\",\"直到2020年都作为西武池袋线・秩父线特急“New Red Arrow”运行的车辆。座位宽敞，扶手可放饮料，车内有洗手间，前往宇奈月温泉或立山的长途乘车也很舒适。\",\"直到2020年都作為西武池袋線・秩父線特急「New Red Arrow」運行的車輛。座位寬敞，扶手可放飲料，車內有洗手間，前往宇奈月溫泉或立山的長途搭乘也很舒適。\",\"2020년까지 세이부 이케부쿠로선・지치부선 특급 '뉴 레드 애로'로 달리던 차량. 좌석이 넓고 팔걸이에 음료를 둘 여유도. 차내 화장실이 있어 우나즈키 온천이나 다테야마까지 긴 승차도 쾌적합니다.\",\"รถไฟขบวนนี้วิ่งเป็นรถด่วนพิเศษ \\\"นิวเรดแอร์โรว์\\\" บนสายอิเคบุคุโระและชิจิบุของเซบุจนถึงปี 2020 ที่นั่งกว้าง วางเครื่องดื่มบนที่วางแขนได้ มีห้องน้ำบนรถ นั่งไกลไปอุนาซึกิออนเซ็นหรือทาเตยามะก็สบาย\"],\"西武鉄道「ニューレッドアロー」\":[\"Seibu Railway New Red Arrow\",\"西武铁道“New Red Arrow”\",\"西武鐵道「New Red Arrow」\",\"세이부 철도 '뉴 레드 애로'\",\"นิวเรดแอร์โรว์ของเซบุ\"],\"西武池袋線・西武秩父線の特急（〜2020年）\":[\"Limited express on the Seibu Ikebukuro & Chichibu lines (until 2020)\",\"西武池袋线・西武秩父线特急（〜2020年）\",\"西武池袋線・西武秩父線特急（〜2020年）\",\"세이부 이케부쿠로선・지치부선 특급（〜2020년）\",\"รถด่วนพิเศษสายอิเคบุคุโระและชิจิบุของเซบุ (ถึงปี 2020)\"],\"写真2：キャニオンエキスプレス（追加用）\":[\"Photo 2: Canyon Express (extra)\",\"照片2：峡谷快车（追加用）\",\"照片2：峽谷快車（追加用）\",\"사진2: 캐니언 익스프레스（추가용）\",\"ภาพ 2: แคนยอนเอกซ์เพรส (เพิ่มเติม)\"],\"写真3：キャニオンエキスプレス（追加用）\":[\"Photo 3: Canyon Express (extra)\",\"照片3：峡谷快车（追加用）\",\"照片3：峽谷快車（追加用）\",\"사진3: 캐니언 익스프레스（추가용）\",\"ภาพ 3: แคนยอนเอกซ์เพรส (เพิ่มเติม)\"],\"写真2：かぼちゃ電車（追加用）\":[\"Photo 2: Pumpkin Train (extra)\",\"照片2：南瓜电车（追加用）\",\"照片2：南瓜電車（追加用）\",\"사진2: 호박 전차（추가용）\",\"ภาพ 2: รถไฟฟักทอง (เพิ่มเติม)\"],\"写真3：かぼちゃ電車（追加用）\":[\"Photo 3: Pumpkin Train (extra)\",\"照片3：南瓜电车（追加用）\",\"照片3：南瓜電車（追加用）\",\"사진3: 호박 전차（추가용）\",\"ภาพ 3: รถไฟฟักทอง (เพิ่มเติม)\"],\"40年以上、地鉄の顔として走り続ける名車。\":[\"A classic that's been the face of Chitetsu for over 40 years.\",\"40多年来一直作为地铁门面运行的名车。\",\"40多年來一直作為地鐵門面運行的名車。\",\"40년 이상 지테쓰의 얼굴로 달려온 명차.\",\"รถคลาสสิกที่เป็นหน้าเป็นตาของจิเท็ตสึมากว่า 40 ปี\"],\"山や川に映える黄色と緑の車体から「かぼちゃ電車」の愛称で親しまれる、元京阪の車両。向きを変えられる座席と、昔ながらの窓から眺める田園と山並みは、ローカル線ならではのぜいたくな時間です。\":[\"Formerly a Keihan train, its yellow-and-green body pops against mountains and rivers — hence the nickname \\\"Pumpkin Train\\\". Reversible seats and old-style windows looking out on rice fields and mountains make for a classic local-line treat.\",\"原京阪车辆，黄绿车身与山川相映，被亲切地称为“南瓜电车”。可转向的座位和从老式车窗眺望的田园与群山，是地方线独有的奢侈时光。\",\"原京阪車輛，黃綠車身與山川相映，被親切地稱為「南瓜電車」。可轉向的座位和從老式車窗眺望的田園與群山，是地方線獨有的奢侈時光。\",\"산과 강에 잘 어울리는 노랑과 초록 차체로 '호박 전차'라는 애칭으로 사랑받는 전 게이한 차량. 방향을 바꿀 수 있는 좌석과 옛날식 창으로 보는 논밭과 산은 로컬선만의 호사스러운 시간.\",\"อดีตรถไฟเคฮัง ตัวรถสีเหลือง-เขียวโดดเด่นตัดกับภูเขาและแม่น้ำ จึงได้ชื่อเล่นว่า \\\"รถไฟฟักทอง\\\" ที่นั่งหมุนได้และหน้าต่างแบบเก่าที่มองเห็นทุ่งนาและภูเขา คือความหรูแบบรถไฟท้องถิ่น\"],\"東京の通勤電車が、立山連峰の麓で第二の人生。\":[\"A Tokyo commuter train's second life at the foot of the Tateyama Range.\",\"东京的通勤电车，在立山连峰脚下开启第二人生。\",\"東京的通勤電車，在立山連峰腳下開啟第二人生。\",\"도쿄의 통근 전차가 다테야마 연봉 기슭에서 제2의 인생.\",\"รถไฟโดยสารโตเกียว ชีวิตที่สองที่เชิงเทือกเขาทาเตยามะ\"],\"かつて東京や神奈川で毎日たくさんの人を運んだステンレスの車両。首都圏で暮らしたことのある人には、どこか懐かしい再会になるかもしれません。\":[\"Stainless-steel cars that once carried crowds every day in Tokyo and Kanagawa. If you've lived in the Tokyo area, it might feel like meeting an old friend.\",\"曾在东京和神奈川每天运送大量乘客的不锈钢车辆。对在首都圈生活过的人来说，或许是一场怀念的重逢。\",\"曾在東京和神奈川每天運送大量乘客的不鏽鋼車輛。對在首都圈生活過的人來說，或許是一場懷念的重逢。\",\"한때 도쿄와 가나가와에서 매일 많은 사람을 실어 나르던 스테인리스 차량. 수도권에 살았던 사람에게는 어딘가 그리운 재회가 될지도 모릅니다.\",\"รถสแตนเลสที่เคยขนผู้คนมากมายทุกวันในโตเกียวและคานางาวะ ใครเคยอยู่โตเกียวอาจรู้สึกเหมือนเจอเพื่อนเก่า\"],\"写真2：元東急の車両（追加用）\":[\"Photo 2: Ex-Tokyu car (extra)\",\"照片2：原东急车辆（追加用）\",\"照片2：原東急車輛（追加用）\",\"사진2: 전 도큐 차량（추가용）\",\"ภาพ 2: รถอดีตโทคิว (เพิ่มเติม)\"],\"写真3：元東急の車両（追加用）\":[\"Photo 3: Ex-Tokyu car (extra)\",\"照片3：原东急车辆（追加用）\",\"照片3：原東急車輛（追加用）\",\"사진3: 전 도큐 차량（추가용）\",\"ภาพ 3: รถอดีตโทคิว (เพิ่มเติม)\"],\"写真2：「とやまもよう」の車両（追加用）\":[\"Photo 2: Toyama-Moyō car (extra)\",\"照片2：“富山图案”车辆（追加用）\",\"照片2：「富山圖案」車輛（追加用）\",\"사진2: '도야마모요' 차량（추가용）\",\"ภาพ 2: รถลายโทยามะโมโย (เพิ่มเติม)\"],\"写真3：「とやまもよう」の車両（追加用）\":[\"Photo 3: Toyama-Moyō car (extra)\",\"照片3：“富山图案”车辆（追加用）\",\"照片3：「富山圖案」車輛（追加用）\",\"사진3: '도야마모요' 차량（추가용）\",\"ภาพ 3: รถลายโทยามะโมโย (เพิ่มเติม)\"],\"富山の県鳥・雷鳥をまとった、街なかで目を引く一両。\":[\"Dressed in Toyama's prefectural bird, the ptarmigan — an eye-catcher in town.\",\"身披富山县鸟雷鸟图案，在街头格外引人注目。\",\"身披富山縣鳥雷鳥圖案，在街頭格外引人注目。\",\"도야마현의 새 뇌조를 두른, 거리에서 눈길을 끄는 차량.\",\"ประดับด้วยนกประจำจังหวัดโทยามะ นกพทาร์มิแกน โดดเด่นในเมือง\"],\"県の鳥・雷鳥をモチーフにしたデザインの車両。駅や沿線で見かけると、思わずカメラを向けたくなる個性的なカラーです。\":[\"A design inspired by the ptarmigan, Toyama's prefectural bird. Its bold colors will have you reaching for your camera.\",\"以县鸟雷鸟为主题设计的车辆，个性十足的配色让人在车站或沿线看到时忍不住举起相机。\",\"以縣鳥雷鳥為主題設計的車輛，個性十足的配色讓人在車站或沿線看到時忍不住舉起相機。\",\"현의 새 뇌조를 모티프로 한 디자인 차량. 역이나 노선에서 보면 저도 모르게 카메라를 들이대고 싶어지는 개성적인 컬러입니다.\",\"รถที่ออกแบบจากนกพทาร์มิแกน นกประจำจังหวัด สีสันโดดเด่นจนอยากหยิบกล้องถ่าย\"],\"雷鳥をモチーフにした「とやまもよう」\":[\"Toyama-Moyō pattern featuring the ptarmigan\",\"以雷鸟为主题的“富山图案”\",\"以雷鳥為主題的「富山圖案」\",\"뇌조를 모티프로 한 '도야마모요'\",\"ลายโทยามะโมโยจากนกพทาร์มิแกน\"],\"見れば納得。親しみを込めて「だいこん」。\":[\"One look and you'll get it — affectionately called \\\"Daikon\\\".\",\"一看就懂，亲切地称为“萝卜”。\",\"一看就懂，親切地稱為「蘿蔔」。\",\"보면 납득. 친근하게 '무'.\",\"เห็นแล้วเข้าใจ เรียกกันอย่างเอ็นดูว่า \\\"หัวไชเท้า\\\"\"],\"その色合いから「だいこん電車」と呼ばれ、沿線で親しまれている車両。見るたびに「確かにだいこんだ」と思わずうなずいてしまう、地鉄らしいユーモアのある一両です。\":[\"Called the \\\"Daikon Train\\\" for its colors, it's a local favorite. Every time you see it, you'll nod — yep, it does look like a daikon radish. Classic Chitetsu humor.\",\"因配色被称为“萝卜电车”，深受沿线居民喜爱。每次看到都会不禁点头“确实像萝卜”，充满地铁式幽默。\",\"因配色被稱為「蘿蔔電車」，深受沿線居民喜愛。每次看到都會不禁點頭「確實像蘿蔔」，充滿地鐵式幽默。\",\"그 색감으로 '무 전차'라 불리며 노선에서 사랑받는 차량. 볼 때마다 '정말 무네' 하고 고개를 끄덕이게 되는, 지테쓰다운 유머의 한 량.\",\"ได้ชื่อว่า \\\"รถไฟหัวไชเท้า\\\" จากสีของมัน เป็นที่รักของคนในพื้นที่ เห็นทีไรก็ต้องพยักหน้าว่าเหมือนหัวไชเท้าจริงๆ อารมณ์ขันแบบจิเท็ตสึ\"],\"写真2：だいこん電車（追加用）\":[\"Photo 2: Daikon Train (extra)\",\"照片2：萝卜电车（追加用）\",\"照片2：蘿蔔電車（追加用）\",\"사진2: 무 전차（추가용）\",\"ภาพ 2: รถไฟหัวไชเท้า (เพิ่มเติม)\"],\"写真3：だいこん電車（追加用）\":[\"Photo 3: Daikon Train (extra)\",\"照片3：萝卜电车（追加用）\",\"照片3：蘿蔔電車（追加用）\",\"사진3: 무 전차（추가용）\",\"ภาพ 3: รถไฟหัวไชเท้า (เพิ่มเติม)\"],\"TIPS FOR RAILFANS\":[\"TIPS FOR RAILFANS\",\"TIPS FOR RAILFANS\",\"TIPS FOR RAILFANS\",\"TIPS FOR RAILFANS\",\"TIPS FOR RAILFANS\"],\"アルプスエキスプレス・キャニオンエキスプレスは不定期運行。乗れたらラッキーな「レア車両」です。\":[\"The Alps Express and Canyon Express run irregularly — you're lucky if you catch one.\",\"阿尔卑斯快车・峡谷快车不定期运行，能乘坐就是幸运的“稀有车辆”。\",\"阿爾卑斯快車・峽谷快車不定期運行，能搭乘就是幸運的「稀有車輛」。\",\"알프스 익스프레스・캐니언 익스프레스는 부정기 운행. 타면 행운인 '레어 차량'입니다.\",\"แอลป์เอกซ์เพรสและแคนยอนเอกซ์เพรสวิ่งไม่ประจำ ได้นั่งถือว่าโชคดี\"],\"鉄道線・市内電車の全線と特急自由席が1日乗り放題。車両めぐりの強い味方です。\":[\"Unlimited rides for a day on all railway and streetcar lines plus unreserved limited express seats — perfect for train spotting.\",\"1天内无限次乘坐铁道线・市内电车全线及特急自由席，是游览车辆的好帮手。\",\"1天內無限次搭乘鐵道線・市內電車全線及特急自由席，是遊覽車輛的好幫手。\",\"철도선・노면전차 전 노선과 특급 자유석 1일 무제한. 차량 탐방의 든든한 아군입니다.\",\"นั่งรถไฟและรถรางทุกสาย รวมที่นั่งไม่สำรองรถด่วน ได้ไม่จำกัด 1 วัน เหมาะกับการตามล่ารถไฟ\"],\"ホームでは黄色い線の内側から。フラッシュや三脚の使用、線路への立ち入りはご遠慮ください。\":[\"Stay behind the yellow line on platforms. No flash, tripods or stepping onto the tracks.\",\"在站台请站在黄线内侧拍摄。请勿使用闪光灯、三脚架或进入轨道。\",\"在月台請站在黃線內側拍攝。請勿使用閃光燈、三腳架或進入軌道。\",\"승강장에서는 노란 선 안쪽에서. 플래시・삼각대 사용과 선로 진입은 삼가 주세요.\",\"บนชานชาลาอยู่หลังเส้นเหลือง ห้ามใช้แฟลช ขาตั้งกล้อง หรือลงไปบนรางรถไฟ\"],\"鉄道線・市内電車1日フリーきっぷ\":[\"Railway & Streetcar 1-Day Free Pass\",\"铁道线・市内电车1日自由乘车券\",\"鐵道線・市內電車1日自由乘車券\",\"철도선・노면전차 1일 프리 패스\",\"ฟรีพาส 1 วัน รถไฟและรถราง\"],\"全線と特急自由席が1日乗り放題　大人 3,400円\":[\"All lines + unreserved limited express, unlimited for a day　Adult ¥3,400\",\"全线及特急自由席1日自由乘车　成人 3,400日元\",\"全線及特急自由席1日自由乘車　成人 3,400日圓\",\"전 노선과 특급 자유석 1일 무제한　성인 3,400엔\",\"ทุกสายและรถด่วนที่นั่งไม่สำรอง ไม่จำกัด 1 วัน　ผู้ใหญ่ 3,400 เยน\"],\"次の特集 / NEXT STORY\":[\"Next story\",\"下一篇专题\",\"下一篇專題\",\"다음 특집\",\"บทความถัดไป\"],\"大正・昭和の駅舎へ、途中下車。レトロ駅舎めぐり10選\":[\"Hop Off at Taisho- and Showa-Era Stations: 10 Retro Stations to Visit\",\"中途下车，探访大正・昭和时代的车站：复古车站10选\",\"中途下車，探訪大正・昭和時代的車站：復古車站10選\",\"다이쇼・쇼와 시대 역사로 도중하차: 레트로 역사 10선\",\"แวะลงชมสถานียุคไทโชและโชวะ: 10 สถานีเรโทรที่ต้องไป\"],\"10 Retro Stations on the Chitetsu Line\":[\"10 Retro Stations on the Chitetsu Line\",\"10 Retro Stations on the Chitetsu Line\",\"10 Retro Stations on the Chitetsu Line\",\"10 Retro Stations on the Chitetsu Line\",\"10 Retro Stations on the Chitetsu Line\"],\"大正・昭和の駅舎へ、途中下車。\\nレトロ駅舎めぐり10選\":[\"Hop Off at Taisho- and Showa-Era Stations\\n10 Retro Stations to Visit\",\"中途下车，探访大正・昭和车站\\n复古车站10选\",\"中途下車，探訪大正・昭和車站\\n復古車站10選\",\"다이쇼・쇼와 역사로 도중하차\\n레트로 역사 10선\",\"แวะลงชมสถานียุคไทโชและโชวะ\\n10 สถานีเรโทร\"],\"Stepping Back in Time: 10 Retro Stations on the Chitetsu Line\":[\"Stepping Back in Time: 10 Retro Stations on the Chitetsu Line\",\"Stepping Back in Time: 10 Retro Stations on the Chitetsu Line\",\"Stepping Back in Time: 10 Retro Stations on the Chitetsu Line\",\"Stepping Back in Time: 10 Retro Stations on the Chitetsu Line\",\"Stepping Back in Time: 10 Retro Stations on the Chitetsu Line\"],\"掲載 2026.07　｜　読了 約8分 / 8 min read　｜　写真提供：とやま観光推進機構\":[\"Published 2026.07　|　8 min read　|　Photos: Toyama Tourism Organization\",\"发布 2026.07　｜　阅读约8分钟　｜　照片提供：富山观光推进机构\",\"發布 2026.07　｜　閱讀約8分鐘　｜　照片提供：富山觀光推進機構\",\"게재 2026.07　｜　읽는 시간 약 8분　｜　사진 제공: 도야마 관광 추진 기구\",\"เผยแพร่ 2026.07　｜　อ่าน 8 นาที　｜　ภาพ: องค์การส่งเสริมการท่องเที่ยวโทยามะ\"],\"蔦の絡まる駅舎、大正生まれの瓦屋根、田園にぽつんと立つ無人駅。富山地方鉄道の沿線には、時が止まったかのような駅舎がいまも現役で残っています。フリーきっぷを片手に途中下車をくり返し、自分だけのお気に入りの駅を探しに出かけましょう。\":[\"An ivy-covered station, a Taisho-era tiled roof, a lonely unstaffed stop in the rice fields — along Toyama Chiho Railway, stations frozen in time are still in daily use. Grab a free pass, hop off again and again, and find your own favorite.\",\"爬满常春藤的车站、大正时代的瓦屋顶、孤零零伫立在田园中的无人站。富山地方铁道沿线至今仍保留着仿佛时间静止的车站。手持自由乘车券反复中途下车，去寻找只属于你的最爱车站吧。\",\"爬滿常春藤的車站、大正時代的瓦屋頂、孤零零佇立在田園中的無人站。富山地方鐵道沿線至今仍保留著彷彿時間靜止的車站。手持自由乘車券反覆中途下車，去尋找只屬於你的最愛車站吧。\",\"담쟁이덩굴이 감싼 역사, 다이쇼 시대의 기와지붕, 논밭에 덩그러니 선 무인역. 도야마 지방철도 노선에는 시간이 멈춘 듯한 역사가 지금도 현역으로 남아 있습니다. 프리 패스를 들고 도중하차를 반복하며 나만의 역을 찾아 떠나 보세요.\",\"สถานีที่มีไม้เลื้อยปกคลุม หลังคากระเบื้องยุคไทโช สถานีไร้พนักงานโดดเดี่ยวกลางทุ่งนา ตามเส้นทางรถไฟโทยามะ ชิโฮ ยังมีสถานีที่เหมือนเวลาหยุดนิ่งให้บริการอยู่ ถือฟรีพาสแวะลงไปเรื่อยๆ ตามหาสถานีที่ชอบ\"],\"Hayatsuki-Kazumi\":[\"Hayatsuki-Kazumi\",\"Hayatsuki-Kazumi\",\"Hayatsuki-Kazumi\",\"Hayatsuki-Kazumi\",\"Hayatsuki-Kazumi\"],\"10駅（本線7・立山線2・不二越・上滝線1）\":[\"10 stations (Main Line 7, Tateyama Line 2, Fujikoshi-Kamidaki Line 1)\",\"10站（本线7・立山线2・不二越・上泷线1）\",\"10站（本線7・立山線2・不二越・上瀧線1）\",\"10개 역（본선 7・다테야마선 2・후지코시・가미다키선 1）\",\"10 สถานี (สายหลัก 7 สายทาเตยามะ 2 สายฟุจิโคชิ-คามิดากิ 1)\"],\"Platform ticket\":[\"Platform ticket\",\"Platform ticket\",\"Platform ticket\",\"Platform ticket\",\"Platform ticket\"],\"240円（寺田駅・岩峅寺駅など）\":[\"¥240 (Terada, Iwakuraji, etc.)\",\"240日元（寺田站・岩峅寺站等）\",\"240日圓（寺田站・岩峅寺站等）\",\"240엔（데라다역・이와쿠라지역 등）\",\"240 เยน (เทราดะ อิวาคุระจิ ฯลฯ)\"],\"BY LINE ・ STATION NUMBER\":[\"BY LINE ・ STATION NUMBER\",\"BY LINE ・ STATION NUMBER\",\"BY LINE ・ STATION NUMBER\",\"BY LINE ・ STATION NUMBER\",\"BY LINE ・ STATION NUMBER\"],\"Minami-Toyama Station\":[\"Minami-Toyama Station\",\"Minami-Toyama Station\",\"Minami-Toyama Station\",\"Minami-Toyama Station\",\"Minami-Toyama Station\"],\"蔦が絡まる壁面と、手前に続く商店街。駅舎と街並みを一緒にフレームに収めれば、昭和の残り香が漂う一枚に。市内電車の終点とも接続する、鉄道と街がひとつになった交通の要所です。\":[\"Ivy-covered walls and a shopping street right out front. Frame the station and the street together for a shot full of Showa nostalgia. It also connects with the streetcar terminus — a hub where railway and town meet.\",\"爬满常春藤的墙面和门前延伸的商店街。将车站与街景一同入镜，便是一张充满昭和余韵的照片。这里还连接市内电车终点，是铁路与街区融为一体的交通要地。\",\"爬滿常春藤的牆面和門前延伸的商店街。將車站與街景一同入鏡，便是一張充滿昭和餘韻的照片。這裡還連接市內電車終點，是鐵路與街區融為一體的交通要地。\",\"담쟁이덩굴이 감싼 벽면과 앞에 이어지는 상점가. 역사와 거리를 함께 담으면 쇼와의 여운이 감도는 한 장이 됩니다. 노면전차 종점과도 연결되는, 철도와 거리가 하나가 된 교통의 요지.\",\"ผนังมีไม้เลื้อยปกคลุมและถนนช้อปปิ้งด้านหน้า ถ่ายสถานีกับถนนในเฟรมเดียวได้ภาพกลิ่นอายยุคโชวะ ยังเชื่อมกับปลายสายรถราง เป็นจุดที่รถไฟกับเมืองหลอมรวมกัน\"],\"この駅へ行く（JORUDAN VISIT）↗\":[\"Get directions (JORUDAN VISIT) ↗\",\"前往此站（JORUDAN VISIT）↗\",\"前往此站（JORUDAN VISIT）↗\",\"이 역으로 가기（JORUDAN VISIT）↗\",\"นำทางไปสถานีนี้ (JORUDAN VISIT) ↗\"],\"本線と立山線が分かれる乗り換え駅。映画のセットのような駅舎には、撮影に訪れる人も多いのだとか。線路の先には立山連峰が広がり、冬の晴れた日は雪山が圧巻です。電車に乗らなくても、入場券（240円）で構内に入れます。\":[\"The junction where the Main Line and Tateyama Line split. Its movie-set-like building draws plenty of photographers. The Tateyama Range spreads out beyond the tracks — stunning with snow on clear winter days. Even without riding, you can enter with a ¥240 platform ticket.\",\"本线与立山线分岔的换乘站。宛如电影布景的车站吸引了许多前来拍摄的人。铁轨尽头是立山连峰，冬季晴天的雪山尤其壮观。不乘车也可凭入场券（240日元）进站。\",\"本線與立山線分岔的轉乘站。宛如電影布景的車站吸引了許多前來拍攝的人。鐵軌盡頭是立山連峰，冬季晴天的雪山尤其壯觀。不搭車也可憑入場券（240日圓）進站。\",\"본선과 다테야마선이 갈라지는 환승역. 영화 세트 같은 역사에는 촬영하러 오는 사람도 많다고. 선로 끝에는 다테야마 연봉이 펼쳐지고 겨울 맑은 날의 설산은 압권입니다. 전차를 타지 않아도 입장권（240엔）으로 구내에 들어갈 수 있습니다.\",\"สถานีเปลี่ยนสายที่สายหลักกับสายทาเตยามะแยกกัน อาคารเหมือนฉากหนังดึงดูดช่างภาพมากมาย เทือกเขาทาเตยามะทอดยาวสุดราง วันฟ้าใสฤดูหนาวภูเขาหิมะงดงามมาก ไม่ได้นั่งรถไฟก็เข้าชมได้ด้วยตั๋วชานชาลา 240 เยน\"],\"Iwakuraji Station\":[\"Iwakuraji Station\",\"Iwakuraji Station\",\"Iwakuraji Station\",\"Iwakuraji Station\",\"Iwakuraji Station\"],\"100年を超える歴史をもつ駅舎。どこを切り取っても絵になる瓦屋根が目印です。立山線と不二越・上滝線が乗り入れる2面4線の構内も、入場券（240円）で見学できます。\":[\"A station building over 100 years old, recognizable by its photogenic tiled roof. Its 2-platform, 4-track layout served by the Tateyama and Fujikoshi-Kamidaki lines can be seen with a ¥240 platform ticket.\",\"拥有逾百年历史的车站，处处入画的瓦屋顶是其标志。立山线与不二越・上泷线交汇的2面4线站内，也可凭入场券（240日元）参观。\",\"擁有逾百年歷史的車站，處處入畫的瓦屋頂是其標誌。立山線與不二越・上瀧線交會的2面4線站內，也可憑入場券（240日圓）參觀。\",\"100년이 넘는 역사를 지닌 역사. 어디를 찍어도 그림이 되는 기와지붕이 표지입니다. 다테야마선과 후지코시・가미다키선이 들어오는 2면 4선 구내도 입장권（240엔）으로 견학할 수 있습니다.\",\"อาคารสถานีอายุกว่า 100 ปี จุดเด่นคือหลังคากระเบื้องที่ถ่ายมุมไหนก็สวย ชานชาลา 2 ชาน 4 ราง ของสายทาเตยามะและฟุจิโคชิ-คามิดากิ เข้าชมได้ด้วยตั๋วชานชาลา 240 เยน\"],\"旧「尖山駅」（1965年改称）\":[\"Formerly Togariyama Station (renamed 1965)\",\"旧名“尖山站”（1965年更名）\",\"舊名「尖山站」（1965年更名）\",\"구 '도가리야마역'（1965년 개칭）\",\"เดิมชื่อสถานีโทการิยามะ (เปลี่ยนชื่อปี 1965)\"],\"尖山（とがりやま）の麓にひっそりと佇む駅。いまは1面1線ですが、ホームにはかつての2線の名残が。緑に囲まれた姿は、子どもの頃の夏休みを思い出させます。\":[\"A quiet station at the foot of Mt. Togari. It has one track today, but the platform still shows signs of the old second line. Surrounded by green, it'll remind you of childhood summer holidays.\",\"静静伫立在尖山脚下的车站。如今为1面1线，但站台上仍留有昔日2线的痕迹。被绿意环绕的模样，让人想起儿时的暑假。\",\"靜靜佇立在尖山腳下的車站。如今為1面1線，但月台上仍留有昔日2線的痕跡。被綠意環繞的模樣，讓人想起兒時的暑假。\",\"도가리야마 기슭에 조용히 자리한 역. 지금은 1면 1선이지만 승강장에는 예전 2선의 흔적이. 초록에 둘러싸인 모습은 어린 시절 여름방학을 떠올리게 합니다.\",\"สถานีเงียบสงบที่เชิงเขาโทการิ ปัจจุบันมีรางเดียว แต่ชานชาลายังมีร่องรอยรางที่สอง ล้อมรอบด้วยสีเขียว ชวนให้นึกถึงปิดเทอมฤดูร้อนวัยเด็ก\"],\"Hama-Kazumi Station\":[\"Hama-Kazumi Station\",\"Hama-Kazumi Station\",\"Hama-Kazumi Station\",\"Hama-Kazumi Station\",\"Hama-Kazumi Station\"],\"外からは想像できない、レトロな空間が駅舎の中に。ホームの前には田園が広がり、映画のワンシーンのような景色に出会えます。\":[\"Inside is a surprisingly retro space you'd never guess from outside. Rice fields stretch in front of the platform — like a scene from a movie.\",\"车站内是从外面无法想象的复古空间。站台前田园辽阔，宛如电影中的一幕。\",\"車站內是從外面無法想像的復古空間。月台前田園遼闊，宛如電影中的一幕。\",\"밖에서는 상상할 수 없는 레트로한 공간이 역사 안에. 승강장 앞에는 논밭이 펼쳐져 영화의 한 장면 같은 풍경을 만날 수 있습니다.\",\"ภายในเป็นพื้นที่ย้อนยุคที่คาดไม่ถึงจากภายนอก หน้าชานชาลาเป็นทุ่งนากว้าง เหมือนฉากในภาพยนตร์\"],\"Hayatsuki-Kazumi Station\":[\"Hayatsuki-Kazumi Station\",\"Hayatsuki-Kazumi Station\",\"Hayatsuki-Kazumi Station\",\"Hayatsuki-Kazumi Station\",\"Hayatsuki-Kazumi Station\"],\"一歩足を踏み入れると、タイムスリップしたような世界。何気ない駅設備の「着札箱」に、この駅が歩んできた時間が詰まっています。\":[\"Step inside and you've slipped back in time. Even the humble ticket-collection box holds the station's long history.\",\"一踏入就仿佛穿越时空。不起眼的车站设施“收票箱”里，承载着这座车站走过的岁月。\",\"一踏入就彷彿穿越時空。不起眼的車站設施「收票箱」裡，承載著這座車站走過的歲月。\",\"한 발 들어서면 타임슬립한 듯한 세계. 평범한 역 설비 '착찰함'에 이 역이 걸어온 시간이 담겨 있습니다.\",\"ก้าวเข้าไปก็เหมือนย้อนเวลา แม้แต่กล่องรับตั๋วธรรมดาก็เก็บประวัติศาสตร์ยาวนานของสถานีไว้\"],\"Nishi-Uozu Station\":[\"Nishi-Uozu Station\",\"Nishi-Uozu Station\",\"Nishi-Uozu Station\",\"Nishi-Uozu Station\",\"Nishi-Uozu Station\"],\"魚津水族館の最寄り駅。一度見たら忘れられない駅名標と、よく見ると隠れている趣深いディテール。水族館とセットで訪れたい駅です。\":[\"The nearest station to Uozu Aquarium, with an unforgettable station sign and charming hidden details. Visit together with the aquarium.\",\"鱼津水族馆的最近车站。令人过目难忘的站名牌，细看还藏着耐人寻味的细节。适合与水族馆一同造访。\",\"魚津水族館的最近車站。令人過目難忘的站名牌，細看還藏著耐人尋味的細節。適合與水族館一同造訪。\",\"우오즈 수족관에서 가까운 역. 한 번 보면 잊을 수 없는 역명판과 자세히 보면 숨어 있는 운치 있는 디테일. 수족관과 함께 방문하고 싶은 역입니다.\",\"สถานีใกล้พิพิธภัณฑ์สัตว์น้ำอุโอซึ ป้ายชื่อสถานีที่เห็นแล้วลืมไม่ลง และรายละเอียดน่ารักที่ซ่อนอยู่ เที่ยวคู่กับพิพิธภัณฑ์สัตว์น้ำ\"],\"Shitayama Station\":[\"Shitayama Station\",\"Shitayama Station\",\"Shitayama Station\",\"Shitayama Station\",\"Shitayama Station\"],\"北陸新幹線の黒部宇奈月温泉駅と接続する新黒部駅から、歩いて約7分。田んぼと民家に囲まれた木造駅舎の待合室には本が置かれ、のどかな時間が流れています。\":[\"About a 7-min walk from Shin-Kurobe Station, which connects with the Hokuriku Shinkansen at Kurobe-Unazukionsen. The wooden station's waiting room, surrounded by rice paddies and houses, has books to read and a peaceful vibe.\",\"从与北陆新干线黑部宇奈月温泉站相连的新黑部站步行约7分钟。被稻田和民居环绕的木造车站候车室里摆放着书籍，时光悠然流淌。\",\"從與北陸新幹線黑部宇奈月溫泉站相連的新黑部站步行約7分鐘。被稻田和民居環繞的木造車站候車室裡擺放著書籍，時光悠然流淌。\",\"호쿠리쿠 신칸센 구로베우나즈키온센역과 연결된 신구로베역에서 걸어서 약 7분. 논과 민가에 둘러싸인 목조 역사 대합실에는 책이 놓여 있고 한가로운 시간이 흐릅니다.\",\"เดินประมาณ 7 นาทีจากสถานีชินคุโรเบะ ซึ่งเชื่อมกับโฮคุริกุชินคันเซ็นที่คุโรเบะอุนาซึกิออนเซ็น ห้องรอของสถานีไม้ท่ามกลางนาข้าวและบ้านเรือนมีหนังสือให้อ่าน บรรยากาศสงบ\"],\"Urayama Station\":[\"Urayama Station\",\"Urayama Station\",\"Urayama Station\",\"Urayama Station\",\"Urayama Station\"],\"アニメの世界から飛び出してきたような、昔ながらの駅舎。素朴な駅名の文字と周囲の山々、静かな集落が調和し、映画のワンシーンのような写真が撮れます。\":[\"An old-fashioned station that looks straight out of an anime. The simple sign, the surrounding mountains and the quiet village blend together for movie-scene photos.\",\"宛如从动画世界中走出来的古老车站。朴素的站名字体、周围的群山与宁静的村落相互融合，能拍出电影般的照片。\",\"宛如從動畫世界中走出來的古老車站。樸素的站名字體、周圍的群山與寧靜的村落相互融合，能拍出電影般的照片。\",\"애니메이션 세계에서 튀어나온 듯한 옛 역사. 소박한 역명 글자와 주변 산들, 조용한 마을이 어우러져 영화 같은 사진을 찍을 수 있습니다.\",\"สถานีแบบดั้งเดิมที่เหมือนหลุดมาจากอนิเมะ ป้ายชื่อเรียบง่าย ภูเขารอบด้าน และหมู่บ้านเงียบสงบ ถ่ายรูปได้เหมือนฉากหนัง\"],\"青い屋根が印象的な、絵本のような駅舎。待合室のベンチに置かれた座布団が、そっと旅人を迎えてくれます。\":[\"A picture-book station with a striking blue roof. Cushions on the waiting-room bench quietly welcome travelers.\",\"蓝色屋顶令人印象深刻，宛如绘本中的车站。候车室长椅上的坐垫静静迎接旅人。\",\"藍色屋頂令人印象深刻，宛如繪
