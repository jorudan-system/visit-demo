<style>
body{margin:0;background:#F5F1E8}
a{color:#2F4A3C}a:hover{color:#1E3328}

}

.hero-slides>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;animation:heroFade 15s infinite}
.hero-slides>img:nth-of-type(1){position:relative;opacity:1;animation:none}
.hero-slides>img:nth-of-type(2){animation-delay:5s}
.hero-slides>img:nth-of-type(3){animation-delay:10s}
@keyframes heroFade{0%{opacity:0}4%{opacity:1}33%{opacity:1}37%{opacity:0}100%{opacity:0}}
.hero-dots{position:absolute;right:20px;bottom:16px;display:flex;gap:6px;z-index:2}
.hero-dots>span{width:22px;height:4px;background:rgba(255,255,255,0.5);animation:heroDot 15s infinite}
.hero-dots>span:nth-child(2){animation-delay:5s}.hero-dots>span:nth-child(3){animation-delay:10s}

r; justify-content: center; gap: 5px; box-sizing: border-box\">\n          <span style=\"width: 20px; height: 2px; background: #2B2B2B\"></span><span style=\"width: 20px; height: 2px; background: #2B2B2B\"></span><span style=\"width: 20px; height: 2px; background: #2B2B2B\"></span>\n        </summary>\n        <nav aria-label=\"メインメニュー\" style=\"position: absolute; left: 0; right: 0; top: 100%; z-index: 10; background: #F5F1E8; border-bottom: 1px solid #D8CFBD; padding: 8px 20px 20px; display: flex; flex-direction: column; font-size: 16px; font-weight: 500; box-shadow: 0 12px 24px rgba(60,45,20,0.12)\"><a href=\"Tateyama.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">エリア<span aria-hidden=\"true\">›</span></a><a href=\"Courses.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">モデルコース<span aria-hidden=\"true\">›</span></a><a href=\"Tickets.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">お得なチケット<span aria-hidden=\"true\">›</span></a><a href=\"RideRail.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">乗り方・きっぷ購入<span aria-hidden=\"true\">›</span></a><a href=\"Feature.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">特集<span aria-hidden=\"true\">›</span></a><a href=\"Access.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">アクセス<span aria-hidden=\"true\">›</span></a><a href=\"FAQ.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">よくある質問<span aria-hidden=\"true\">›</span></a></nav>\n      </details>\n    </div>\n  </header>\n\n<sc-if value=\"{{ isCar }}\" hint-placeholder-val=\"{{ true }}\">\n  <section style=\"position: relative; background: #141414; color: #F5F1E8\">\n    <img src=\"img/car_canyon.jpg\" alt=\"\" style=\"display: block; width: 100%; height: clamp(420px, 56vw, 680px); object-fit: cover; opacity: 0.78\">\n    <div style=\"position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,10,10,0.15) 20%, rgba(10,10,10,0.88) 100%)\"></div>\n    <div style=\"position: absolute; left: 0; right: 0; bottom: 0; padding: 0 24px 52px\">\n      <div style=\"max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px\">\n        <a href=\"Feature.html\" style=\"color: #E2B865; font-size: 13px\">← 特集一覧 / Features</a>\n        <span style=\"display: flex; gap: 10px; align-items: baseline\"><span style=\"font-size: 13px; font-weight: 700; color: #141414; background: #E2B865; padding: 3px 10px\">特集｜車両</span><span style=\"font-family: 'Cormorant Garamond', serif; font-size: 15px; letter-spacing: 0.3em; color: #E2B865\">ROLLING STOCK</span></span>\n        <h1 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: clamp(28px, 4.4vw, 56px); line-height: 1.4\">都会の名車が、第二の人生を走る。<br>地鉄レトロ車両図鑑</h1>\n        <span style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: clamp(18px, 2.2vw, 26px); color: #E3D8C2\">Second Life on the Rails: Chitetsu’s Legendary Trains</span>\n        <span style=\"font-size: 13px; color: #CFC6B4\">掲載 2026.06　｜　読了 約6分 / 6 min read　｜　写真提供：富山地方鉄道</span>\n      </div>\n    </div>\n  </section>\n  <section style=\"padding: 56px 24px 0\">\n    <div style=\"max-width: 1280px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 32px 48px; align-items: flex-start\">\n      <div style=\"flex: 3 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 24px\">\n        <p style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: 18px; line-height: 2.1\">富山地方鉄道の大きな魅力は、ホームで待つたびに違う車両がやって来ること。西武の特急、京阪の名車、東急の通勤電車——全国から集まった車両たちが、立山連峰を背にいまも現役で走っています。電鉄富山駅の隣、稲荷町の車庫を取材して見えてきた、イチオシの6両を紹介します。</p>\n        <nav aria-label=\"目次\" style=\"background: #FFFDF8; border: 1px solid #D8CFBD; padding: 16px 20px\">\n          <span style=\"display: flex; gap: 10px; align-items: baseline; padding-bottom: 6px\"><span style=\"font-size: 14px; font-weight: 700\">目次</span><span style=\"font-family: 'Cormorant Garamond', serif; font-size: 13px; letter-spacing: 0.2em; color: #6B6458\">CONTENTS</span></span>\n          <a href=\"#c1\" style=\"text-decoration: none; color: #2B2B2B; display: flex; gap: 10px; align-items: baseline; padding: 8px 0; border-top: 1px solid #E6DECC\"><span style=\"font-family: 'Cormorant Garamond', serif; font-size: 16px; color: #8A3B26; min-width: 28px\">01</span><span style=\"font-size: 14px; font-weight: 700\">アルプスエキスプレス</span><span style=\"margin-left: auto; font-size: 12px; color: #6B6458\">Alps Express</span></a><a href=\"#c2\" style=\"text-decoration: none; color: #2B2B2B; display: flex; gap: 10px; align-items: baseline; padding: 8px 0; border-top: 1px solid #E6DECC\"><span style=\"font-family: 'Cormorant Garamond', serif; font-size: 16px; color: #8A3B26; min-width: 28px\">02</span><span style=\"font-size: 14px; font-weight: 700\">キャニオンエキスプレス</span><span style=\"margin-left: auto; font-size: 12px; color: #6B6458\">Canyon Express</span></a><a href=\"#c3\" style=\"text-decoration: none; color: #2B2B2B; display: flex; gap: 10px; align-items: baseline; padding: 8px 0; border-top: 1px solid #E6DECC\"><span style=\"font-family: 'Cormorant Garamond', serif; font-size: 16px; color: #8A3B26; min-width: 28px\">03</span><span style=\"font-size: 14px; font-weight: 700\">かぼちゃ電車</span><span style=\"margin-left: auto; font-size: 12px; color: #6B6458\">The “Pumpkin” Train</span></a><a hr yle=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500; color: #B8AE98\">Lucky catch</span></span>\n            </div>\n            <h3 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: clamp(24px, 2.6vw, 32px); line-height: 1.4\">アルプスエキスプレス</h3>\n            <span style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 20px; color: #5E5648\">Alps Express</span>\n            <span style=\"font-family: 'Noto Serif JP', serif; font-size: 17px; color: #8A3B26; line-height: 1.7\">車窓を「絵画」に見立てた、走るギャラリー。</span>\n            <p style=\"margin: 0; font-size: 15px; line-height: 2; color: #3A342C\">九州の観光列車で知られる水戸岡鋭治氏が手がけた内装。木の窓枠が車窓を額縁のように切り取り、外向きのカウンター席からは立山連峰や田園がまっすぐ目に飛び込みます。椅子や照明、飾られた富山の土人形まで、細部すべてが見どころです。</p>\n            <div style=\"border-bottom: 1px solid #E6DECC\"><div style=\"display: grid; grid-template-columns: 130px 1fr; gap: 10px; padding: 9px 0; border-top: 1px solid #E6DECC\"><span style=\"display: flex; flex-direction: column\"><span style=\"font-size: 12px; color: #5E5648\">元の所属</span><span style=\"font-family: 'Cormorant Garamond', serif; font-size: 12px; color: #8C846F\">Former operator</span></span><span style=\"font-size: 14px; font-weight: 700; line-height: 1.6\">西武鉄道 特急「レッドアロー」</span></div><div style=\"display: grid; grid-template-columns: 130px 1fr; gap: 10px; padding: 9px 0; border-top: 1px solid #E6DECC\"><span style=\"display: flex; flex-direction: column\"><span style=\"font-size: 12px; color: #5E5648\">地鉄での活躍</span><span style=\"font-family: 'Cormorant Garamond', serif; font-size: 12px; color: #8C846F\">With Chitetsu</span></span><span style=\"font-size: 14px; font-weight: 700; line-height: 1.6\">約30年（現デザインは2011年から）</span></div><div style=\"display: grid; grid-template-columns: 130px 1fr; gap: 10px; padding: 9px 0; border-top: 1px solid #E6DECC\"><span style=\"display: flex; flex-direction: column\"><span style=\"font-size: 12px; color: #5E5648\">デザイン</span><span style=\"font-family: 'Cormorant Garamond', serif; font-size: 12px; color: #8C846F\">Designer</span></span><span style=\"font-size: 14px; font-weight: 700; line-height: 1.6\">水戸岡鋭治氏</span></div></div>\n          </div>\n        </article><article id=\"c2\" class=\"fd-entry fd-flip\" style=\"display: flex; flex-wrap: wrap; gap: 28px 48px; align-items: center; padding: 40px 0; border-top: 1px solid #D8CFBD\">\n          <div style=\"flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 12px\">\n            <div style=\"display: flex; flex-wrap: wrap; gap: 10px; align-items: center\">\n              <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 15px; letter-spacing: 0.2em; color: #8A3B26\">No.02</span>\n              <span style=\"font-size: 13px; font-weight: 700; color: #3A2A10; background: linear-gradient(180deg, #E8C877, #B98E3B); border: 1px solid #8C6A26; padding: 3px 12px; letter-spacing: 0.08em\">20020形</span>\n              <span style=\"display: inline-flex; gap: 8px; align-items: center; font-size: 12px; font-weight: 700; color: #F5F1E8; background: #1E1E1C; padding: 4px 10px\"><span style=\"color: #E2B865\">●</span><span style=\"color: #5A564E\">●</span><span style=\"color: #5A564E\">●</span><span>不定期運行</span><span style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500; color: #B8AE98\">Lucky catch</span></span>\n            </div>\n            <h3 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: clamp(24px, 2.6vw, 32px); line-height: 1.4\">キャニオンエキスプレス</h3>\n            <span style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 20px; color: #5E5648\">Canyon Express</span>\n            <span style=\"font-family: 'Noto Serif JP', serif; font-size: 17px; color: #8A3B26; line-height: 1.7\">首都圏の特急が、渓谷へ向かう観光列車に。</span>\n            <p style=\"margin: 0; font-size: 15px; line-height: 2; color: #3A342C\">2020年まで西武池袋線・秩父線の特急「ニューレッドアロー」として走っていた車両。座席は広く、ひじ掛けに飲み物を置けるゆとりも。車内にトイレがあるので、宇奈月温泉や立山までの長い乗車も快適です。</p>\n            <div style=\"border-bottom: 1px solid #E6DECC\"><div style=\"display: grid; grid-template-columns: 130px 1fr; gap: 10px; padding: 9px 0; border-top: 1px solid #E6DECC\"><span style=\"display: flex; flex-direction: column\"><span style=\"font-size: 12px; color: #5E5648\">元の所属</span><span style=\"font-family: 'Cormorant Garamond', serif; font-size: 12px; color: #8C846F\">Former operator</span></span><span style=\"font-size: 14px; font-weight: 700; line-height: 1.6\">西武鉄道「ニューレッドアロー」</span></div><div style=\"display: grid; grid-template-columns: 130px 1fr; gap: 10px; padding: 9px 0; border-top: 1px solid #E6DECC\"><span style=\"display: flex; flex-direction: column\"><span style=\"font-size: 12px; color: #5E5648\">前職</span><span style=\"font-family: 'Cormorant Garamond', serif; font-size: 12px; color: #8C846F\">Previous route</span></span><span style=\"font-size: 14px; font-weight: 700; line-height: 1.6\">西武池袋線・西武秩父線の特急（〜2020年）</span></div><div style=\"display: grid; grid-template-columns: 130px 1fr; gap: 10px; padding: 9px 0; border-top: 1px solid #E6DECC\"><span style=\"display: flex; flex-direction: column\"><span style=\"font-size: 12px; color: #5E5648\">車内</span><span style=\"font-family: 'Cormorant Garamond', serif; font-size: 12px; color: #8C846F\">On board</span></span><span style=\"font-size: 14px; font-weight: 700; line-height: 1.6\">ゆったり座席・トイレ付き</span></div></div>\n          </div><div style=\"flex: 1 1 480px; min-width: 0\"><div style=\"position: relative; aspect-ratio: 4 / 3; background: #2B2B2B\"><div class=\"ph-car\" style=\"position: absolute; inset: 0; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth\"><div id=\"ph2-1\" style=\"flex: 0 0 100%; scroll-snap-align: start; height: 100%\"><img src=\"img/car_canyon.jpg\" alt=\"キャニオンエキスプレス\" style=\"width: 100%; height: 100%; object-fit: cover; display: block\"></div><div id=\"ph2-2\" style=\"flex: 0 0 100%; scroll-snap-align: start; height: 100%\"><div style=\"width: 100%; height: 100%; background: #8C7A5E; display: flex; align-items: flex-end; padding: 12px; box-sizing: border-box\"><span style=\"font-size: 12px; color: #FFFFFF; background: rgba(20,20,20,0.6); padding: 2px 8px\">写真2：キャニオンエキスプレス（追加用）</span></div></div><div id=\"ph2-3\" style=\"flex: 0 0 100%; scroll-snap-align: start; height: 100%\"><div style=\"width: 100%; height: 100%; background: #8C7A5E; display: flex; align-items: flex-end; padding: 12px; box-sizing: border-box\"><span style=\"font-size: 12px; color: #FFFFFF; background: rgba(20,20,20,0.6); padding: 2px 8px\">写真3：キャニオンエキスプレス（追加用）</span></div></div></div><div style=\"position: absolute; left: 0; right: 0; bottom: 10px; display: flex; gap: 8px; justify-content: center\"><a href=\"#ph2-1\" aria-label=\"写真1\" style=\"width: 10px; height: 10px; border-radius: 50%; background: #FFFFFF; display: block\"></a><a href=\"#ph2-2\" aria-label=\"写真2\" style=\"width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.55); display: block\"></a><a href=\"#ph2-3\" aria-label=\"写真3\" style=\"width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.55); display: block\"></a></div><span style=\"position: absolute; right: 10px; top: 10px; font-size: 11px; color: #FFFFFF; background: rgba(20,20,20,0.55); padding: 2px 8px\">1 / 3　横にスライド</span></div></div>\n        </article><article id=\"c3\" class=\"fd-entry\" style=\"display: flex; flex-wrap: wrap; gap: 28px 48px; align-items: center; padding: 40px 0; border-top: 1px solid #D8CFBD\">\n          <div style=\"flex: 1 1 480px; min-width: 0\"><div style=\"position: relative; aspect-ratio: 4 / 3; background: #2B2B2B\"><div class=\"ph-car\" style=\"position: absolute; inset: 0; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth\"><div id=\"ph3-1\" style=\"flex: 0 0 100%; scroll-snap-align: start; height: 100%\"><img src=\"img/car_kabocha.jpg\" alt=\"かぼちゃ電車\" style=\"width: 100%; height: 100%; object-fit: cover; display: block\"></div><div id=\"ph3-2\" style=\"flex: 0 0 100%; scroll-snap-align: start; height: 100%\"><div style=\"width: 100%; height: 100%; background: #8C7A5E; display: flex; align-items: flex-end; padding: 12px; box-sizing: border-box\"><span style=\"font-size: 12px; color: #FFFFFF; background: rgba(20,20,20,0.6); padding: 2px 8px\">写真2：かぼちゃ電車（追加用）</span></div></div><div id=\"ph3-3\" style=\"flex: 0 0 100%; scroll-snap-align: start; height: 100%\"><div style=\"width: 100%; height: 100%; background: #8C7A5E; display: flex; align-items: flex-end; padding: 12px; box-sizing: border-box\"><span style=\"font-size: 12px; color: #FFFFFF; background: rgba(20,20,20,0.6); padding: 2px 8px\">写真3：かぼちゃ電車（追加用）</span></div></div></div><div style=\"position: absolute; left: 0; right: 0; bottom: 10px; display: flex; gap: 8px; justify-content: center\"><a href=\"#ph3-1\" aria-label=\"写真1\" style=\"width: 10px; height: 10px; border-radius: 50%; background: #FFFFFF; display: block\"></a><a href=\"#ph3-2\" aria-label=\"写真2\" style=\"width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.55); display: block\"></a><a href=\"#ph3-3\" aria-label=\"写真3\" style=\"width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.55); display: block\"></a></div><span style=\"position: absolute; right: 10px; top: 10px; font-size: 11px; color: #FFFFFF; background: rgba(20,20,20,0.55); padding: 2px 8px\">1 / 3　横にスライド</span></div></div><div style=\"flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 12px\">\n            <div style=\"display: flex; flex-wrap: wrap; gap: 10px; align-items: center\">\n              <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 15px; letter-spacing: 0.2em; color: #8A3B26\">No.03</span>\n              <span style=\"font-size: 13px; font-weight: 700; color: #3A2A10; background: linear-gradient(180deg, #E8C877, #B98E3B); border: 1px solid #8C6A26; padding: 3px 12px; letter-spacing: 0.08em\">10030形</span>\n              <span style=\"display: inline-flex; gap: 8px; align-items: center; font-size: 12px; font-weight: 700; color: #F5F1E8; background: #1E1E1C; padding: 4px 10px\"><span style=\"color: #E2B865\">●</span><span style=\"color: #E2B865\">●</span><span style=\"color: #E2B865\">●</span><span>よく走っています</span><span style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500; color: #B8AE98\">Common</span></span>\n            </div>\n            <h3 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: clamp(24px, 2.6vw, 32px); line-height: 1.4\">かぼちゃ電車</h3>\n            <span style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 20px; color: #5E5648\">The “Pumpkin” Train</span>\n            <span style=\"font-family: 'Noto Serif JP', serif; font-size: 17px; color: #8A3B26; line-height: 1.7\">40年以上、地鉄の顔として走り続ける名車。</span>\n            <p style=\"margin: 0; font-size: 15px; line-height: 2; color: #3A342C\">山や川に映える黄色と緑の車体から「かぼちゃ電車」の愛称で親しまれる、元京阪の車両。向きを変えられる座席と、昔ながらの窓から眺める田園と山並みは、ローカル線ならではのぜいたくな時間です。</p>\n            <div style=\"border-bottom: 1px solid #E6DECC\"><div style=\"display: grid; grid-template-columns: 130px 1fr; gap: 10px; padding: 9px 0; border-top: 1px solid #E6DECC\"><span style=\"display: flex; flex-direction: column\"><span style=\"font-size: 12px; color: #5E5648\">元の所属</span><span style=\"font-family: 'Cormorant Garamond', serif; font-size: 12px; color: #8C846F\">Former operator</span></span><span style=\"font-size: 14px; font-weight: 700; line-height: 1.6\">京阪電気鉄道</span></div><div style=\"display: grid; grid-template-columns: 130px 1fr; gap: 10px; padding: 9px 0; border-top: 1px solid #E6DECC\"><span style=\"display: flex; flex-direction: column\"><span style=\"font-size: 12px; color: #5E5648\">地鉄での活躍</span><span style=\"font-family: 'Cormorant Garamond', serif; font-size: 12px; color: #8C846F\">With Chitetsu</span></span><span style=\"font-size: 14px; font-weight: 700; line-height: 1.6\">40年以上</span></div><div style=\"display: grid; grid-template-columns: 130px 1fr; gap: 10px; padding: 9px 0; border-top: 1px solid #E6DECC\"><span style=\"display: flex; flex-direction: column\"><span style=\"font-size: 12px; color: #5E5648\">愛称の由来</span><span style=\"font-family: 'Cormorant Garamond', serif; font-size: 12px; color: #8C846F\">Nickname</span></span><span style=\"font-size: 14px; font-weight: 700; line-height: 1.6\">黄色と緑の車体色から</span></div></div>\n          </div>\n        </article><article id=\"c4\" class=\"fd-entry fd-flip\" style=\"display: flex; flex-wrap: wrap; gap: 28px 48px; align-items: center; padding: 40px 0; border-top: 1px solid #D8CFBD\">\n          <div style=\"flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 12px\">\n            <div style=\"display: flex; flex-wrap: wrap; gap: 10px; align-items: center\">\n              <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 15px; letter-spacing: 0.2em; color: #8A3B26\">No.04</span>\n              <span style=\"font-size: 13px; font-weight: 700; color: #3A2A10; background: linear-gradient(180deg, #E8C877, #B98E3B); border: 1px solid #8C6A26; padding: 3px 12px; letter-spacing: 0.08em\">17480形</span>\n              <span style=\"display: inline-flex; gap: 8px; align-items: center; font-size: 12px; font-weight: 700; color: #F5F1E8; background: #1E1E1C; padding: 4px 10px\"><span style=\"color: #E2B865\">●</span><span style=\"color: #E2B865\">●</span><span style=\"color: #E2B865\">●</span><span>よく走っています</span><span style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500; color: #B8AE98\">Common</span></span>\n            </div>\n            <h3 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: clamp(24px, 2.6vw, 32px); line-height: 1.4\">元東急の車両</h3>\n            <span style=\"font-family: 'Cormorant Garamond', serif; font-style: e=\"width: 100%; height: 100%; background: #8C7A5E; display: flex; align-items: flex-end; padding: 12px; box-sizing: border-box\"><span style=\"font-size: 12px; color: #FFFFFF; background: rgba(20,20,20,0.6); padding: 2px 8px\">写真3：南富山駅（追加用）</span></div></div></div><div style=\"position: absolute; left: 0; right: 0; bottom: 10px; display: flex; gap: 8px; justify-content: center\"><a href=\"#ph7-1\" aria-label=\"写真1\" style=\"width: 10px; height: 10px; border-radius: 50%; background: #FFFFFF; display: block\"></a><a href=\"#ph7-2\" aria-label=\"写真2\" style=\"width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.55); display: block\"></a><a href=\"#ph7-3\" aria-label=\"写真3\" style=\"width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.55); display: block\"></a></div><span style=\"position: absolute; right: 10px; top: 10px; font-size: 11px; color: #FFFFFF; background: rgba(20,20,20,0.55); padding: 2px 8px\">1 / 3　横にスライド</span></div></div><div style=\"flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 12px\">\n            <div style=\"display: flex; gap: 14px; align-items: center\">\n              <span style=\"display: inline-flex; flex-direction: column; align-items: center; justify-content: center; width: 52px; height: 52px; border: 3px solid #E2662A; border-radius: 6px; background: #FFFFFF; line-height: 1\"><span style=\"font-size: 12px; font-weight: 700; color: #E2662A\">T</span><span style=\"font-size: 20px; font-weight: 700; color: #E2662A\">61</span></span>\n              <span style=\"display: flex; flex-direction: column; gap: 2px\"><h3 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: clamp(24px, 2.6vw, 32px); line-height: 1.3\">南富山駅</h3><span style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 19px; color: #5E5648\">Minami-Toyama Station</span></span>\n            </div>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 6px; ali  #1E6FB8\">T</span><span style=\"font-size: 20px; font-weight: 700; color: #1E6FB8\">08</span></span>\n              <span style=\"display: flex; flex-direction: column; gap: 2px\"><h3 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: clamp(24px, 2.6vw, 32px); line-height: 1.3\">寺田駅</h3><span style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 19px; color: #5E5648\">Terada Station</span></span>\n            </div>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 6px; align-items: center\"><span style=\"font-size: 12px; font-weight: 700; color: #FFFFFF; background: #1E6FB8; padding: 2px 10px\">本線</span><span style=\"font-size: 12px; font-weight: 700; color: #FFFFFF; background: #3A9A3A; padding: 2px 10px\">立山線</span></div>\n            <p style=\"margin: 0; font-size: 15px; line-height: 2; color: #3A342C\">本線と立山線が分かれる乗り換え駅。映画のセットのような駅舎には、撮影に訪れる人も多いのだとか。線路の先には立山連峰が広がり、冬の晴れた日は雪山が圧巻です。電車に乗らなくても、入場券（240円）で構内に入れます。</p>\n            <div style=\"background: #F3EEE2; border-left: 3px solid #8A3B26; padding: 10px 14px\"><span style=\"font-size: 12px; font-weight: 700; color: #8A3B26\">見どころ <span style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500\">Look for</span></span><ul style=\"margin: 4px 0 0; padding-left: 18px; font-size: 14px; line-height: 1.9\"><li>本線と立山線の分岐</li><li>線路の先の立山連峰</li><li>入場券240円で構内へ</li></ul></div>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n              <a href=\"https://visit.jorudan.co.jp/trip/ja/?tp=\" style=\"text-decoration: none; font-size: 14px; font-weight: 700; color: #FFFFFF; background: #2F4A3C; padding: 11px 16px\">この駅へ行く（JORUDAN VISIT）↗</a>\n              <a href=\"https://www.chitetsu.co.jp/?station_info=%E5%AF%BA%E7%94%B0%E9%A7%85\" style=\"text-decoration: none; font-size: 14px; font-weight: 700; color: #2F4A3C; border: 1px solid #2F4A3C; padding: 10px 16px\">駅情報（富山地方鉄道）↗</a>\n            </div>\n          </div><di 3　横にスライド</span></div></div><div style=\"flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 12px\">\n            <div style=\"display: flex; gap: 14px; align-items: center\">\n              <span style=\"display: inline-flex; flex-direction: column; align-items: center; justify-content: center; width: 52px; height: 52px; border: 3px solid #3A9A3A; border-radius: 6px; background: #FFFFFF; line-height: 1\"><span style=\"font-size: 12px; font-weight: 700; color: #3A9A3A\">T</span><span style=\"font-size: 20px; font-weight: 700; color: #3A9A3A\">51</span></span>\n              <span style=\"display: flex; flex-direction: column; gap: 2px\"><h3 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: clamp(24px, 2.6vw, 32px); line-height: 1.3\">岩峅寺駅</h3><span style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 19px; color: #5E5648\">Iwakuraji Station</span></span>\n            </div>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 6px; align-items: center\"><span style=\"font-size: 12px; font-weight: 700; color: #FFFFFF; background: #3A9A3A; padding: 2px 10px\">立山線</span><span style=\"font-size: 12px; font-weight: 700; color: #FFFFFF; background: #E2662A; padding: 2px 10px\">不二越・上滝線</span><span style=\"font-size: 13px; font-weight: 700; color: #3A2A10; background: linear-gradient(180deg, #E8C877, #B98E3B); border: 1px solid #8C6A26; padding: 3px 12px\">1921年（大正10年）築</span></div>\n            <p style=\"margin: 0; font-size: 15px; line-height: 2; color: #3A342C\">100年を超える歴史をもつ駅舎。どこを切り取っても絵になる瓦屋根が目印です。立山線と不二越・上滝線が乗り入れる2面4線の構内も、入場券（240円）で見学できます。</p>\n            <div style=\"background: #F3EEE2; border-left: 3px solid #8A3B26; padding: 10px 14px\"><span style=\"font-size: 12px; font-weight: 700; color: #8A3B26\">見どころ <span style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500\">Look for</span></span><ul style=\"margin: 4px 0 0; padding-left: 18px; font-size: 14px; line-height: 1.9\"><li>大正10年築の駅舎</li><li>特徴的な瓦屋根</li><li>2面4線の構内</li></ul></div>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n              <a href=\"https://visit.jorudan.co.jp/trip/ja/?tp=\" style=\"text-decoration: none; font-size: 14px; font-weight: 700; color: #FFFFFF; background: #2F4A3C; padding: 11px 16px\">この駅へ行く（JORUDAN VISIT）↗</a>\n              <a href=\"https://www.chitetsu.co.jp/?station_info=%E5%B2%A9%E5%B3%85%E5%AF%BA%E9%A7%85\" style=\"text-decoration: none; font-size: 14px; font-weight: 700; color: #2F4A3C; border: 1px solid #2F4A3C; padding: 10px 16px\">駅情報（富山地方鉄道）↗</a>\n            </div>\n          </div>\n        </article><article id=\"s4\" class=\"fd-entry fd-flip\" style=\"display: flex; flex-wrap: wrap; gap: 28px 48px; align-items: center; padding: 40px 0; border-top: 1px solid #D8CFBD\">\n          <div style=\"flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 12px\">\n            <div style=\"display: flex; gap: 14px; align-items: center\">\n              <span style=\"display: inline-flex; flex-direction: column; align-items: center; justify-content: center; width: 52px; height: 52px; border: 3px solid #3A9A3A; border-radius: 6px; background: #FFFFFF; line-height: 1\"><span style=\"font-size: 12px; font-weight: 700; color: #3A9A3A\">T</span><span style=\"font-size: 20px; font-weight: 700; color: #3A9A3A\">52</span></span>\n              <span style=\"display: flex; flex-direction: column; gap: 2px\"><h3 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: clamp(24px, 2.6vw, 32px); line-height: 1.3\">横江駅</h3><span style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 19px; color: #5E5648\">Yokoe Station</span></span>\n            </div>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 6px; align-items: center\"><span style=\"font-size: 12px; font-weight: 700; color: #FFFFFF; background: #3A9A3A; padding: 2px 10px\">立山線</span><span styl ex; flex-direction: column; gap: 2px\"><h3 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: clamp(24px, 2.6vw, 32px); line-height: 1.3\">浜加積駅</h3><span style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 19px; color: #5E5648\">Hama-Kazumi Station</span></span>\n            </div>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 6px; align-items: center\"><span style=\"font-size: 12px; font-weight: 700; color: #FFFFFF; background: #1E6FB8; padding: 2px 10px\">本線</span></div>\n            <p style=\"margin: 0; font-size: 15px; line-height: 2; color: #3A342C\">外からは想像できない、レトロな空間が駅舎の中に。ホームの前には田園が広がり、映画のワンシーンのような景色に出会えます。</p>\n            <div style=\"background: #F3EEE2; border-left: 3px solid #8A3B26; padding: 10px 14px\"><span style=\"font-size: 12px; font-weight: 700; color: #8A3B26\">見どころ <span style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500\">Look for</span></span><ul style=\"margin: 4px 0 0; padding-left: 18px; font-size: 14px; line-height: 1.9\"><li>驚くほどレトロな駅舎内</li><li>ホームの前の田園</li></ul></div>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n              <a href=\"https://visit.jorudan.co.jp/trip/ja/?tp=\" style=\"text-decoration: none; font-size: 14px; font-weight: 700; color: #FFFFFF; background: #2F4A3C; padding: 11px 16px\">この駅へ行く（JORUDAN VISIT）↗</a>\n              <a href=\"https://www.chitetsu.co.jp/?station_info=%E6%B5%9C%E5%8A%A0%E7%A9%8D%E9%A7%85\" style=\"text-decoration: none; font-size: 14px; font-weight: 700; color: #2F4A3C; border: 1px solid #2F4A3C; padding: 10px 16px\">駅情報（富山地方鉄道）↗</a>\n            </div>\n          </div>\n        </article><article id=\"s6\" class=\"fd-entry fd-flip\" style=\"display: flex; flex-wrap: wrap; gap: 28px 48px; align-items: center; padding: 40px 0; border-top: 1px solid #D8CFBD\">\n          <div style=\"flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 12px\">\n            <div style=\"display: flex; gap: 14px; align-items: center\">\n              <span style=\"display: inline-flex; flex-direction: column; align-items: center; justify-content: center; width: 52px; height: 52px; border: 3px solid #1E6FB8; border-radius: 6px; background: #FFFFFF; line-height: 1\"><span style=\"font-size: 12px; font-weight: 700; color: #1E6FB8\">T</span><span style=\"font-size: 20px; font-weight: 700; color: #1E6FB8\">20</span></span>\n              <span style=\"display: flex; flex-direction: column; gap: 2px\"><h3 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: clamp(24px, 2.6vw, 32px); line-height: 1.3\">早月加積駅</h3><span style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 19px; color: #5E5648\">Hayatsuki-Kazumi Station</span></span>\n            </div>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 6px; align-items: center\"><span style=\"font-size: 12px; font-weight: 700; color: #FFFFFF; background: #1E6FB8; padding: 2px 10px\">本線</span></div>\n            <p style=\"margin: 0; font-size: 15px; line-height: 2; color: #3A342C\">一歩足を踏み入れると、タイムスリップしたような世界。何気ない駅設備の「着札箱」に、この駅が歩んできた時間が詰まっています。</p>\n            <div style=\"background: #F3EEE2; border-left: 3px solid #8A3B26; padding: 10px 14px\"><span style=\"font-size: 12px; font-weight: 700; color: #8A3B26\">見どころ <span style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500\">Look for</span></span><ul style=\"margin: 4px 0 0; padding-left: 18px; font-size: 14px; line-height: 1.9\"><li>外観と内観のギャップ</li><li>歴史を感じる「着札箱」</li></ul></div>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n              <a href=\"https://visit.jorudan.co.jp/trip/ja/?tp=\" style=\"text-decoration: none; font-size: 14px; font-weight: 700; color: #FFFFFF; background: #2F4A3C; padding: 11px 16px\">この駅へ行く（JORUDAN VISIT）↗</a>\n              <a href=\"https://www.chitetsu.co.jp/?station_info=%E6%97%A9%E6%9C%88%E5%8A%A0%E7
