<style>
body{margin:0;background:#F5F1E8}
a{color:#2F4A3C}a:hover{color:#1E3328}

.hide{display:none !important}

}

@media (max-width:767px){.ft-flip{flex-direction:column-reverse !important;flex-wrap:nowrap !important;align-items:stretch !important}.ft-flip>*{flex:none !important;width:100%}}
body{overflow-wrap:break-word}
h1,h2,h3,button,a,span,p,li,td,th{overflow-wrap:anywhere;word-break:normal}
details.lang>summary::-webkit-details-marker{display:none}
.hero-slides{position:relative;overflow:hidden}
.hero-slides>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;animation:heroFade 15s infinite}
.hero-slides>img:nth-of-type(1){position:relative;opacity:1;animation:none}
.hero-slides>img:nth-of-type(2){animation-delay:5s}
.hero-slides>img:nth-of-type(3){animation-delay:10s}
@keyframes heroFade{0%{opacity:0}4%{opacity:1}33%{opacity:1}37%{opacity:0}100%{opacity:0}}
.hero-dots{position:absolute;right:20px;bottom:16px;display:flex;gap:6px;z-index:2}
.hero-dots>span{width:22px;height:4px;background:rgba(255,255,255,0.5);animation:heroDot 15s infinite}
.hero-dots>span:nth-child(2){animation-delay:5s}.hero-dots>span:nth-child(3){animation-delay:10s}
@keyframes heroDot{0%{background:#FFFFFF}33%{background:#FFFFFF}34%{background:rgba(255,255,255,0.5)}100%{background:rgba(255,255,255,0.5)}}
@media (prefers-reduced-motion: reduce){.hero-slides>img{animation:none}.hero-slides>img:nth-of-type(1){opacity:1}}
</style>

der: 1px solid #8C8270; border-radius: 2px; padding: 0 12px; color: #2B2B2B; display: flex; gap: 6px; align-items: center; justify-content: center; min-height: 44px; min-width: 44px; box-sizing: border-box\">\n          <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18\"></path></svg>\n          <span class=\"pc-only\">日本語</span><span aria-hidden=\"true\" style=\"font-size: 10px\">▼</span>\n        </summary>\n        <div role=\"menu\" style=\"position: absolute; right: 0; top: calc(100% + 6px); z-index: 60; background: #FFFFFF; border: 1px solid #B7AC97; box-shadow: 0 10px 24px rgba(0,0,0,0.18); min-width: 180px; padding: 4px 0; display: flex; flex-direction: column\">\n          <a role=\"menuitem\" href=\"#\" style=\"text-decoration: none; color: #2B2B2B; font-weight: 700; background: #EEF3EE; padding: 10px 16px; font-size: 14px\">✓ 日本語</a>\n          <a role=\"menuitem\" href=\"#\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 16px; font-size: 14px\">English</a>\n          <a role=\"menuitem\" href=\"#\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 16px; font-size: 14px\">简体中文</a>\n          <a role=\"menuitem\" href=\"#\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 16px; font-size: 14px\">繁體中文</a>\n          <a role=\"menuitem\" href=\"#\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 16px; font-size: 14px\">한국어</a>\n          <a role=\"menuitem\" href=\"#\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 16px; font-size: 14px\">ภาษาไทย</a>\n        </div>\n      </details>\n      <details class=\"menu sp-only\" style=\"flex: 0 0 auto\">\n        <summary aria-label=\"メニューを開く\" style=\"width: 44px; height: 44px; border: 1px solid #2B2B2B; border-radius: 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; box-sizing: border-box\">\n          <span style=\"width: 20px; height: 2px; background: #2B2B2B\"></span><span style=\"width: 20px; height: 2px; background: #2B2B2B\"></span><span style=\"width: 20px; height: 2px; background: #2B2B2B\"></span>\n        </summary>\n        <nav aria-label=\"メインメニュー\" style=\"position: absolute; left: 0; right: 0; top: 100%; z-index: 10; background: #F5F1E8; border-bottom: 1px solid #D8CFBD; padding: 8px 20px 20px; display: flex; flex-direction: column; font-size: 16px; font-weight: 500; box-shadow: 0 12px 24px rgba(60,45,20,0.12)\"><a href=\"Tateyama.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">エリア<span aria-hidden=\"true\">›</span></a><a href=\"Courses.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">モデルコース<span aria-hidden=\"true\">›</span></a><a href=\"Tickets.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">お得なチケット<span aria-hidden=\"true\">›</span></a><a href=\"RideRail.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">乗り方・きっぷ購入<span aria-hidden=\"true\">›</span></a><a href=\"Feature.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">特集<span aria-hidden=\"true\">›</span></a><a href=\"Access.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">アクセス<span aria-hidden=\"true\">›</span></a><a href=\"FAQ.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">よくある質問<span aria-hidden=\"true\">›</span></a></nav>\n      </details>\n    </div>\n  </header>\n\n  <!-- ページ見出し -->\n  <section style=\"position: relative; background: #1E1E1C; color: #F5F1E8; overflow: hidden\">\n    <div style=\"position: absolute; inset: 0; display: grid; grid-template-columns: 1.4fr 1fr; gap: 4px; opacity: 0.7\">\n      <div style=\"position: relative; overflow: hidden; background: #2B2B2B; height: 100%\"><img src=\"img/car_daikon.jpg\" alt=\"通称「だいこん電車」\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover\"><span style=\"position: absolute; left: 10px; bottom: 10px; font-size: 11px; color: #FFFFFF; background: rgba(20,20,20,0.55); padding: 2px 8px\">通称「だいこん電車」</span></div>\n      <div style=\"display: grid; grid-template-rows: 1fr 1fr; gap: 4px\"><div style=\"position: relative; overflow: hidden; background: #2B2B2B; height: 100%\"><img src=\"img/st_aimoto.jpg\" alt=\"愛本駅\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover\"><span style=\"position: absolute; left: 10px; bottom: 10px; font-size: 11px; color: #FFFFFF; background: rgba(20,20,20,0.55); padding: 2px 8px\">愛本駅</span></div><div style=\"position: relative; overflow: hidden; background: #2B2B2B; height: 100%\"><img src=\"img/car_extokyu.jpg\" alt=\"元東急の車両\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover\"><span style=\"position: absolute; left: 10px; bottom: 10px; font-size: 11px; color: #FFFFFF; background: rgba(20,20,20,0.55); padding: 2px 8px\">元東急の車両</span></div></div>\n    </div>\n    <div style=\"position: absolute; inset: 0; background: linear-gradient(90deg, rgba(20,20,18,0.92) 0%, rgba(20,20,18,0.55) 55%, rgba(20,20,18,0.2) 100%)\"></div>\n    <div style=\"position: relative; max-width: 1280px; margin: 0 auto; padding: 96px 24px 88px; display: flex; flex-direction: column; gap: 16px\">\n      <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 20px; letter-spacing: 0.35em; color: #E2B865\">FEATURES</span>\n      <h1 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: clamp(32px, 4.6vw, 60px); line-height: 1.35; letter-spacing: 0.04em\">地鉄は、<br>走る鉄道博物館。</h1>\n      <span style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: clamp(18px, 2vw, 24px); color: #D9CBB0\">Chitetsu &mdash; a living railway museum in the shadow of the Tateyama range.</span>\n      <p style=\"margin: 0; font-size: 15px; line-height: 2; color: #DCD3C2; max-width: 680px\">かつて都会を駆けた特急車両が、いまは立山連峰を背に走る。大正・昭和の木造駅舎が、いまも毎日乗客を迎える。富山地方鉄道には、乗って、降りて、撮りたくなる物語があふれています。</p>\n    </div>\n  </section>\n  <!-- 特集記事 -->\n  <section style=\"padding: 48px 24px 0\">\n    <div style=\"max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px\">\n      <div style=\"display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; border-bottom: 1px solid #D8CFBD; padding-bottom: 16px\">\n        \n        <span style=\"font-size: 14px; color: #5E5648\">{{ count }}</span>\n      </div>\n      <sc-if value=\"{{ showA }}\" hint-placeholder-val=\"{{ true }}\"><article class=\"ft-story\" style=\"display: flex; flex-wrap: wrap; gap: 32px 56px; align-items: center\">\n          <div style=\"flex: 1 1 520px; min-width: 0; display: grid; grid-template-columns: 2fr 1fr; grid-template-rows: 1fr 1fr; gap: 6px; aspect-ratio: 16 / 11\">\n            <div style=\"position: relative; overflow: hidden; background: #2B2B2B; grid-row: span 2; height: 100%\"><img src=\"img/car_canyon.jpg\" alt=\"キャニオンエキスプレス（元西武ニューレッドアロー）\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover\"><span style=\"position: absolute; left: 10px; bottom: 10px; font-size: 11px; color: #FFFFFF; background: rgba(20,20,20,0.55); padding: 2px 8px\">キャニオンエキスプレス（元西武ニューレッドアロー）</span></div><div style=\"position: relative; overflow: hidden; background: #2B2B2B; height: 100%\"><img src=\"img/car_kabocha.jpg\" alt=\"通称「かぼちゃ電車」（元京阪）\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover\"><span style=\"position: absolute; left: 10px; bottom: 10px; font-size: 11px; color: #FFFFFF; background: rgba(20,20,20,0.55); padding: 2px 8px\">通称「かぼちゃ電車」（元京阪）</span></div><div style=\"position: relative; overflow: hidden; background: #2B2B2B; height: 100%\"><img src=\"img/car_toyamamoyo.jpg\" alt=\"「とやまもよう」デザイン車両\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover\"><span style=\"position: absolute; left: 10px; bottom: 10px; font-size: 11px; color: #FFFFFF; background: rgba(20,20,20,0.55); padding: 2px 8px\">「とやまもよう」デザイン車両</span></div>\n          </div><div style=\"flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 14px; padding: 8px 0\">\n            <div style=\"display: flex; align-items: baseline; gap: 14px\">\n              <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 64px; line-height: 0.9; color: #7A2E22\">01</span>\n              <span style=\"display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 13px; font-weight: 700; color: #7A2E22\">特集｜車両</span><span style=\"font-family: 'Cormorant Garamond', serif; font-size: 14px; letter-spacing: 0.25em; color: #6B6458\">ROLLING STOCK</span></span>\n            </div>\n            <h2 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: clamp(24px, 2.6vw, 34px); line-height: 1.5\">都会の名車が、第二の人生を走る。<br>地鉄レトロ車両図鑑</h2>\n            <span style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 19px; color: #5E5648; line-height: 1.4\">Second Life on the Rails: Chitetsu’s Legendary Trains</span>\n            <p style=\"margin: 0; font-size: 15px; line-height: 2; color: #3A342C\">西武の特急「レッドアロー」、京阪の通称「かぼちゃ電車」、東急の通勤車両。全国から集まった車両が、立山連峰を背にいまも現役で走ります。車庫取材でわかった、イチオシ3車両と出会い方。</p>\n            <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px\"><div style=\"display: flex; flex-direction: column; gap: 2px; padding: 10px 14px; border-left: 3px solid #7A2E22; background: #F3EEE2; min-width: 0\"><span style=\"font-size: 11px; letter-spacing: 0.08em; color: #6B6458\">在籍車両</span><span style=\"font-size: 14px; font-weight: 700; line-height: 1.5\">46両</span></div><div style=\"display: flex; flex-direction: column; gap: 2px; padding: 10px 14px; border-left: 3px solid #7A2E22; background: #F3EEE2; min-width: 0\"><span style=\"font-size: 11px; letter-spacing: 0.08em; color: #6B6458\">元の所属</span><span style=\"font-size: 14px; font-weight: 700; line-height: 1.5\">西武・京阪・東急ほか</span></div><div style=\"display: flex; flex-direction: column; gap: 2px; padding: 10px 14px; border-left: 3px solid #7A2E22; background: #F3EEE2; min-width: 0\"><span style=\"font-size: 11px; letter-spacing: 0.08em; color: #6B6458\">デザイン</span><span style=\"font-size: 14px; font-weight: 700; line-height: 1.5\">水戸岡鋭治氏（アルプスエキスプレス）</span></div></div>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 6px\"><span style=\"font-size: 12px; color: #2F4A3C; background: #EEF3EE; border-radius: 999px; padding: 4px 10px\">#レトロ車両</span><span style=\"font-size: 12px; color: #2F4A3C; background: #EEF3EE; border-radius: 999px; padding: 4px 10px\">#観光列車</span><span style=\"font-size: 12px; color: #2F4A3C; background: #EEF3EE; border-radius: 999px; padding: 4px 10px\">#譲渡車両</span></div>\n            <a href=\"FeatureDetail.html#cars\" style=\"align-self: flex-start; text-decoration: none; display: inline-flex; gap: 10px; align-items: center; font-size: 15px; font-weight: 700; color: #FFFFFF; background: #7A2E22; padding: 15px 24px; margin-top: 4px\">記事を読む<span style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500; opacity: 0.85\">Read the story</span>→</a>\n          </div>\n        </article></sc-if>\n      <sc-if value=\"{{ sho
