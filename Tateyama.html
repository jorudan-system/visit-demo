<style>
body{margin:0;background:#F5F1E8}
a{color:#2F4A3C}a:hover{color:#1E3328}
.sp-only{display:none !important}
.scroller{scrollbar-width:thin}
details.menu>summary{list-style:none;cursor:pointer}
details.menu>summary::-webkit-details-marker{display:none}
details.more>summary{list-style:none;cursor:pointer}
details.more>summary::-webkit-details-marker{display:none}
.hide{display:none !important}
.spots{display:flex;gap:24px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:12px}
.spots>*{flex:0 0 340px;scroll-snap-align:start}
.route-inner .route-card{flex:1 1 0 !important;min-width:0}
@media (max-width:767px){
.pc-only{display:none !important}.sp-only{display:flex !important}.sp-hide{display:none !important}
.spots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;overflow:visible}
.spots>*{flex:none}
.route-inner .route-card{flex:0 0 150px !important}
.route-inner{width:max-content !important;max-width:none !important}
.fare-grid{min-width:0 !important}
.fare-grid>div{padding:10px 3px !important;font-size:12px !important;word-break:keep-all;overflow-wrap:anywhere}
}

@media (max-width:767px){
.sptabs>[data-sec]{padding-top:28px !important}
.sptabs[data-tab="search"]>[data-sec]:not([data-sec="search"]),.sptabs[data-tab="time"]>[data-sec]:not([data-sec="time"]),.sptabs[data-tab="fare"]>[data-sec]:not([data-sec="fare"]),.sptabs[data-tab="spot"]>[data-sec]:not([data-sec="spot"]){display:none !important}
}

body{overflow-wrap:break-word}
h1,h2,h3,button,a,span,p,li,td,th{overflow-wrap:anywhere;word-break:normal}
details.lang>summary::-webkit-details-marker{display:none}
.hero-slides{position:relative;overflow:hidden}
.hero-slides>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;animation:heroFade 15s infinite}
.hero-slides>img:nth-of-type(1){position:relative;opacity:1;animation:none}
.hero-slides>img:nth-of-type(2){animation-delay:5s}
.hero-slides>img:nth-of-type(3){animation-delay:10s}
@keyframes heroFade{0%{opacity:0}4%{opacity:1}33%{opacity:1}37%{opacity:0}100%{opacity:0}}
.hero-dots{position:absolute;right:20px;bottom:16px;display:flex;gap:6px;z-index:2}
.hero-dots>span{width:22px;height:4px;background:rgba(255,255,255,0.5);animation:heroDot 15s infinite}
.hero-dots>span:nth-child(2){animation-delay:5s}.hero-dots>span:nth-child(3){animation-delay:10s}
@keyframes heroDot{0%{background:#FFFFFF}33%{background:#FFFFFF}34%{background:rgba(255,255,255,0.5)}100%{background:rgba(255,255,255,0.5)}}
@media (prefers-reduced-motion: reduce){.hero-slides>img{animation:none}.hero-slides>img:nth-of-type(1){opacity:1}}
@media print{@page{size:A4 landscape;margin:8mm}body *{visibility:hidden !important}.dia-print,.dia-print *{visibility:visible !important}.dia-print{position:absolute !important;left:0;top:0;width:100% !important;max-width:none !important;max-height:none !important;box-shadow:none !important}.dia-print .dia-table{overflow:visible !important;max-height:none !important}.dia-print .no-print,.dia-print .dia-ctl{display:none !important}.dia-print table{min-width:0 !important;font-size:10px !important}.dia-print th,.dia-print td{position:static !important;padding:3px 2px !important}}
@media (max-width:767px){.dia-notes ul{grid-template-columns:1fr !important}}
</style>

<script>window.__DC_TPL="\n\n<div style=\"font-family: 'Noto Sans JP', sans-serif; color: #2B2B2B; background: #F5F1E8; min-height: 100vh\">\n\n  <!-- 災害・運行情報テロップ -->\n  <sc-if value=\"{{ normal }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"background: #E3ECE4; border-bottom: 1px solid #B9CDBD; font-size: 14px\">\n      <div style=\"max-width: 1280px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 10px 16px; align-items: center\">\n        <span style=\"background: #2B2B2B; color: #FFFFFF; font-weight: 700; font-size: 12px; padding: 4px 10px; border-radius: 2px; white-space: nowrap\">災害・運行情報</span>\n        <span style=\"display: flex; align-items: center; gap: 6px; font-weight: 700; color: #2F4A3C; white-space: nowrap\"><span style=\"width: 10px; height: 10px; border-radius: 50%; background: #3E7A55\"></span>平常運行</span>\n        <span class=\"pc-only\" style=\"font-size: 12px; color: #5E5648; white-space: nowrap\">○時○分 更新</span>\n        <a href=\"Service.html\" style=\"margin-left: auto; font-size: 13px; font-weight: 700; white-space: nowrap\">詳しく見る →</a>\n      </div>\n    </div>\n  </sc-if>\n  <sc-if value=\"{{ alert }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"background: #8A3B26; color: #FFFFFF; font-size: 14px\">\n      <div style=\"max-width: 1280px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 10px 16px; align-items: center\">\n        <span style=\"background: #FFFFFF; color: #8A3B26; font-weight: 700; font-size: 12px; padding: 4px 10px; border-radius: 2px; white-space: nowrap\">災害・運行情報</span>\n        <span style=\"display: flex; align-items: center; gap: 6px; font-weight: 700; white-space: nowrap\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\"><path d=\"M12 3 2 21h20L12 3z\"></path><path d=\"M12 10v5M12 18v.5\"></path></svg>遅れ・運休あり</span>\n        <span class=\"pc-only\" style=\"font-size: 12px; white-space: nowrap\">○時○分 更新</span>\n        <a href=\"Service.html\" style=\"margin-left: auto; font-size: 13px; font-weight: 700; color: #FFFFFF; white-space: nowrap\">詳しく見る →</a>\n      </div>\n    </div>\n  </sc-if>\n\n  <!-- ヘッダー -->\n  <header style=\"border-bottom: 1px solid #D8CFBD; background: #F5F1E8; position: relative\">\n    <div style=\"max-width: 1280px; margin: 0 auto; padding: 14px 16px; display: flex; gap: 12px 32px; align-items: center\">\n      <a href=\"Main.html\" style=\"flex: 1 1 auto; text-decoration: none; color: #2B2B2B; display: flex; flex-direction: column; gap: 2px; min-width: 0\">\n        <span style=\"font-family: 'Cormorant Garamond', serif; font-size: clamp(16px, 2vw, 28px); font-weight: 600; letter-spacing: 0.1em; white-space: nowrap\">TOYAMA LOCAL TRACKS</span>\n        <span style=\"font-size: 11px; letter-spacing: 0.2em; color: #5E5648\">富山地方鉄道 観光ガイド</span>\n      </a>\n      <nav class=\"pc-only\" aria-label=\"メインメニュー\" style=\"display: flex; flex-wrap: wrap; gap: 4px 20px; font-size: 14px; font-weight: 500\"><a href=\"Tateyama.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 0; border-bottom: 2px solid #2B2B2B\">エリア</a><a href=\"Courses.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 0\">モデルコース</a><a href=\"Tickets.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 0\">お得なチケット</a><a href=\"RideRail.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 0\">乗り方・きっぷ購入</a><a href=\"Feature.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 0\">特集</a><a href=\"Access.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 0\">アクセス</a><a href=\"FAQ.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 0\">よくある質問</a></nav>\n      <details class=\"lang\" style=\"flex: 0 0 auto; position: relative\">\n        <summary aria-label=\"言語を選択\" style=\"list-style: none; cursor: pointer; font-family: inherit; font-size: 13px; background: transparent; border: 1px solid #8C8270; border-radius: 2px; padding: 0 12px; color: #2B2B2B; display: flex; gap: 6px; align-items: center; justify-content: center; min-height: 44px; min-width: 44px; box-sizing: border-box\">\n          <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18\"></path></svg>\n          <span class=\"pc-only\">日本語</span><span aria-hidden=\"true\" style=\"font-size: 10px\">▼</span>\n        </summary>\n        <div role=\"menu\" style=\"position: absolute; right: 0; top: calc(100% + 6px); z-index: 60; background: #FFFFFF; border: 1px solid #B7AC97; box-shadow: 0 10px 24px rgba(0,0,0,0.18); min-width: 180px; padding: 4px 0; display: flex; flex-direction: column\">\n          <a role=\"menuitem\" href=\"#\" style=\"text-decoration: none; color: #2B2B2B; font-weight: 700; background: #EEF3EE; padding: 10px 16px; font-size: 14px\">✓ 日本語</a>\n          <a role=\"menuitem\" href=\"#\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 16px; font-size: 14px\">English</a>\n          <a role=\"menuitem\" href=\"#\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 16px; font-size: 14px\">简体中文</a>\n          <a role=\"menuitem\" href=\"#\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 16px; font-size: 14px\">繁體中文</a>\n          <a role=\"menuitem\" href=\"#\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 16px; font-size: 14px\">한국어</a>\n          <a role=\"menuitem\" href=\"#\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 16px; font-size: 14px\">ภาษาไทย</a>\n        </div>\n      </details>\n      <details class=\"menu sp-only\" style=\"flex: 0 0 auto\">\n        <summary aria-label=\"メニューを開く\" style=\"width: 44px; height: 44px; border: 1px solid #2B2B2B; border-radius: 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; box-sizing: border-box\">\n          <span style=\"width: 20px; height: 2px; background: #2B2B2B\"></span><span style=\"width: 20px; height: 2px; background: #2B2B2B\"></span><span style=\"width: 20px; height: 2px; background: #2B2B2B\"></span>\n        </summary>\n        <nav aria-label=\"メインメニュー\" style=\"position: absolute; left: 0; right: 0; top: 100%; z-index: 10; background: #F5F1E8; border-bottom: 1px solid #D8CFBD; padding: 8px 20px 20px; display: flex; flex-direction: column; font-size: 16px; font-weight: 500; box-shadow: 0 12px 24px rgba(60,45,20,0.12)\"><a href=\"Tateyama.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">エリア<span aria-hidden=\"true\">›</span></a><a href=\"Courses.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">モデルコース<span aria-hidden=\"true\">›</span></a><a href=\"Tickets.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">お得なチケット<span aria-hidden=\"true\">›</span></a><a href=\"RideRail.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">乗り方・きっぷ購入<span aria-hidden=\"true\">›</span></a><a href=\"Feature.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">特集<span aria-hidden=\"true\">›</span></a><a href=\"Access.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">アクセス<span aria-hidden=\"true\">›</span></a><a href=\"FAQ.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">よくある質問<span aria-hidden=\"true\">›</span></a></nav>\n      </details>\n    </div>\n  </header>\n\n  <!-- エリア切替タブ -->\n  <div style=\"border-bottom: 1px solid #D8CFBD; overflow-x: auto\">\n    <div style=\"max-width: 1280px; margin: 0 auto; padding: 0 24px; display: flex; gap: 8px\">\n      <a href=\"Tateyama.html\" style=\"text-decoration: none; color: #2B2B2B; font-weight: 700; padding: 16px 18px; border-bottom: 3px solid #B5523B; white-space: nowrap\">立山</a>\n      <a href=\"Kurobe.html\" style=\"text-decoration: none; color: #4A4438; padding: 16px 18px; white-space: nowrap\">黒部・宇奈月</a>\n      <a href=\"Uozu.html\" style=\"text-decoration: none; color: #4A4438; padding: 16px 18px; white-space: nowrap\">魚津・滑川・上市</a>\n      <a href=\"City.html\" style=\"text-decoration: none; color: #4A4438; padding: 16px 18px; white-space: nowrap\">富山市内</a>\n    </div>\n  </div>\n\n  <!-- お知らせ枠（特別なお知らせがある場合のみ表示） -->\n  <sc-if value=\"{{ noticeShow }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"padding: 24px 24px 0\">\n    <div style=\"max-width: 1280px; margin: 0 auto; background: #FBF1D6; border: 1px solid #E2C77E; padding: 16px 20px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center\">\n      <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7A5A10\" stroke-width=\"1.8\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M12 7v6M12 16.5v.5\"></path></svg>\n      <span style=\"font-weight: 700; color: #5E4510\">お知らせ</span>\n      <span style=\"flex: 1 1 240px; color: #4A3A10; font-size: 15px\">立山黒部アルペンルートは冬期閉鎖期間中です。立山線（電鉄富山〜立山）は運行しています。</span>\n    </div>\n  </div>\n  </sc-if>\n\n  <!-- ヒーロー -->\n  <section style=\"padding: 24px 24px 0\">\n    <div style=\"max-width: 1280px; margin: 0 auto; position: relative\">\n      <div class=\"hero-slides\"><img src=\"img/hero_tateyama.jpg\" alt=\"立山連峰の前を走る立山線の電車のイラスト\" style=\"display: block; width: 100%; height: clamp(260px, 36vw, 520px); object-fit: cover\"><img src=\"img/gi_01.jpg\" alt=\"立山連峰を背に鉄橋を渡る電車\" style=\"display: block; width: 100%; height: clamp(260px, 36vw, 520px); object-fit: cover\"><img src=\"img/st_iwakuraji.jpg\" alt=\"岩峅寺駅の駅舎\" style=\"display: block; width: 100%; height: clamp(260px, 36vw, 520px); object-fit: cover\"><div class=\"hero-dots\" aria-hidden=\"true\"><span></span><span></span><span></span></div></div>\n      <div style=\"position: absolute; left: 40px; top: 40px; display: flex; flex-direction: column; gap: 8px\">\n        <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 22px; letter-spacing: 0.3em; color: #2F4A3C\">TATEYAMA</span>\n        <h1 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: 56px; letter-spacing: 0.1em\">立山</h1>\n      </div>\n    </div>\n    <div style=\"max-width: 1280px; margin: 0 auto; padding: 48px 0 0; display: flex; flex-wrap: wrap; gap: 32px 64px\">\n      <h2 style=\"margin: 0; flex: 1 1 360px; font-family: 'Noto Serif JP', serif; font-size: 30px; line-height: 1.7\">北アルプスの玄関口へ、<br>車窓の山並みとともに。</h2>\n      <p style=\"margin: 0; flex: 1 1 320px; font-size: 16px; line-height: 2; color: #4A4438\">電鉄富山駅から立山線で約1時間。田園の向こうに立山連峰が近づいてくる車窓は、この路線ならではの景色です。終点の立山駅からは、ケーブルカーで立山黒部アルペンルートへ。</p>\n    </div>\n  </section>\n\n  <!-- スマホ用タブ -->\n  <nav class=\"sp-only sp-tabbar\" aria-label=\"ページ内メニュー\" style=\"position: sticky; top: 0; z-index: 30; background: #F5F1E8; padding: 12px 12px 8px; margin-top: 40px; border-bottom: 1px solid #D8CFBD; gap: 6px\">\n    <sc-for list=\"{{ spTabs }}\" as=\"t\" hint-placeholder-count=\"4\"><button onClick=\"{{ t.pick }}\" style=\"flex: 1 1 0; font-family: inherit; font-size: 13px; font-weight: 700; border: 1px solid #2F4A3C; border-radius: 999px; background: {{ t.bg }}; color: {{ t.color }}; min-height: 42px; padding: 0 4px; white-space: nowrap\">{{ t.label }}</button></sc-for>\n  </nav>\n  <div class=\"sptabs\" data-tab=\"{{ spTab }}\">\n  <!-- アルペンルートの全体行程 -->\n  <section data-sec=\"spot\" style=\"padding: 88px 0 0\">\n    <div style=\"background: #2F4A3C; color: #F5F1E8; padding: 56px 0 48px\">\n      <div style=\"max-width: 1280px; margin: 0 auto; padding: 0 24px; display: flex; flex-direction: column; gap: 14px\">\n        <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 18px; letter-spacing: 0.3em; color: #D9C9A6\">ALPINE ROUTE</span>\n        <h2 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: clamp(24px, 3vw, 32px); line-height: 1.6\">電車と6つの乗り物を乗り継いで、<br>標高2,450mの室堂から黒部ダムへ。</h2>\n        <p style=\"margin: 0; font-size: 15px; line-height: 1.9; color: #DCD3BF; max-width: 760px\">電鉄富山から扇沢まで、電車・ケーブルカー・バス・ロープウェイを乗り継ぐ立山黒部アルペンルート。乗り物ごとに変わる景色も旅の楽しみです。</p>\n      </div>\n      <div class=\"scroller\" style=\"overflow-x: auto; margin-top: 28px\">\n        <div class=\"route-inner\" style=\"max-width: 1328px; margin: 40px auto 0; padding: 0 24px; box-sizing: border-box; display: flex; flex-direction: column\">\n          <div class=\"pc-only\" style=\"position: relative; display: block; height: 150px\">\n            <svg viewBox=\"0 0 1280 150\" preserveAspectRatio=\"none\" width=\"100%\" height=\"150\" aria-hidden=\"true\" style=\"display: block\">\n              <path d=\"M229 150 L399 44 L449 32 L489 19 L549 34 L609 29 L769 150 Z\" fill=\"#56786A\"></path>\n              <path d=\"M434 34 L449 32 L489 19 L549 34 L519 31 L499 35 L471 31 Z\" fill=\"#F5F1E8\"></path>\n              <path d=\"M0 150 L0 142 L76,142 L238,117 L398,46 L560,53 L720,76 L882,94 L1042,94 L1204,95 L1280 95 L1280 150 Z\" fill=\"#3A5A49\"></path>\n              <polyline points=\"0,142 76,142 238,117 398,46 560,53 720,76 882,94 1042,94 1204,95 1280,95\" fill=\"none\" stroke=\"#D9C9A6\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"></polyline>\n            </svg>\n            <span style=\"position: absolute; left: 38.2%; top: 0; transform: translate(-50%, -110%); font-size: 1 3px; color: #DCD3BF\">\n        <span>所要時間・距離は目安です。黒部ケーブルカーは混雑時に長時間待つことがあるため、事前の予約をおすすめします。</span>\n        <span class=\"sp-only\">横にスクロールして全行程を確認できます。</span>\n      </div>\n    </div>\n  </section>\n  <!-- 本日の時刻表 -->\n  <section data-sec=\"time\" style=\"padding: 88px 24px 0\">\n    <div style=\"max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px\">\n      <div style=\"display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; justify-content: space-between\">\n        <div style=\"display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline\">\n          <h2 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: 28px\">本日の時刻表</h2>\n          <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 18px; letter-spacing: 0.2em; color: #8A4A35\">TODAY'S TIMETABLE</span>\n        </div><span style=\"font-size: 14px; color: #2F4A3C; font-weight: 700\">{{ todayLabel }}　現在時刻 {{ nowLabel }}</span>\n      </div>\n      <div class=\"sp-only\" role=\"tablist\" style=\"gap: 0; border: 1px solid #2F4A3C\">\n        <button role=\"tab\" onClick=\"{{ showDown }}\" style=\"flex: 1 1 0; font-family: inherit; font-size: 14px; font-weight: 700; border: none; min-height: 44px; background: {{ downTabBg }}; color: {{ downTabColor }}\">電鉄富山 → 立山</button>\n        <button role=\"tab\" onClick=\"{{ showUp }}\" style=\"flex: 1 1 0; font-family: inherit; font-size: 14px; font-weight: 700; border: none; min-height: 44px; background: {{ upTabBg }}; color: {{ upTabColor }}\">立山 → 電鉄富山</button>\n      </div>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; align-items: stretch\">\n        <div class=\"{{ downCls }}\" style=\"background: #FFFDF8; border: 1px solid #D8CFBD; display: flex; flex-direction: column\">\n            <div style=\"background: {{ dayColor }}; color: #FFFFFF; padding: 14px 20px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between\">\n              <span style=\"font-weight: 700; font-size: 16px\">電鉄富山 → 立山</span>\n              <span style=\"font-size: 12px; font-weight: 700; background: rgba(255,255,255,0.2); padding: 3px 10px\">{{ dayLabel }}</span>\n            </div>\n            <button onClick=\"{{ downPrev }}\" style=\"font-family: inherit; font-size: 14px; font-weight: 700; color: {{ downPrevC }}; background: #F3EEE2; border: none; border-bottom: 1px solid #E6DECC; min-height: 46px\">▲ 前の列車</button>\n            <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 10px 20px; font-size: 12px; color: #5E5648; border-bottom: 1px solid #E6DECC\"><span>発車</span><span>到着</span><span>種別</span></div>\n            <sc-for list=\"{{ downRows }}\" as=\"row\" hint-placeholder-count=\"5\">\n              <div class=\"{{ row.cls }}\" style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 12px 20px; border-bottom: 1px solid #EFE8D8; background: {{ row.bg }}; color: {{ row.color }}; font-variant-numeric: tabular-nums; align-items: center\">\n                <span style=\"font-size: 18px; font-weight: 700\">{{ row.dep }}</span>\n                <span style=\"font-size: 16px\">{{ row.arr }}</span>\n                <span style=\"justify-self: start; font-size: 12px; font-weight: 700; color: {{ row.kindColor }}; border: 1px solid {{ row.kindColor }}; padding: 2px 8px\">{{ row.kind }}</span>\n              </div>\n            </sc-for>\n            <button onClick=\"{{ downNext }}\" style=\"margin-top: auto; font-family: inherit; font-size: 14px; font-weight: 700; color: {{ downNextC }}; background: #F3EEE2; border: none; border-top: 1px solid #E6DECC; min-height: 46px\">▼ 次の列車</button>\n          </div>\n        <div class=\"{{ upCls }}\" style=\"background: #FFFDF8; border: 1px solid #D8CFBD; display: flex; flex-direction: column\">\n            <div style=\"background: {{ dayColor }}; color: #FFFFFF; padding: 14px 20px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between\">\n              <span style=\"font-weight: 700; font-size: 16px\">立山 → 電鉄富山</span>\n              <span style=\"font-size: 12px; font-weight: 700; background: rgba(255,255,255,0.2); padding: 3px 10px\">{{ dayLabel }}</span>\n            </div>\n            <button onClick=\"{{ upPrev }}\" style=\"font-family: inherit; font-size: 14px; font-weight: 700; color: {{ upPrevC }}; background: #F3EEE2; border: none; border-bottom: 1px solid #E6DECC; min-height: 46px\">▲ 前の列車</button>\n            <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 10px 20px; font-size: 12px; color: #5E5648; border-bottom: 1px solid #E6DECC\"><span>発車</span><span>到着</span><span>種別</span></div>\n            <sc-for list=\"{{ upRows }}\" as=\"row\" hint-placeholder-count=\"5\">\n              <div class=\"{{ row.cls }}\" style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 12px 20px; border-bottom: 1px solid #EFE8D8; background: {{ row.bg }}; color: {{ row.color }}; font-variant-numeric: tabular-nums; align-items: center\">\n                <span style=\"font-size: 18px; font-weight: 700\">{{ row.dep }}</span>\n                <span style=\"font-size: 16px\">{{ row.arr }}</span>\n                <span style=\"justify-self: start; font-size: 12px; font-weight: 700; color: {{ row.kindColor }}; border: 1px solid {{ row.kindColor }}; padding: 2px 8px\">{{ row.kind }}</span>\n              </div>\n            </sc-for>\n            <button onClick=\"{{ upNext }}\" style=\"margin-top: auto; font-family: inherit; font-size: 14px; font-weight: 700; color: {{ upNextC }}; background: #F3EEE2; border: none; border-top: 1px solid #E6DECC; min-height: 46px\">▼ 次の列車</button>\n          </div>\n      </div>\n      <div style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #4A4438; line-height: 1.8\">\n        <span>※ 電鉄富山〜立山を直通する列車のみ表示しています（寺田駅などで乗り換えが必要な列車は表示していません）。</span>\n        <span>※ 宇奈月温泉方面から寺田駅で乗り換えて立山へ向かう場合は、<a href=\"Kurobe.html\">黒部・宇奈月エリアガイドの時刻表</a>をご覧ください。</span>\n        <span>※ 特急・快速特急のご利用には、別途特急券が必要です。</span>\n        <span>※ 5:10発（休日も同じ）は快速特急「スーパーたてやま」で、別途快速特急券が必要です。</span>\n        <span>※ 現在時刻以降の5本を表示しています。黄色の行が次に発車する列車です。</span>\n        <span>※ 平日と土日祝日でダイヤが異なります（ヘッダーの色：緑＝平日／朱＝土日祝日）。</span>\n        <span>※ 2026年3月14日改正の時刻表です。</span>\n      </div>\n    </div>\n  </section>\n  <!-- アルペンルートの行程を調べる -->\n  <section data-sec=\"search\" style=\"padding: 88px 24px 0\">\n    <div style=\"max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px\">\n      <div style=\"display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; justify-content: space-between\">\n        <div style=\"display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline\">\n          <h2 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: 28px\">アルペンルートの行程を調べる</h2>\n          <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 18px; letter-spacing: 0.2em; color: #8A4A35\">JOURNEY SEARCH</span>\n        </div>\n        <button onClick=\"{{ openDia }}\" style=\"font-family: inherit; font-size: 14px; font-weight: 700; color: #2F4A3C; background: #FFFFFF; border: 1px solid #2F4A3C; border-radius: 2px; padding: 0 16px; min-height: 44px; display: flex; gap: 8px; align-items: center\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"1\"></rect><path d=\"M3 9h18M8 4v16M14 4v16\"></path></svg>1日のダイヤを見る</button>\n      </div>\n      <p style=\"margin: 0; font-size: 15px; line-height: 1.8; color: #4A4438\">行きと帰りの行程をまとめて調べられます。片道だけ調べたいときは「帰りも検索する」のチェックを外してください。時刻や休憩、帰りの出発時刻は「時刻・休憩を指定」から設定できます。</p>\n      <div style=\"background: #FFFDF8; border: 1px solid #D8CFBD; padding: 20px 24px; display: flex; flex-direction: column; gap: 14px\">\n        <div style=\"display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end\">\n          <div style=\"flex: 1 1 170px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #4A4438; position: relative; min-width: 0\">出発\n            <button onClick=\"{{ dd_from }}\" aria-haspopup=\"listbox\" style=\"font-family: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid #B7AC97; border-radius: 2px; background: #FFFFFF; min-height: 48px; width: 100%; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left; color: #2B2B2B; cursor: pointer\"><span>{{ from }}</span><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#5E5648\" stroke-width=\"2\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"></path></svg></button>\n            <sc-if value=\"{{ open_from }}\" hint-placeholder-val=\"{{ false }}\">\n              <div role=\"listbox\" style=\"position: absolute; top: 100%; left: 0; min-width: 100%; width: max-content; max-width: 320px; margin-top: 4px; z-index: 40; background: #FFFFFF; border: 1px solid #B7AC97; box-shadow: 0 10px 24px rgba(0,0,0,0.18); display: flex; flex-direction: column; padding: 4px 0\">\n                <sc-for list=\"{{ fromOpts }}\" as=\"o\" hint-placeholder-count=\"5\">\n                  <button role=\"option\" onClick=\"{{ o.pick }}\" style=\"font-family: inherit; text-align: left; border: none; background: {{ o.bg }}; color: #2B2B2B; padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; cursor: pointer; min-height: 44px\"><span style=\"font-size: 15px; font-weight: {{ o.fw }}\">{{ o.mark }}{{ o.name }}</span><span style=\"font-size: 12px; color: #6B6458\">{{ o.sub }}</span></button>\n                </sc-for>\n              </div>\n            </sc-if>\n          </div>\n          <button aria-label=\"出発と到着を入れ替える\" onClick=\"{{ swap }}\" style=\"flex: 0 0 48px; height: 48px; border-radius: 50%; border: 1px solid #2F4A3C; background: #FFFFFF; color: #2F4A3C; font-size: 20px\">⇄</button>\n          <div style=\"flex: 1 1 170px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #4A4438; position: relative; min-width: 0\">到着\n            <button onClick=\"{{ dd_to }}\" aria-haspopup=\"listbox\" style=\"font-family: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid #B7AC97; border-radius: 2px; background: #FFFFFF; min-height: 48px; width: 100%; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left; color: #2B2B2B; cursor: pointer\"><span>{{ to }}</span><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#5E5648\" stroke-width=\"2\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"></path></svg></button>\n            <sc-if value=\"{{ open_to }}\" hint-placeholder-val=\"{{ false }}\">\n              <div role=\"listbox\" style=\"position: absolute; top: 100%; left: 0; min-width: 100%; width: max-content; max-width: 320px; margin-top: 4px; z-index: 40; background: #FFFFFF; border: 1px solid #B7AC97; box-shadow: 0 10px 24px rgba(0,0,0,0.18); display: flex; flex-direction: column; padding: 4px 0\">\n                <sc-for list=\"{{ toOpts }}\" as=\"o\" hint-placeholder-count=\"5\">\n                  <button role=\"option\" onClick=\"{{ o.pick }}\" style=\"font-family: inherit; text-align: left; border: none; background: {{ o.bg }}; color: #2B2B2B; padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; cursor: pointer; min-height: 44px\"><span style=\"font-size: 15px; font-weight: {{ o.fw }}\">{{ o.mark }}{{ o.name }}</span><span style=\"font-size: 12px; color: #6B6458\">{{ o.sub }}</span></button>\n                </sc-for>\n              </div>\n            </sc-if>\n          </div>\n          <div style=\"flex: 1 1 230px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #4A4438; position: relative; min-width: 0\">日付\n            <button onClick=\"{{ toggleCal }}\" aria-haspopup=\"dialog\" style=\"font-family: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid #B7AC97; border-radius: 2px; background: #FFFFFF; min-height: 48px; width: 100%; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left; color: #2B2B2B; cursor: pointer\"><span>{{ dateLabel }}</span><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#5E5648\" stroke-width=\"1.8\" aria-hidden=\"true\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"></rect><path d=\"M3 10h18M8 3v4M16 3v4\"></path></svg></button>\n            <sc-if value=\"{{ calOpen }}\" hint-placeholder-val=\"{{ false }}\">\n              <div role=\"dialog\" aria-label=\"日付を選ぶ\" class=\"cal-pop\" style=\"position: absolute; top: 100%; left: 0; margin-top: 4px; z-index: 40; width: 320px; background: #FFFFFF; border: 1px solid #B7AC97; box-shadow: 0 10px 24px rgba(0,0,0,0.18); padding: 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; color: #2B2B2B\">\n                <div style=\"display: flex; align-items: center; justify-content: space-between\">\n                  <button onClick=\"{{ calPrev }}\" aria-label=\"前の月\" style=\"width: 36px; height: 36px; border: 1px solid #D8CFBD; background: #FFFFFF; font-size: 16px\">‹</button>\n                  <span style=\"font-size: 16px; font-weight: 700\">{{ calTitle }}</span>\n                  <button onClick=\"{{ calNext }}\" aria-label=\"次の月\" style=\"width: 36px; height: 36px; border: 1px solid #D8CFBD; background: #FFFFFF; font-size: 16px\">›</button>\n                </div>\n                <div style=\"display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; text-align: center; font-size: 12px; font-weight: 700\"><span style=\"color: #B5523B\">日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span style=\"color: #4F6F88\">土</span></div>\n                <div style=\"display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px\">\n                  <sc-for list=\"{{ calDays }}\" as=\"c\" hint-placeholder-count=\"35\">\n                    <button onClick=\"{{ c.pick }}\" style=\"font-family: inherit; border: none; background: {{ c.bg }}; color: {{ c.color }}; height: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; cursor: pointer; padding: 0\"><span style=\"font-size: 14px; font-weight: 700\">{{ c.d }}</span><span style=\"font-size: 9px; line-height: 1\">{{ c.note }}</span></button>\n                  </sc-for>\n                </div>\n                <div style=\"display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 11px; color: #5E5648\"><span><span style=\"display: inline-block; width: 10px; height: 10px; background: #2F4A3C; vertical-align: middle\"></span> 選択中</span><span><span style=\"display: inline-block; width: 10px; height: 10px; background: #ECE8E0; vertical-align: middle\"></span> 運休日</span><span style=\"color: #B5523B\">赤字：日曜・祝日</span></div>\n                <span style=\"font-size: 12px; line-height: 1.7; color: #8A3B26\">※ 運休期間（12月1日〜翌年4月14日）の日付を選んだ場合、行程は表示されません。</span>\n              </div>\n            </sc-if>\n          </div>\n        </div>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 12px; align-items: center\">\n          <button onClick=\"{{ toggleRet }}\" role=\"checkbox\" aria-checked=\"{{ retAria }}\" style=\"font-family: inherit; display: flex; gap: 10px; align-items: center; border: none; background: transparent; font-size: 15px; font-weight: 700; color: #2B2B2B; min-height: 44px; padding: 0 4px; cursor: pointer\"><span style=\"width: 22px; height: 22px; border: 2px solid #2F4A3C; border-radius: 3px; background: {{ retBoxBg }}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15px; line-height: 1\">{{ retCheck }}</span>帰りも検索する</button>\n          <span style=\"font-size: 12px; color: #5E5648\">（日帰りの方向け。宿泊などで片道だけ調べる場合はチェックを外してください）</span>\n          <div style=\"margin-left: auto; display: flex; flex-wrap: wrap; gap: 10px; flex: 1 1 360px; justify-content: flex-end\">\n            <button onClick=\"{{ openModal }}\" style=\"flex: 1 1 170px; font-family: inherit; font-size: 15px; font-weight: 700; background: #FFFFFF; color: #2F4A3C; border: 1px solid #2F4A3C; border-radius: 2px; min-height: 48px; display: flex; gap: 8px; align-items: center; justify-content: center\">\n              <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M12 7v5l3 2\"></path></svg>時刻・休憩を指定\n            </button>\n            <button onClick=\"{{ search }}\" style=\"flex: 1 1 160px; font-family: inherit; font-size: 16px; font-weight: 700; background: #2F4A3C; color: #FFFFFF; border: none; border-radius: 2px; min-height: 48px\">行程を検索</button>\n          </div>\n        </div>\n        <span style=\"font-size: 13px; color: #5E5648; line-height: 1.6\">指定条件：{{ condSummary }}</span>\n      </div>\n\n      <sc-if value=\"{{ modalOpen }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"position: fixed; inset: 0; z-index: 50; background: rgba(30,40,34,0.55); display: flex; align-items: center; justify-content: center; padding: 16px\">\n          <div role=\"dialog\" aria-modal=\"true\" aria-label=\"時刻・休憩を指定\" style=\"background: #FFFDF8; width: 100%; max-width: 620px; max-height: calc(100% - 32px); box-sizing: border-box; display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,0.25)\">\n            <div style=\"overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 18px\">\n            <div style=\"display: flex; gap: 14px; align-items: center\">\n              <span style=\"width: 48px; height: 48px; border-radius: 50%; background: #E3ECE4; display: flex; align-items: center; justify-content: center; flex: 0 0 48px\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#2F4A3C\" stroke-width=\"1.8\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M12 7v5l3 2\"></path></svg></span>\n              <h3 style=\"margin: 0; flex: 1 1 auto; font-family: 'Noto Serif JP', serif; font-size: clamp(20px, 5vw, 24px)\">時刻・休憩を指定</h3>\n              <button aria-label=\"閉じる\" onClick=\"{{ closeModal }}\" style=\"width: 44px; height: 44px; border: none; background: transparent; font-size: 24px; color: #4A4438\">×</button>\n            </div>\n            <div style=\"display: flex; flex-direction: column; gap: 8px\">\n              <span style=\"font-size: 14px; font-weight: 700\">行きの時刻の指定方法</span>\n              <div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n                <sc-for list=\"{{ modes }}\" as=\"m\" hint-placeholder-count=\"3\">\n                  <button onClick=\"{{ m.pick }}\" style=\"flex: 1 1 140px; font-family: inherit; font-size: 14px; font-weight: 700; border: 1px solid {{ m.border }}; background: {{ m.bg }}; color: {{ m.color }}; border-radius: 2px; padding: 8px 12px; min-height: 48px\">{{ m.label }}</button>\n                </sc-for>\n              </div>\n            </div>\n            <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700\">指定時刻\n              <select value=\"{{ time }}\" onChange=\"{{ onTime }}\" style=\"font-family: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid #B7AC97; border-radius: 2px; background: #FFFFFF; min-height: 48px; width: 100%; box-sizing: border-box\"><sc-for list=\"{{ timeOptions }}\" as=\"t\" hint-placeholder-count=\"20\"><option>{{ t }}</option></sc-for></select>\n              <span style=\"font-size: 13px; font-weight: 400; color: #5E5648\">{{ timeHelp }}</span>\n            </lab
