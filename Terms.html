<style>
body{margin:0;background:#F5F1E8}
a{color:#2F4A3C}a:hover{color:#1E3328}
.sp-only{display:none !important}
.hide{display:none !important}
.scroller{scrollbar-width:thin}
details.menu>summary{list-style:none;cursor:pointer}
details.menu>summary::-webkit-details-marker{display:none}
.spots{display:flex;gap:24px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:12px}
.spots>*{flex:0 0 320px;scroll-snap-align:start}
.route-inner .route-card{flex:1 1 0 !important;min-width:0}
@media (max-width:767px){
.pc-only{display:none !important}.sp-only{display:flex !important}.sp-hide{display:none !important}
.spots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;overflow:visible}
.spots>*{flex:none}
.route-inner{width:max-content !important;max-width:none !important}
.route-inner .route-card{flex:0 0 168px !important}
.fare-grid{min-width:0 !important}
.tm-toc{flex:1 1 100% !important;position:static !important}
.ab-photos{grid-template-columns:1fr 1fr !important}
.ab-photos>img:first-child{grid-column:1 / -1}
.ab-photos>img{aspect-ratio:3 / 2;height:auto !important}
.fare-grid>div{padding:10px 3px !important;font-size:12px !important;word-break:keep-all;overflow-wrap:anywhere}
.tt-grid{padding-left:10px !important;padding-right:10px !important;gap:6px !important}
.tt-grid>span{font-size:11px}
}

html{scroll-behavior:smooth}
body{overflow-wrap:break-word}
h1,h2,h3,button,a,span,p,li,td,th{overflow-wrap:anywhere;word-break:normal}
details.lang>summary::-webkit-details-marker{display:none}
.hero-slides{position:relative;overflow:hidden}
.hero-slides>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;animation:heroFade 15s infinite}
.hero-slides>img:nth-of-type(1){position:relative;opacity:1;animation:none}
.hero-slides>img:nth-of-type(2){animation-delay:5s}
.hero-slides>img:nth-of-type(3){animation-delay:10s}
@keyframes heroFade{0%{opacity:0}4%{opacity:1}33%{opacity:1}37%{opacity:0}100%{opacity:0}}
.hero-dots{position:absolute;right:20px;bottom:16px;display:flex;gap:6px;z-index:2}
.hero-dots>span{width:22px;height:4px;background:rgba(255,255,255,0.5);animation:heroDot 15s infinite}
.hero-dots>span:nth-child(2){animation-delay:5s}.hero-dots>span:nth-child(3){animation-delay:10s}
@keyframes heroDot{0%{background:#FFFFFF}33%{background:#FFFFFF}34%{background:rgba(255,255,255,0.5)}100%{background:rgba(255,255,255,0.5)}}
@media (prefers-reduced-motion: reduce){.hero-slides>img{animation:none}.hero-slides>img:nth-of-type(1){opacity:1}}
</style>

ius: 2px; padding: 0 12px; color: #2B2B2B; display: flex; gap: 6px; align-items: center; justify-content: center; min-height: 44px; min-width: 44px; box-sizing: border-box\">\n          <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18\"></path></svg>\n          <span class=\"pc-only\">日本語</span><span aria-hidden=\"true\" style=\"font-size: 10px\">▼</span>\n        </summary>\n        <div role=\"menu\" style=\"position: absolute; right: 0; top: calc(100% + 6px); z-index: 60; background: #FFFFFF; border: 1px solid #B7AC97; box-shadow: 0 10px 24px rgba(0,0,0,0.18); min-width: 180px; padding: 4px 0; display: flex; flex-direction: column\">\n          <a role=\"menuitem\" href=\"#\" style=\"text-decoration: none; color: #2B2B2B; font-weight: 700; background: #EEF3EE; padding: 10px 16px; font-size: 14px\">✓ 日本語</a>\n          <a role=\"menuitem\" href=\"#\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 16px; font-size: 14px\">English</a>\n          <a role=\"menuitem\" href=\"#\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 16px; font-size: 14px\">简体中文</a>\n          <a role=\"menuitem\" href=\"#\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 16px; font-size: 14px\">繁體中文</a>\n          <a role=\"menuitem\" href=\"#\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 16px; font-size: 14px\">한국어</a>\n          <a role=\"menuitem\" href=\"#\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 16px; font-size: 14px\">ภาษาไทย</a>\n        </div>\n      </details>\n      <details class=\"menu sp-only\" style=\"flex: 0 0 auto\">\n        <summary aria-label=\"メニューを開く\" style=\"width: 44px; height: 44px; border: 1px solid #2B2B2B; border-radius: 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; box-sizing: border-box\">\n          <span style=\"width: 20px; height: 2px; background: #2B2B2B\"></span><span style=\"width: 20px; height: 2px; background: #2B2B2B\"></span><span style=\"width: 20px; height: 2px; background: #2B2B2B\"></span>\n        </summary>\n        <nav aria-label=\"メインメニュー\" style=\"position: absolute; left: 0; right: 0; top: 100%; z-index: 10; background: #F5F1E8; border-bottom: 1px solid #D8CFBD; padding: 8px 20px 20px; display: flex; flex-direction: column; font-size: 16px; font-weight: 500; box-shadow: 0 12px 24px rgba(60,45,20,0.12)\"><a href=\"Tateyama.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">エリア<span aria-hidden=\"true\">›</span></a><a href=\"Courses.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">モデルコース<span aria-hidden=\"true\">›</span></a><a href=\"Tickets.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">お得なチケット<span aria-hidden=\"true\">›</span></a><a href=\"RideRail.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">乗り方・きっぷ購入<span aria-hidden=\"true\">›</span></a><a href=\"Feature.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">特集<span aria-hidden=\"true\">›</span></a><a href=\"Access.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">アクセス<span aria-hidden=\"true\">›</span></a><a href=\"FAQ.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">よくある質問<span aria-hidden=\"true\">›</span></a></nav>\n      </details>\n    </div>\n  </header>\n\n  <section style=\"background: #2B2B2B; color: #F5F1E8; padding: 52px 24px 44px\">\n    <div style=\"max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px\">\n      <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 20px; letter-spacing: 0.3em; color: #D9C9A6\">TERMS OF USE</span>\n      <h1 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: clamp(28px, 3.6vw, 42px)\">利用規約</h1>\n      <span style=\"font-size: 13px; color: #CFC6B4\">［仮］本文は今後訂正予定のサンプルです</span>\n    </div>\n  </section>\n  <section style=\"padding: 40px 24px 0\">\n    <div style=\"max-width: 960px; margin: 0 auto; display: flex; flex-direction: column\">\n      <div style=\"display: flex; flex-direction: column\">\n        <p style=\"margin: 0 0 8px; font-size: 15px; line-height: 2\">本規約は、TOYAMA LOCAL TRACKS をご利用いただくにあたっての条件を定めたものです。ご利用の前に必ずお読みください。</p>\n        <article id=\"a1\" style=\"display: flex; flex-direction: column; gap: 10px; padding: 26px 0; border-top: 1px solid #D8CFBD\">\n          <h2 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: 20px; display: flex; gap: 14px; align-items: baseline\"><span style=\"color: #8A3B26\">第1条</span>本規約の適用・運営者</h2>\n          <div style=\"display: flex; flex-direction: column; gap: 10px;\"><p style=\"margin: 0; font-size: 15px; line-height: 2; color: #2B2B2B; white-space: pre-line\">本規約は、富山地方鉄道株式会社（以下「当社」といいます）が運営・提供する観光ガイドサイト「TOYAMA LOCAL TRACKS」（以下「本サービス」といいます）の利用に関する条件を定めるものです。</p><p style=\"margin: 0; font-size: 15px; line-height: 2; color: #2B2B2B; white-space: pre-line\">本サービスを利用されたすべての方（以下「利用者」といいます）は、本規約に同意したものとみなします。</p></div>\n        </article><article id=\"a2\" style=\"display: flex; flex-direction: column; gap: 10px; padding: 26px 0; border-top: 1px solid #D8CFBD\">\n          <h2 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: 20px; display: flex; gap: 14px; align-items: baseline\"><span style=\"color: #8A3B26\">第2条</span>本サービスの提供基盤</h2>\n          <div style=\"display: flex; flex-direction: column; gap: 10px;\"><p style=\"margin: 0; font-size: 15px; line-height: 2; color: #2B2B2B; white-space: pre-line\">本サービスは、ジョルダン株式会社が交通事業者向けに提供する観光ガイドプラットフォーム「JORUDAN LOCAL TRACKS」を基盤として構築・提供しています。</p><p style=\"margin: 0; font-size: 15px; line-height: 2; color: #2B2B2B; white-space: pre-line\">本サービスの運営主体および掲載内容の責任者は当社です。ジョルダン株式会社は、プラットフォームの提供およびシステムの技術的な運用を担います。</p><p style=\"margin: 0; font-size: 15px; line-height: 2; color: #2B2B2B; white-space: pre-line\">本サービス内の経路検索機能は、ジョルダン株式会社が提供する「JORUDAN VISIT」と連携しています。</p></div>\n        </article><article id=\"a3\" style=\"display: flex; flex-direction: column; gap: 10px; padding: 26px 0; border-top: 1px solid #D8CFBD\">\n          <h2 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: 20px; display: flex; gap: 14px; align-items: baseline\"><span style=\"color: #8A3B26\">第3条</span>掲載情報について</h2>\n          <div style=\"display: flex; flex-direction: column; gap: 10px;\"><p style=\"margin: 0; font-size: 15px; line-height: 2; color: #2B2B2B; white-space: pre-line\">当社は、本サービスに掲載する時刻・運賃・運行状況・観光情報等について、正確な情報の提供に努めますが、その正確性・完全性・最新性を保証するものではありません。</p><p style=\"margin: 0; font-size: 15px; line-height: 2; color: #2B2B2B; white-space: pre-line\">時刻・運賃・きっぷの内容等は予告なく変更される場合があります。ご利用の際は、駅の掲示や当社公式サイト等で最新の情報をご確認ください。</p><p style=\"margin: 0; font-size: 15px; line-height: 2; color: #2B2B2B; white-space: pre-line\">外国語のページには、機械翻訳による内容が含まれます。翻訳の内容に相違がある場合は、日本語の内容が優先されます。</p></div>\n        </article><article id=\"a4\" style=\"display: flex; flex-direction: column; gap: 10px; padding: 26px 0; border-top: 1px solid #D8CFBD\">\n          <h2 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: 20px; display: flex; gap: 14px; align-items: baseline\"><span style=\"color: #8A3B26\">第4条</span>外部サイト・外部サービス</h2>\n          <div style=\"display: flex; flex-direction: column; gap: 10px;\"><p style=\"margin: 0; font-size: 15px; line-height: 2; color: #2B2B2B; white-space: pre-line\">本サービスには、外部のウェブサイトやサービス（経路検索、きっぷ購入アプリ、観光施設のサイト等）へのリンクが含まれます。リンク先の内容や利用については、各運営者の定める規約等に従ってください。</p><p style=\"margin: 0; font-size: 15px; line-height: 2; color: #2B2B2B; white-space: pre-line\">当社は、リンク先のサイトやサービスの利用により生じた損害について、責任を負いません。</p></div>\n        </article><article id=\"a5\" style=\"display: flex; flex-direction: column; gap: 10px; padding: 26px 0; border-top: 1px solid #D8CFBD\">\n          <h2 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: 20px; display: flex; gap: 14px; align-items: baseline\"><span style=\"color: #8A3B26\">第5条</span>著作権・知的財産権</h2>\n          <div style=\"display: flex; flex-direction: column; gap: 10px;\"><p style=\"margin: 0; font-size: 15px; line-height: 2; color: #2B2B2B; white-space: pre-line\">本サービスに掲載している文章・写真・イラスト・地図・ロゴ等の著作権その他の知的財産権は、当社または正当な権利を有する第三者に帰属します。</p><p style=\"margin: 0; font-size: 15px; line-height: 2; color: #2B2B2B; white-space: pre-line\">私的利用など法令で認められる範囲を超えて、無断で複製・転載・改変・配布することを禁止します。</p></div>\n        </article><article id=\"a6\" style=\"display: flex; flex-direction: column; gap: 10px; padding: 26px 0; border-top: 1px solid #D8CFBD\">\n          <h2 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: 20px; display: flex; gap: 14px; align-items: baseline\"><span style=\"color: #8A3B26\">第6条</span>禁止事項</h2>\n          <div style=\"display: flex; flex-direction: column; gap: 10px;\"><p style=\"margin: 0; font-size: 15px; line-height: 2; color: #2B2B2B; white-space: pre-line\">利用者は、本サービスの利用にあたり、次の行為をしてはなりません。</p><p style=\"margin: 0; font-size: 15px; line-height: 2; color: #2B2B2B; white-space: pre-line\">・法令または公序良俗に反する行為\n・当社または第三者の権利・利益を侵害する行為\n・本サービスの運営を妨げる行為、サーバーに過度な負荷をかける行為\n・不正アクセス、またはそれを試みる行為\n・その他、当社が不適切と判断する行為</p></div>\n        </article><article id=\"a7\" style=\"display: flex; flex-direction: column; gap: 10px; paddi
