body{margin:0;background:#F5F1E8}

.hero-slides{position:relative;overflow:hidden}

r; justify-content: center; gap: 5px; box-sizing: border-box\">\n          <span style=\"width: 20px; height: 2px; background: #2B2B2B\"></span><span style=\"width: 20px; height: 2px; background: #2B2B2B\"></span><span style=\"width: 20px; height: 2px; background: #2B2B2B\"></span>\n        </summary>\n        <nav aria-label=\"メインメニュー\" style=\"position: absolute; left: 0; right: 0; top: 100%; z-index: 10; background: #F5F1E8; border-bottom: 1px solid #D8CFBD; padding: 8px 20px 20px; display: flex; flex-direction: column; font-size: 16px; font-weight: 500; box-shadow: 0 12px 24px rgba(60,45,20,0.12)\"><a href=\"Tateyama.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">エリア<span aria-hidden=\"true\">›</span></a><a href=\"Courses.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">モデルコース<span aria-hidden=\"true\">›</span></a><a href=\"Tickets.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">お得なチケット<span aria-hidden=\"true\">›</span></a><a href=\"RideRail.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">乗り方・きっぷ購入<span aria-hidden=\"true\">›</span></a><a href=\"Feature.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">特集<span aria-hidden=\"true\">›</span></a><a href=\"Access.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">アクセス<span aria-hidden=\"true\">›</span></a><a href=\"FAQ.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">よくある質問<span aria-hidden=\"true\">›</span></a></nav>\n      </details>\n    </div>\n  </header>\n\n  <!-- ページ見出し -->\n  <section style=\"background: #2F4A3C; color: #F5F1E8; padding: 64px 24px 56px\">\n    <div style=\"max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px\">\n      <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 20px; letter-spacing: 0.3em; color: #D9C9A6\">HOW TO RIDE &amp; BUY TICKETS</span>\n      <h1 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: clamp(28px, 3.6vw, 44px); letter-spacing: 0.06em\">乗り方・きっぷ購入</h1>\n      <p style=\"margin: 0; font-size: 16px; line-height: 1.9; color: #E2DACA; max-width: 760px\">市内電車は、まちなかの観光にとても便利な乗り物です。運賃と乗り方、富山駅ののりばをご案内します。</p>\n    </div>\n  </section>\n  <div style=\"border-bottom: 1px solid #D8CFBD\"><div style=\"max-width: 1280px; margin: 0 auto; padding: 0 24px; display: flex; gap: 8px\">\n    <a href=\"RideRail.html\" style=\"text-decoration: none; padding: 16px 22px; white-space: nowrap; color: #4A4438\">鉄道線</a>\n    <a href=\"RideTram.html\" style=\"text-decoration: none; padding: 16px 22px; white-space: nowrap; color: #2B2B2B; font-weight: 700; border-bottom: 3px solid #B5523B\">市内電車</a>\n  </div></div>\n  <nav aria-label=\"このページの内容\" style=\"padding: 20px 24px 0\"><div style=\"max-width: 1280px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px\">\n    <a href=\"#fare\" style=\"text-decoration: none; font-size: 13px; color: #2F4A3C; border: 1px solid #B7AC97; background: #FFFDF8; padding: 8px 14px\">運賃</a><a href=\"#ride\" style=\"text-decoration: none; font-size: 13px; color: #2F4A3C; border: 1px solid #B7AC97; background: #FFFDF8; padding: 8px 14px\">乗り方</a><a href=\"#routemap\" style=\"text-decoration: none; font-size: 13px; color: #2F4A3C; border: 1px solid #B7AC97; background: #FFFDF8; padding: 8px 14px\">路線図</a><a href=\"#platform\" style=\"text-decoration: none; font-size: 13px; color: #2F4A3C; border: 1px solid #B7AC97; background: #FFFDF8; padding: 8px 14px\">富山駅ののりば</a>\n  </div></nav>\n  <!-- 運賃 -->\n  <section id=\"fare\" style=\"padding: 72px 24px 0\">\n    <div style=\"max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px\">\n      <div style=\"display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; justify-content: space-between\">\n        <div style=\"display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline\">\n          <h2 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: 28px\">運賃</h2>\n          <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 18px; letter-spacing: 0.2em; color: #8A4A35\">FARE</span>\n        </div>\n      </div>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 24px; align-items: stretch\">\n        <div style=\"flex: 3 1 480px; min-width: 0; background: #FFFDF8; border: 1px solid #D8CFBD; display: flex; flex-direction: column\">\n          <div style=\"padding: 18px 22px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; border-bottom: 1px solid #EFE8D8\">\n            <span style=\"font-size: 15px; font-weight: 700\">全区間均一運賃</span><span style=\"font-size: 13px; color: #4A4438\">どこまで乗っても同じ運賃です（後払い）</span>\n          </div>\n          <div style=\"display: grid; grid-template-columns: minmax(0, 1.6fr) repeat(2, minmax(0, 1fr)); padding: 10px 22px; font-size: 13px; color: #5E5648; background: #F3EEE2\"><span>支払い方法</span><span>大人</span><span>こども</span></div>\n          <div style=\"display: grid; grid-template-columns: minmax(0, 1.6fr) repeat(2, minmax(0, 1fr)); padding: 16px 22px; border-top: 1px solid #EFE8D8; align-items: center\"><span style=\"font-size: 15px; font-weight: 700\">現金・全国交通系ICカード</span><span style=\"font-size: 24px; font-weight: 700\">240円</span><span style=\"font-size: 24px; font-weight: 700\">120円</span></div>\n          <div style=\"display: grid; grid-template-columns: minmax(0, 1.6fr) repeat(2, minmax(0, 1fr)); padding: 14px 22px; border-top: 1px solid #EFE8D8; align-items: center\"><span style=\"font-size: 14px; font-weight: 700\">えこまいか・パスカ</span><span style=\"font-size: 16px\">220円</span><span style=\"font-size: 16px\">110円</span></div>\n        </div>\n        <a href=\"Tickets.html\" style=\"flex: 2 1 320px; min-width: 0; text-decoration: none; background: #8A3B26; color: #FFFFFF; padding: 26px; display: flex; flex-direction: column; gap: 12px; justify-content: center\">\n          <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 16px; letter-spacing: 0.25em; color: #F3D9C9\">VALUE TICKETS</span>\n          <span style=\"font-family: 'Noto Serif JP', serif; font-size: 24px; font-weight: 700; line-height: 1.5\">1日に何度も乗るなら、<br>お得なきっぷがあります。</span>\n          <span style=\"font-size: 14px; line-height: 1.8; color: #F7E6DC\">市内電車の1日乗り放題や、名物の引換クーポン付きのきっぷなど。</span>\n          <span style=\"align-self: flex-start; font-size: 15px; font-weight: 700; color: #8A3B26; background: #FFFFFF; padding: 12px 18px\">お得なチケットを見る →</span>\n        </a>\n      </div>\n    </div>\n  </section>\n  <!-- 乗り方 -->\n  <section id=\"ride\" style=\"padding: 72px 24px 0\">\n    <div style=\"max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px\">\n      <div style=\"display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; justify-content: space-between\">\n        <div style=\"display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline\">\n          <h2 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: 28px\">市内電車の乗り方</h2>\n          <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 18px; letter-spacing: 0.2em; color: #8A4A35\">HOW TO RIDE</span>\n        </div>\n      </div>\n      <div style=\"background: #C2185B; color: #FFFFFF; padding: 14px 22px; font-size: 18px; font-weight: 700; border-radius: 4px\">市内電車は、「中乗り・前降り・運賃後払い（均一運賃）」です</div>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px\">\n        <div style=\"background: #FFFDF8; border: 1px solid #D8CFBD; padding: 20px 22px; display: flex; flex-direction: column; gap: 10px; min-width: 0\">\n          <div style=\"display: flex; gap: 12px; align-items: center\"><span style=\"flex: 0 0 40px; height: 40px; border-radius: 50%; background: #2F4A3C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700\">1</span><span style=\"font-family: 'Noto Serif JP', serif; font-size: 22px; font-weight: 700\">電車に乗るとき</span></div>\n          <span style=\"font-size: 15px; line-height: 1.9\">行き先をご確認の上、車両中央の乗車口よりご乗車ください。</span>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 6px\"><span style=\"font-size: 13px; font-weight: 700; color: #FFFFFF; background: #2F7FC1; padding: 3px 12px\">現金</span><span style=\"font-size: 13px; font-weight: 700; color: #FFFFFF; background: #E08A2C; padding: 3px 12px\">ICカード</span><span style=\"font-size: 13px; font-weight: 700; color: #FFFFFF; background: #2B4C7E; padding: 3px 12px\">1日乗車券</span><span style=\"font-size: 13px; font-weight: 700; color: #FFFFFF; background: #2B4C7E; padding: 3px 12px\">モバイル乗車券</span></div>\n          <span style=\"font-size: 15px; line-height: 1.9\">そのままご乗車ください。整理券はございません。</span>\n        </div>\n        <div style=\"background: #FFFDF8; border: 1px solid #D8CFBD; padding: 20px 22px; display: flex; flex-direction: column; gap: 10px; min-width: 0\">\n          <div style=\"display: flex; gap: 12px; align-items: center\"><span style=\"flex: 0 0 40px; height: 40px; border-radius: 50%; background: #2F4A3C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700\">2</span><span style=\"font-family: 'Noto Serif JP', serif; font-size: 22px; font-weight: 700\">電車から降りるとき</span></div>\n          <span style=\"font-size: 前方下車口下車。\",\"내릴 정류장이 가까워지면 하차 버튼을 눌러 주세요. 차량 앞쪽 하차구로 내립니다.\",\"ใกล้ถึงป้าย กดปุ่มขอลง แล้วลงที่ประตูหน้า\"],\"料金は降りるときにお支払い願います。\":[\"Pay your fare when you get off.\",\"请在下车时付费。\",\"請在下車時付費。\",\"요금은 내릴 때 지불해 주세요.\",\"จ่ายค่าโดยสารตอนลงรถ\"],\"車両前面にある運賃箱の運賃投入口にお入れください。運賃箱はおつりが出ませんので、両替をあらかじめお済ませのうえ、ちょうどの金額をお入れください。\":[\"Put the fare in the fare box at the front. No change is given, so please use the changer beforehand and pay the exact amount.\",\"请将车费投入车厢前方车费箱的投币口。车费箱不找零，请提前换好零钱并投入准确金额。\",\"請將車資投入車廂前方車資箱的投幣口。車資箱不找零，請提前換好零錢並投入準確金額。\",\"차량 앞쪽 운임함 투입구에 넣어 주세요. 운임함은 거스름돈이 나오지 않으니 미리 환전하고 정확한 금액을 넣어 주세요.\",\"หย่อนค่าโดยสารลงกล่องด้านหน้า ไม่มีเงินทอน โปรดแลกเหรียญก่อนและจ่ายพอดี\"],\"降車リーダーにICカードをタッチしてください。複数人精算や、割引精算の方は、降車タッチする前に運転士へお申し出ください。複数人精算は乗換え適用外となりますので、ICカードをお一人様1枚ずつご利用ください。\\n降車リーダーの位置：全国交通系ICカードは降車口の横、えこまいか・パスカは運転席の横にあります。\":[\"Tap your IC card on the reader. Paying for several people or a discount fare? Tell the driver before you tap. Group payments don't qualify for transfer discounts, so one card per person is best.\\nReader locations: national transit IC cards — next to the exit; ecomaica/Passca — next to the driver's seat.\",\"请在下车读卡器上刷IC卡。多人结算或优惠结算者，请在刷卡前告知司机。多人结算不适用换乘优惠，请每人使用1张IC卡。\\n读卡器位置：全国交通IC卡在下车口旁，ecomaica・Passca在驾驶座旁。\",\"請在下車讀卡機上感應IC卡。多人結算或優惠結算者，請在感應前告知司機。多人結算不適用轉乘優惠，請每人使用1張IC卡。\\n讀卡機位置：全國交通IC卡在下車口旁，ecomaica・Passca在駕駛座旁。\",\"하차 리더기에 IC카드를 터치해 주세요. 여러 명 정산이나 할인 정산은 터치 전에 운전사에게 말씀해 주세요. 여러 명 정산은 환승 적용 외이므로 IC카드는 1인 1장씩 이용해 주세요.\\n리더기 위치: 전국 교통계 IC카드는 하차구 옆, 에코마이카・파스카는 운전석 옆에 있습니다.\",\"แตะบัตร IC ที่เครื่องอ่าน หากจ่ายหลายคนหรือใช้ส่วนลด แจ้งคนขับก่อนแตะ การจ่ายหลายคนไม่ได้รับส่วนลดเปลี่ยนรถ จึงควรใช้บัตรคนละใบ\\nตำแหน่งเครื่องอ่าน: บัตร IC ทั่วประเทศอยู่ข้างประตูลง ecomaica・Passca อยู่ข้างที่นั่งคนขับ\"],\"日付が確認できるように運転士にはっきりとご提示ください。\":[\"Show the driver your pass clearly so the date can be seen.\",\"请向司机清楚出示，以便确认日期。\",\"請向司機清楚出示，以便確認日期。\",\"날짜를 확인할 수 있도록 운전사에게 분명히 보여 주세요.\",\"แสดงให้คนขับเห็นวันที่อย่างชัดเจน\"],\"乗車券表示画面を確認できるように運転士にはっきりとご提示ください。\":[\"Show the driver your ticket screen clearly.\",\"请向司机清楚出示乘车券画面。\",\"請向司機清楚出示乘車券畫面。\",\"승차권 표시 화면을 운전사에게 분명히 보여 주세요.\",\"แสดงหน้าจอตั๋วให้คนขับเห็นอย่างชัดเจน\"],\"全国交通系ICカード（Kitaca・Suica・PASMO・manaca・TOICA・ICOCA・PiTaPa・はやかけん・nimoca・SUGOCA）もご利用いただけます。\":[\"Major Japanese transit IC cards (Kitaca, Suica, PASMO, manaca, TOICA, ICOCA, PiTaPa, Hayakaken, nimoca, SUGOCA) are also accepted.\",\"也可使用全国交通IC卡（Kitaca・Suica・PASMO・manaca・TOICA・ICOCA・PiTaPa・Hayakaken・nimoca・SUGOCA）。\",\"也可使用全國交通IC卡（Kitaca・Suica・PASMO・manaca・TOICA・ICOCA・PiTaPa・Hayakaken・nimoca・SUGOCA）。\",\"전국 교통계 IC카드（Kitaca・Suica・PASMO・manaca・TOICA・ICOCA・PiTaPa・하야카켄・nimoca・SUGOCA）도 이용할 수 있습니다.\",\"ใช้บัตร IC ขนส่งทั่วประเทศ (Kitaca, Suica, PASMO, manaca, TOICA, ICOCA, PiTaPa, Hayakaken, nimoca, SUGOCA) ได้ด้วย\"],\"くわしい乗り方（富山地方鉄道）↗\":[\"More on how to ride (Toyama Chiho Railway) ↗\",\"详细乘车方法（富山地方铁道）↗\",\"詳細乘車方式（富山地方鐵道）↗\",\"자세한 이용 방법（도야마 지방철도）↗\",\"วิธีขึ้นรถโดยละเอียด (รถไฟโทยามะ ชิโฮ) ↗\"],\"乗り方の動画を見る ↗\":[\"Watch the how-to video ↗\",\"观看乘车方法视频 ↗\",\"觀看乘車方式影片 ↗\",\"이용 방법 동영상 보기 ↗\",\"ดูวิดีโอวิธีขึ้นรถ ↗\"],\"系統・時刻を調べる（富山地方鉄道）↗\":[\"Routes & timetables (Toyama Chiho Railway) ↗\",\"查询线路・时刻（富山地方铁道）↗\",\"查詢路線・時刻（富山地方鐵道）↗\",\"계통・시각 검색（도야마 지방철도）↗\",\"ค้นหาสายและเวลา (รถไฟโทยามะ ชิโฮ) ↗\"],\"市内電車の路線図\":[\"Streetcar Route Map\",\"市内电车路线图\",\"市內電車路線圖\",\"노면전차 노선도\",\"แผนที่เส้นทางรถราง\"],\"ROUTE MAP\":[\"ROUTE MAP\",\"ROUTE MAP\",\"ROUTE MAP\",\"ROUTE MAP\",\"ROUTE MAP\"],\"拡大して見る\":[\"Zoom in\",\"放大查看\",\"放大查看\",\"확대해서 보기\",\"ขยายดู\"],\"路線図の見方\":[\"Reading the map\",\"路线图看法\",\"路線圖看法\",\"노선도 보는 법\",\"วิธีอ่านแผนที่\"],\"停留場には番号（C01〜C39）が付いています。車内の表示や案内と合わせてご確認ください。\":[\"Each stop has a number (C01–C39). Match it with the displays and announcements on board.\",\"各车站都有编号（C01〜C39），请对照车内显示和广播确认。\",\"各車站都有編號（C01〜C39），請對照車內顯示和廣播確認。\",\"정류장에는 번호（C01〜C39）가 붙어 있습니다. 차내 표시나 안내와 함께 확인하세요.\",\"แต่ละป้ายมีหมายเลข (C01–C39) ตรวจสอบกับจอและประกาศบนรถ\"],\"色の違う線は、運行する系統（1〜6系統）を表しています。乗る前に電車の前面の系統表示を確認しましょう。\":[\"Each color shows a route (Routes 1–6). Check the route number on the front of the streetcar before boarding.\",\"不同颜色的线代表不同线路（1〜6号线）。上车前请确认电车前方的线路显示。\",\"不同顏色的線代表不同路線（1〜6號線）。上車前請確認電車前方的路線顯示。\",\"색이 다른 선은 운행 계통（1〜6계통）을 나타냅니다. 타기 전에 전차 앞면의 계통 표시를 확인하세요.\",\"สีต่างกันแสดงสายต่างกัน (สาย 1–6) ตรวจดูหมายเลขสายด้านหน้ารถรางก่อนขึ้น\"],\"環状線（3系統）は、丸の内 → 国際会議場前 → 大手モール → グランドプラザ前 → 西町の一方向に走ります。\":[\"The Loop Line (Route 3) runs one way: Marunouchi → Kokusai Kaigijo-mae → Ote Mall → Grand Plaza-mae → Nishicho.\",\"环状线（3号线）单向运行：丸之内 → 国际会议场前 → 大手Mall → Grand Plaza前 → 西町。\",\"環狀線（3號線）單向運行：丸之內 → 國際會議場前 → 大手Mall → Grand Plaza前 → 西町。\",\"환상선（3계통）은 마루노우치 → 고쿠사이카이기조마에 → 오테몰 → 그랜드 플라자마에 → 니시초 한 방향으로 달립니다.\",\"สายวงแหวน (สาย 3) วิ่งทางเดียว: มารุโนะอุจิ → โคคุไซ ไคกิโจ-มาเอะ → โอเตะมอลล์ → แกรนด์พลาซ่า-มาเอะ → นิชิโช\"],\"1・2・4系統の南富山駅前行きは、中町（西町北）には停車しません。\":[\"Routes 1, 2 and 4 bound for Minami-Toyama Ekimae don't stop at Nakamachi (Nishicho-kita).\",\"1・2・4号线开往南富山站前的列车不停靠中町（西町北）。\",\"1・2・4號線開往南富山站前的列車不停靠中町（西町北）。\",\"1・2・4계통 미나미토야마에키마에행은 나카마치（니시초키타）에 정차하지 않습니다.\",\"สาย 1, 2, 4 ที่ไปมินามิ-โทยามะ เอกิมาเอะ ไม่จอดที่นากามาจิ (นิชิโช-คิตะ)\"],\"観光スポットの最寄り停留場は、富山市内エリアガイドでご案内しています。\":[\"Find the stops nearest to sights in the Toyama City area guide.\",\"景点最近车站请参阅富山市区指南。\",\"景點最近車站請參閱富山市區指南。\",\"관광지에서 가까운 정류장은 도야마 시내 지역 가이드에서 안내합니다.\",\"ดูป้ายใกล้สถานที่ท่องเที่ยวได้ในคู่มือพื้นที่เมืองโทยามะ\"],\"富山駅停留場ののりば\":[\"Platforms at Toyama Station Stop\",\"富山站电车站乘车处\",\"富山站電車站乘車處\",\"도야마역 정류장 승강장\",\"ชานชาลาป้ายสถานีโทยามะ\"],\"PLATFORMS\":[\"PLATFORMS\",\"PLATFORMS\",\"PLATFORMS\",\"PLATFORMS\",\"PLATFORMS\"],\"富山駅停留場は、あいの風とやま鉄道・JR高山線の改札口や北陸新幹線の改札口の近く、駅の東西自由通路に面しています。行き先によってホームが分かれています。\":[\"The Toyama Station stop is on the station's east–west concourse, near the Ainokaze Toyama Railway, JR Takayama Line and Hokuriku Shinkansen gates. Platforms differ by destination.\",\"富山站电车站位于车站东西自由通道旁，靠近爱之风富山铁道・JR高山线及北陆新干线检票口。不同目的地站台不同。\",\"富山站電車站位於車站東西自由通道旁，靠近愛之風富山鐵道・JR高山線及北陸新幹線剪票口。不同目的地月台不同。\",\"도야마역 정류장은 아이노카제 도야마
