<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TOYAMA LOCAL TRACKS 運行・災害情報</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Noto+Serif+JP:wght@500;700&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F1E8}
a{color:#2F4A3C}a:hover{color:#1E3328}
.sp-only{display:none !important}
.hide{display:none !important}
.scroller{scrollbar-width:thin}
details.menu>summary{list-style:none;cursor:pointer}
details.menu>summary::-webkit-details-marker{display:none}
.spots{display:flex;gap:24px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:12px}
.spots>*{flex:0 0 320px;scroll-snap-align:start}
.route-inner .route-card{flex:1 1 0 !important;min-width:0}
@media (max-width:767px){
.pc-only{display:none !important}.sp-only{display:flex !important}.sp-hide{display:none !important}
.spots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;overflow:visible}
.spots>*{flex:none}
.route-inner{width:max-content !important;max-width:none !important}
.route-inner .route-card{flex:0 0 168px !important}
.fare-grid{min-width:0 !important}
.sv-row{grid-template-columns:auto 1fr !important;padding:14px 16px !important}
.sv-row>span:last-child{grid-column:1 / -1}
.nt-row{grid-template-columns:auto 1fr !important;padding:14px 16px !important}
.nt-row{grid-template-columns:auto 1fr auto !important}
.nt-row>span:nth-child(3){grid-column:1 / -1;grid-row:2}
.nt-row>span:nth-child(4){grid-column:3;grid-row:1}
.nt-body{padding:0 16px 16px !important}
.fare-grid>div{padding:10px 3px !important;font-size:12px !important;word-break:keep-all;overflow-wrap:anywhere}
.tt-grid{padding-left:10px !important;padding-right:10px !important;gap:6px !important}
.tt-grid>span{font-size:11px}
}

body{overflow-wrap:break-word}
h1,h2,h3,button,a,span,p,li,td,th{overflow-wrap:anywhere;word-break:normal}
details.lang>summary::-webkit-details-marker{display:none}
.hero-slides{position:relative;overflow:hidden}
.hero-slides>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;animation:heroFade 15s infinite}
.hero-slides>img:nth-of-type(1){position:relative;opacity:1;animation:none}
.hero-slides>img:nth-of-type(2){animation-delay:5s}
.hero-slides>img:nth-of-type(3){animation-delay:10s}
@keyframes heroFade{0%{opacity:0}4%{opacity:1}33%{opacity:1}37%{opacity:0}100%{opacity:0}}
.hero-dots{position:absolute;right:20px;bottom:16px;display:flex;gap:6px;z-index:2}
.hero-dots>span{width:22px;height:4px;background:rgba(255,255,255,0.5);animation:heroDot 15s infinite}
.hero-dots>span:nth-child(2){animation-delay:5s}.hero-dots>span:nth-child(3){animation-delay:10s}
@keyframes heroDot{0%{background:#FFFFFF}33%{background:#FFFFFF}34%{background:rgba(255,255,255,0.5)}100%{background:rgba(255,255,255,0.5)}}
@media (prefers-reduced-motion: reduce){.hero-slides>img{animation:none}.hero-slides>img:nth-of-type(1){opacity:1}}
</style>

<script>window.__DC_TPL="\n\n<div style=\"font-family: 'Noto Sans JP', sans-serif; color: #2B2B2B; background: #F5F1E8; min-height: 100vh\">\n\n  <!-- 運行・災害情報テロップ -->\n  <sc-if value=\"{{ normal }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"background: #E3ECE4; border-bottom: 1px solid #B9CDBD; font-size: 14px\">\n      <div style=\"max-width: 1280px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 10px 16px; align-items: center\">\n        <span style=\"background: #2B2B2B; color: #FFFFFF; font-weight: 700; font-size: 12px; padding: 4px 10px; border-radius: 2px; white-space: nowrap\">運行・災害情報</span>\n        <span style=\"display: flex; align-items: center; gap: 6px; font-weight: 700; color: #2F4A3C; white-space: nowrap\"><span style=\"width: 10px; height: 10px; border-radius: 50%; background: #3E7A55\"></span>平常運行</span>\n        <span class=\"pc-only\" style=\"font-size: 12px; color: #5E5648; white-space: nowrap\">○時○分 更新</span>\n        <a href=\"Service.html\" style=\"margin-left: auto; font-size: 13px; font-weight: 700; white-space: nowrap\">詳しく見る →</a>\n      </div>\n    </div>\n  </sc-if>\n  <sc-if value=\"{{ alert }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"background: #8A3B26; color: #FFFFFF; font-size: 14px\">\n      <div style=\"max-width: 1280px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 10px 16px; align-items: center\">\n        <span style=\"background: #FFFFFF; color: #8A3B26; font-weight: 700; font-size: 12px; padding: 4px 10px; border-radius: 2px; white-space: nowrap\">運行・災害情報</span>\n        <span style=\"display: flex; align-items: center; gap: 6px; font-weight: 700; white-space: nowrap\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\"><path d=\"M12 3 2 21h20L12 3z\"></path><path d=\"M12 10v5M12 18v.5\"></path></svg>遅れ・運休あり</span>\n        <span class=\"pc-only\" style=\"font-size: 12px; white-space: nowrap\">○時○分 更新</span>\n        <a href=\"Service.html\" style=\"margin-left: auto; font-size: 13px; font-weight: 700; color: #FFFFFF; white-space: nowrap\">詳しく見る →</a>\n      </div>\n    </div>\n  </sc-if>\n\n  <!-- ヘッダー -->\n  <header style=\"border-bottom: 1px solid #D8CFBD; background: #F5F1E8; position: relative\">\n    <div style=\"max-width: 1280px; margin: 0 auto; padding: 14px 16px; display: flex; gap: 12px 32px; align-items: center\">\n      <a href=\"Main.html\" style=\"flex: 1 1 auto; text-decoration: none; color: #2B2B2B; display: flex; flex-direction: column; gap: 2px; min-width: 0\">\n        <span style=\"font-family: 'Cormorant Garamond', serif; font-size: clamp(16px, 2vw, 28px); font-weight: 600; letter-spacing: 0.1em; white-space: nowrap\">TOYAMA LOCAL TRACKS</span>\n        <span style=\"font-size: 11px; letter-spacing: 0.2em; color: #5E5648\">富山地方鉄道 観光ガイド</span>\n      </a>\n      <nav class=\"pc-only\" aria-label=\"メインメニュー\" style=\"display: flex; flex-wrap: wrap; gap: 4px 20px; font-size: 14px; font-weight: 500\"><a href=\"Tateyama.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 0\">エリア</a><a href=\"Courses.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 0\">モデルコース</a><a href=\"Tickets.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 0\">お得なチケット</a><a href=\"RideRail.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 0\">乗り方・きっぷ購入</a><a href=\"Feature.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 0\">特集</a><a href=\"Access.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 0\">アクセス</a><a href=\"FAQ.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 0\">よくある質問</a></nav>\n      <details class=\"lang\" style=\"flex: 0 0 auto; position: relative\">\n        <summary aria-label=\"言語を選択\" style=\"list-style: none; cursor: pointer; font-family: inherit; font-size: 13px; background: transparent; border: 1px solid #8C8270; border-radius: 2px; padding: 0 12px; color: #2B2B2B; display: flex; gap: 6px; align-items: center; justify-content: center; min-height: 44px; min-width: 44px; box-sizing: border-box\">\n          <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18\"></path></svg>\n          <span class=\"pc-only\">日本語</span><span aria-hidden=\"true\" style=\"font-size: 10px\">▼</span>\n        </summary>\n        <div role=\"menu\" style=\"position: absolute; right: 0; top: calc(100% + 6px); z-index: 60; background: #FFFFFF; border: 1px solid #B7AC97; box-shadow: 0 10px 24px rgba(0,0,0,0.18); min-width: 180px; padding: 4px 0; display: flex; flex-direction: column\">\n          <a role=\"menuitem\" href=\"#\" style=\"text-decoration: none; color: #2B2B2B; font-weight: 700; background: #EEF3EE; padding: 10px 16px; font-size: 14px\">✓ 日本語</a>\n          <a role=\"menuitem\" href=\"#\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 16px; font-size: 14px\">English</a>\n          <a role=\"menuitem\" href=\"#\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 16px; font-size: 14px\">简体中文</a>\n          <a role=\"menuitem\" href=\"#\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 16px; font-size: 14px\">繁體中文</a>\n          <a role=\"menuitem\" href=\"#\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 16px; font-size: 14px\">한국어</a>\n          <a role=\"menuitem\" href=\"#\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 16px; font-size: 14px\">ภาษาไทย</a>\n        </div>\n      </details>\n      <details class=\"menu sp-only\" style=\"flex: 0 0 auto\">\n        <summary aria-label=\"メニューを開く\" style=\"width: 44px; height: 44px; border: 1px solid #2B2B2B; border-radius: 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; box-sizing: border-box\">\n          <span style=\"width: 20px; height: 2px; background: #2B2B2B\"></span><span style=\"width: 20px; height: 2px; background: #2B2B2B\"></span><span style=\"width: 20px; height: 2px; background: #2B2B2B\"></span>\n        </summary>\n        <nav aria-label=\"メインメニュー\" style=\"position: absolute; left: 0; right: 0; top: 100%; z-index: 10; background: #F5F1E8; border-bottom: 1px solid #D8CFBD; padding: 8px 20px 20px; display: flex; flex-direction: column; font-size: 16px; font-weight: 500; box-shadow: 0 12px 24px rgba(60,45,20,0.12)\"><a href=\"Tateyama.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">エリア<span aria-hidden=\"true\">›</span></a><a href=\"Courses.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">モデルコース<span aria-hidden=\"true\">›</span></a><a href=\"Tickets.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">お得なチケット<span aria-hidden=\"true\">›</span></a><a href=\"RideRail.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">乗り方・きっぷ購入<span aria-hidden=\"true\">›</span></a><a href=\"Feature.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">特集<span aria-hidden=\"true\">›</span></a><a href=\"Access.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">アクセス<span aria-hidden=\"true\">›</span></a><a href=\"FAQ.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">よくある質問<span aria-hidden=\"true\">›</span></a></nav>\n      </details>\n    </div>\n  </header>\n\n  <!-- ページ見出し -->\n  <section style=\"background: #2B2B2B; color: #F5F1E8; padding: 56px 24px 48px\">\n    <div style=\"max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px\">\n      <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 20px; letter-spacing: 0.3em; color: #D9C9A6\">SERVICE &amp; DISASTER INFO</span>\n      <h1 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: clamp(28px, 3.6vw, 44px); letter-spacing: 0.06em\">運行・災害情報</h1>\n      <p style=\"margin: 0; font-size: 15px; line-height: 1.9; color: #D9D3C6; max-width: 760px\">鉄道線・市内電車の運行状況と、災害・運行に関するお知らせをご案内します。</p>\n    </div>\n  </section>\n  <!-- 運行状況 -->\n  <section style=\"padding: 56px 24px 0\">\n    <div style=\"max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px\">\n      <div style=\"display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; justify-content: space-between\">\n        <div style=\"display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline\">\n          <h2 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: 28px\">鉄道線・市内電車の運行状況</h2>\n          <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 18px; letter-spacing: 0.2em; color: #8A4A35\">STATUS</span>\n        </div>\n      </div>\n      <sc-if value=\"{{ showStatus }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display: flex; flex-direction: column; gap: 18px\">\n          <div style=\"background: #FFFDF8; border: 1px solid #D8CFBD\">\n            <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; padding: 12px 24px; font-size: 13px; color: #5E5648; background: #E6DECC\"><span>路線</span><span style=\"display: flex; justify-content: space-between; gap: 8px\"><span>運行状況</span><span style=\"font-variant-numeric: tabular-nums\">10/12 21:47 現在</span></span></div>\n            <sc-for list=\"{{ lines }}\" as=\"l\" hint-placeholder-count=\"3\">\n              <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px 12px; padding: 18px 24px; border-top: 1px solid #EFE8D8; align-items: center; background: {{ l.bg }}\">\n                <span style=\"font-size: 17px; font-weight: 700\">{{ l.name }}</span>\n                <span style=\"display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; color: {{ l.color }}\"><span style=\"width: 16px; height: 16px; border-radius: 50%; border: 3px solid {{ l.color }}; box-sizing: border-box; background: {{ l.dot }}\"></span>{{ l.status }}</span>\n              </div>\n            </sc-for>\n          </div>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 20px\">\n            <div style=\"flex: 1 1 420px; min-width: 0; font-size: 13px; line-height: 1.9; color: #4A4438\">\n              <span style=\"font-weight: 700; color: #2B2B2B\">【諸注意】</span>\n              <ul style=\"margin: 2px 0 10px; padding-left: 18px\">\n                <li>30分以上の遅れが発生または見込まれる場合にお知らせします。</li>\n                <li>画面は自動的に更新されませんので、時刻をご確認のうえ、ブラウザの「更新ボタン」などをご利用ください。</li>\n              </ul>\n              <span style=\"font-weight: 700; color: #2B2B2B\">【お知らせ】</span>\n              <p style=\"margin: 2px 0 10px\">各列車の走行位置など、詳しい運行状況は<a href=\"https://buscatch.jp/rt3/unko_rosen_list.php?id=chitetsu_train\">「とやまロケーションシステム」↗</a>をご確認ください。また、カターレトレインの運行状況は<a href=\"https://www.kataller.co.jp/sponsor-top/train/\">「カターレトレイン」↗</a>でご確認ください。</p>\n              <span>当サイトに掲載されている情報は、富山地方鉄道が提供しております。</span>\n            </div>\n            <div style=\"flex: 0 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 10px\">\n              <a href=\"https://www.chitetsu.co.jp/?page_id=38338\" style=\"text-decoration: none; text-align: center; font-size: 15px; font-weight:
