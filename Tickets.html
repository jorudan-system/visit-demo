<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TOYAMA LOCAL TRACKS お得なチケット一覧</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Noto+Serif+JP:wght@500;700&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F1E8}
a{color:#2F4A3C}a:hover{color:#1E3328}
.sp-only{display:none !important}
.hide{display:none !important}
.scroller{scrollbar-width:thin}
details.menu>summary{list-style:none;cursor:pointer}
details.menu>summary::-webkit-details-marker{display:none}
.spots{display:flex;gap:24px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:12px}
.spots>*{flex:0 0 320px;scroll-snap-align:start}
.route-inner .route-card{flex:1 1 0 !important;min-width:0}
@media (max-width:767px){
.pc-only{display:none !important}.sp-only{display:flex !important}.sp-hide{display:none !important}
.spots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;overflow:visible}
.spots>*{flex:none}
.route-inner{width:max-content !important;max-width:none !important}
.route-inner .route-card{flex:0 0 168px !important}
.fare-grid{min-width:0 !important}
.fare-grid>div{padding:10px 3px !important;font-size:12px !important;word-break:keep-all;overflow-wrap:anywhere}
.tt-grid{padding-left:10px !important;padding-right:10px !important;gap:6px !important}
.tt-grid>span{font-size:11px}
}

@media (max-width:767px){.tk-img{height:150px !important}.tk-img img{max-height:120px !important}}
body{overflow-wrap:break-word}
h1,h2,h3,button,a,span,p,li,td,th{overflow-wrap:anywhere;word-break:normal}
details.lang>summary::-webkit-details-marker{display:none}
.hero-slides{position:relative;overflow:hidden}
.hero-slides>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;animation:heroFade 15s infinite}
.hero-slides>img:nth-of-type(1){position:relative;opacity:1;animation:none}
.hero-slides>img:nth-of-type(2){animation-delay:5s}
.hero-slides>img:nth-of-type(3){animation-delay:10s}
@keyframes heroFade{0%{opacity:0}4%{opacity:1}33%{opacity:1}37%{opacity:0}100%{opacity:0}}
.hero-dots{position:absolute;right:20px;bottom:16px;display:flex;gap:6px;z-index:2}
.hero-dots>span{width:22px;height:4px;background:rgba(255,255,255,0.5);animation:heroDot 15s infinite}
.hero-dots>span:nth-child(2){animation-delay:5s}.hero-dots>span:nth-child(3){animation-delay:10s}
@keyframes heroDot{0%{background:#FFFFFF}33%{background:#FFFFFF}34%{background:rgba(255,255,255,0.5)}100%{background:rgba(255,255,255,0.5)}}
@media (prefers-reduced-motion: reduce){.hero-slides>img{animation:none}.hero-slides>img:nth-of-type(1){opacity:1}}
.hero-bg>img:nth-of-type(1){position:absolute !important;opacity:1}
</style>

分 更新</span>\n        <a href=\"Service.html\" style=\"margin-left: auto; font-size: 13px; font-weight: 700; color: #FFFFFF; white-space: nowrap\">詳しく見る →</a>\n      </div>\n    </div>\n  </sc-if>\n\n  <!-- ヘッダー -->\n  <header style=\"border-bottom: 1px solid #D8CFBD; background: #F5F1E8; position: relative\">\n    <div style=\"max-width: 1280px; margin: 0 auto; padding: 14px 16px; display: flex; gap: 12px 32px; align-items: center\">\n      <a href=\"Main.html\" style=\"flex: 1 1 auto; text-decoration: none; color: #2B2B2B; display: flex; flex-direction: column; gap: 2px; min-width: 0\">\n        <span style=\"font-family: 'Cormorant Garamond', serif; font-size: clamp(16px, 2vw, 28px); font-weight: 600; letter-spacing: 0.1em; white-space: nowrap\">TOYAMA LOCAL TRACKS</span>\n        <span style=\"font-size: 11px; letter-spacing: 0.2em; color: #5E5648\">富山地方鉄道 観光ガイド</span>\n      </a>\n      <nav class=\"pc-only\" aria-label=\"メインメニュー\" style=\"display: flex; flex-wrap: wrap; gap: 4px 20px; font-size: 14px; font-weight: 500\"><a href=\"Tateyama.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 0\">エリア</a><a href=\"Courses.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 0\">モデルコース</a><a href=\"Tickets.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 0; border-bottom: 2px solid #2B2B2B\">お得なチケット</a><a href=\"RideRail.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 0\">乗り方・きっぷ購入</a><a href=\"Feature.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 0\">特集</a><a href=\"Access.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 0\">アクセス</a><a href=\"FAQ.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 0\">よくある質問</a></nav>\n      <details class=\"lang\" style=\"flex: 0 0 auto; position: relative\">\n        <summary aria-label=\"言語を選択\" style=\"list-style: none; cursor: pointer; font-family: inherit; font-size: 13px; background: transparent; border: 1px solid #8C8270; border-radius: 2px; padding: 0 12px; color: #2B2B2B; display: flex; gap: 6px; align-items: center; justify-content: center; min-height: 44px; min-width: 44px; box-sizing: border-box\">\n          <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18\"></path></svg>\n          <span class=\"pc-only\">日本語</span><span aria-hidden=\"true\" style=\"font-size: 10px\">▼</span>\n        </summary>\n        <div role=\"menu\" style=\"position: absolute; right: 0; top: calc(100% + 6px); z-index: 60; background: #FFFFFF; border: 1px solid #B7AC97; box-shadow: 0 10px 24px rgba(0,0,0,0.18); min-width: 180px; padding: 4px 0; display: flex; flex-direction: column\">\n          <a role=\"menuitem\" href=\"#\" style=\"text-decoration: none; color: #2B2B2B; font-weight: 700; background: #EEF3EE; padding: 10px 16px; font-size: 14px\">✓ 日本語</a>\n          <a role=\"menuitem\" href=\"#\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 16px; font-size: 14px\">English</a>\n          <a role=\"menuitem\" href=\"#\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 16px; font-size: 14px\">简体中文</a>\n          <a role=\"menuitem\" href=\"#\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 16px; font-size: 14px\">繁體中文</a>\n          <a role=\"menuitem\" href=\"#\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 16px; font-size: 14px\">한국어</a>\n          <a role=\"menuitem\" href=\"#\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 16px; font-size: 14px\">ภาษาไทย</a>\n        </div>\n      </details>\n      <details class=\"menu sp-only\" style=\"flex: 0 0 auto\">\n        <summary aria-label=\"メニューを開く\" style=\"width: 44px; height: 44px; border: 1px solid #2B2B2B; border-radius: 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; box-sizing: border-box\">\n          <span style=\"width: 20px; height: 2px; background: #2B2B2B\"></span><span style=\"width: 20px; height: 2px; background: #2B2B2B\"></span><span style=\"width: 20px; height: 2px; background: #2B2B2B\"></span>\n        </summary>\n        <nav aria-label=\"メインメニュー\" style=\"position: absolute; left: 0; right: 0; top: 100%; z-index: 10; background: #F5F1E8; border-bottom: 1px solid #D8CFBD; padding: 8px 20px 20px; display: flex; flex-direction: column; font-size: 16px; font-weight: 500; box-shadow: 0 12px 24px rgba(60,45,20,0.12)\"><a href=\"Tateyama.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">エリア<span aria-hidden=\"true\">›</span></a><a href=\"Courses.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">モデルコース<span aria-hidden=\"true\">›</span></a><a href=\"Tickets.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">お得なチケット<span aria-hidden=\"true\">›</span></a><a href=\"RideRail.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">乗り方・きっぷ購入<span aria-hidden=\"true\">›</span></a><a href=\"Feature.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">特集<span aria-hidden=\"true\">›</span></a><a href=\"Access.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">アクセス<span aria-hidden=\"true\">›</span></a><a href=\"FAQ.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">よくある質問<span aria-hidden=\"true\">›</span></a></nav>\n      </details>\n    </div>\n  </header>\n\n  <!-- ページ見出し -->\n  <section style=\"position: relative; background: #8A3B26; color: #F5F1E8; overflow: hidden\">\n    <div class=\"hero-slides hero-bg\" aria-hidden=\"true\" style=\"position: absolute; inset: 0; opacity: 0.25\"><img src=\"img/hero_top.jpg\" alt=\"\" style=\"width: 100%; height: 100%; object-fit: cover\"><img src=\"img/car_kabocha.jpg\" alt=\"\" style=\"width: 100%; height: 100%; object-fit: cover\"><img src=\"img/gi_03.jpg\" alt=\"\" style=\"width: 100%; height: 100%; object-fit: cover\"></div>\n    <div style=\"position: relative; max-width: 1280px; margin: 0 auto; padding: 80px 24px 72px; display: flex; flex-direction: column; gap: 14px\">\n      <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 20px; letter-spacing: 0.3em; color: #F3D9C9\">VALUE TICKETS</span>\n      <h1 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: clamp(30px, 4vw, 48px); line-height: 1.5; letter-spacing: 0.04em\">乗り放題のきっぷで、<br>もっと気ままに途中下車。</h1>\n      <p style=\"margin: 0; font-size: 16px; line-height: 2; color: #EFE8D8; max-width: 720px\">1日乗り放題のフリーきっぷや、区間がお得になる往復きっぷ。旅のスタイルに合わせて選べば、乗るたびにきっぷを買う手間もなく、気になる駅で気軽に降りられます。購入できる場所やアプリでの購入可否もあわせてご確認ください。</p>\n    </div>\n  </section>\n  <!-- 絞り込み -->\n  <section style=\"padding: 40px 24px 0\">\n    <div class=\"sp-only\" style=\"flex-direction: column; gap: 10px\">\n      <div style=\"display: flex; gap: 8px; align-items: center\">\n        <button onClick=\"{{ openSheet }}\" style=\"flex: 0 0 auto; font-family: inherit; font-size: 14px; font-weight: 700; color: #FFFFFF; background: #2F4A3C; border: none; border-radius: 2px; padding: 0 14px; min-height: 44px; display: flex; gap: 6px; align-items: center\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\"><path d=\"M4 6h16M7 12h10M10 18h4\"></path></svg>絞り込み{{ activeCount }}</button>\n        <span style=\"flex: 1 1 auto; min-width: 0; font-size: 13px; color: #4A4438; white-space: nowrap; overflow: hidden; text-overflow: ellipsis\">{{ summary }}</span>\n      </div>\n      <div class=\"scroller\" style=\"display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px\">\n        <sc-for list=\"{{ areaBtns }}\" as=\"b\" hint-placeholder-count=\"10\"><button onClick=\"{{ b.pick }}\" style=\"flex: 0 0 auto; font-family: inherit; font-size: 13px; font-weight: 700; border: 1px solid {{ b.border }}; background: {{ b.bg }}; color: {{ b.color }}; border-radius: 999px; padding: 0 12px; min-height: 34px; white-space: nowrap\">{{ b.label }}</button></sc-for>\n      </div>\n    </div>\n    <div class=\"pc-only\" style=\"max-width: 1280px; margin: 0 auto; background: #FFFDF8; border: 1px solid #D8CFBD; padding: 20px 24px; display: flex; flex-direction: column; gap: 14px\">\n      <div style=\"display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center\">\n        <span style=\"flex: 0 0 84px; font-size: 13px; font-weight: 700\">種類</span>\n        <div style=\"flex: 1 1 400px; display: flex; flex-wrap: wrap; gap: 8px\">\n          <sc-for list=\"{{ areaBtns }}\" as=\"b\" hint-placeholder-count=\"5\"><button onClick=\"{{ b.pick }}\" style=\"font-family: inherit; font-size: 14px; font-weight: 700; border: 1px solid {{ b.border }}; background: {{ b.bg }}; color: {{ b.color }}; border-radius: 2px; padding: 0 16px; min-height: 40px\">{{ b.label }}</button></sc-for>\n        </div>\n      </div>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center\">\n        <span style=\"flex: 0 0 84px; font-size: 13px; font-weight: 700\">乗れるもの</span>\n        <div style=\"flex: 1 1 400px; display: flex; flex-wrap: wrap; gap: 8px\">\n          <sc-for list=\"{{ timeBtns }}\" as=\"b\" hint-placeholder-count=\"4\"><button onClick=\"{{ b.pick }}\" style=\"font-family: inherit; font-size: 14px; font-weight: 700; border: 1px solid {{ b.border }}; background: {{ b.bg }}; color: {{ b.color }}; border-radius: 2px; padding: 0 16px; min-height: 40px\">{{ b.label }}</button></sc-for>\n        </div>\n      </div>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center\">\n        <span style=\"flex: 0 0 84px; font-size: 13px; font-weight: 700\">買える場所</span>\n        <div style=\"flex: 1 1 400px; display: flex; flex-wrap: wrap; gap: 8px\">\n          <sc-for list=\"{{ tagBtns }}\" as=\"b\" hint-placeholder-count=\"10\"><button onClick=\"{{ b.pick }}\" style=\"font-family: inherit; font-size: 13px; font-weight: 700; border: 1px solid {{ b.border }}; background: {{ b.bg }}; color: {{ b.color }}; border-radius: 999px; padding: 0 14px; min-height: 36px\">{{ b.label }}</button></sc-for>\n        </div>\n      </div>\n    </div>\n  </section>\n  <!-- コース一覧 -->\n  <section style=\"padding: 32px 24px 104px\">\n    <div style=\"max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px\">\n      <div style=\"display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between\">\n        <span style=\"font-size: 18px; font-weight: 700\">{{ countLabel }}</span>\n        <sc-if value=\"{{ filtered }}\" hint-placeholder-val=\"{{ false }}\"><button onClick=\"{{ reset }}\" style=\"font-family: inherit; font-size: 14px; font-weight: 700; color: #2F4A3C; background: transparent; border: none; text-decoration: underline; min-height: 40px\">条件をクリア</button></sc-if>\n      </div>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 28px 24px\">\n        <sc-for list=\"{{ cards }}\" as=\"c\" hint-placeholder-count=\"10\">\n          <article style=\"background: #FFFDF8; border: 1px solid #D8CFBD; display: flex; flex-direction: column\">\n            <div class=\"tk-img\" style=\"position: relative; height
