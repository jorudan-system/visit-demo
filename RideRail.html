<style>
body{margin:0;background:#F5F1E8}
a{color:#2F4A3C}a:hover{color:#1E3328}
.sp-only{display:none !important}
.hide{display:none !important}
.scroller{scrollbar-width:thin}
details.menu>summary{list-style:none;cursor:pointer}
details.menu>summary::-webkit-details-marker{display:none}
.spots{display:flex;gap:24px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:12px}
.spots>*{flex:0 0 320px;scroll-snap-align:start}
.route-inner .route-card{flex:1 1 0 !important;min-width:0}
@media (max-width:767px){
.pc-only{display:none !important}.sp-only{display:flex !important}.sp-hide{display:none !important}
.spots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;overflow:visible}
.spots>*{flex:none}
.route-inner{width:max-content !important;max-width:none !important}
.route-inner .route-card{flex:0 0 168px !important}
.fare-grid{min-width:0 !important}
.pf-row{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
.pf-row>span:first-child{grid-column:1 / -1}
.pf-row>span:last-child{grid-column:1 / -1}
.tr-wrap{grid-template-columns:1fr !important}
.tr-row{grid-template-columns:1fr !important}
.tr-row>div:has(> span[style*="height: 2px"]){justify-content:center}
.fare-grid>div{padding:10px 3px !important;font-size:12px !important;word-break:keep-all;overflow-wrap:anywhere}
.tt-grid{padding-left:10px !important;padding-right:10px !important;gap:6px !important}
.tt-grid>span{font-size:11px}
}

html{scroll-behavior:smooth}
body{overflow-wrap:break-word}
h1,h2,h3,button,a,span,p,li,td,th{overflow-wrap:anywhere;word-break:normal}
details.lang>summary::-webkit-details-marker{display:none}
.hero-slides{position:relative;overflow:hidden}
.hero-slides>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;animation:heroFade 15s infinite}
.hero-slides>img:nth-of-type(1){position:relative;opacity:1;animation:none}
.hero-slides>img:nth-of-type(2){animation-delay:5s}
.hero-slides>img:nth-of-type(3){animation-delay:10s}
@keyframes heroFade{0%{opacity:0}4%{opacity:1}33%{opacity:1}37%{opacity:0}100%{opacity:0}}
.hero-dots{position:absolute;right:20px;bottom:16px;display:flex;gap:6px;z-index:2}
.hero-dots>span{width:22px;height:4px;background:rgba(255,255,255,0.5);animation:heroDot 15s infinite}
.hero-dots>span:nth-child(2){animation-delay:5s}.hero-dots>span:nth-child(3){animation-delay:10s}
@keyframes heroDot{0%{background:#FFFFFF}33%{background:#FFFFFF}34%{background:rgba(255,255,255,0.5)}100%{background:rgba(255,255,255,0.5)}}
@media (prefers-reduced-motion: reduce){.hero-slides>img{animation:none}.hero-slides>img:nth-of-type(1){opacity:1}}
</style>

r; justify-content: center; gap: 5px; box-sizing: border-box\">\n          <span style=\"width: 20px; height: 2px; background: #2B2B2B\"></span><span style=\"width: 20px; height: 2px; background: #2B2B2B\"></span><span style=\"width: 20px; height: 2px; background: #2B2B2B\"></span>\n        </summary>\n        <nav aria-label=\"メインメニュー\" style=\"position: absolute; left: 0; right: 0; top: 100%; z-index: 10; background: #F5F1E8; border-bottom: 1px solid #D8CFBD; padding: 8px 20px 20px; display: flex; flex-direction: column; font-size: 16px; font-weight: 500; box-shadow: 0 12px 24px rgba(60,45,20,0.12)\"><a href=\"Tateyama.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">エリア<span aria-hidden=\"true\">›</span></a><a href=\"Courses.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">モデルコース<span aria-hidden=\"true\">›</span></a><a href=\"Tickets.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">お得なチケット<span aria-hidden=\"true\">›</span></a><a href=\"RideRail.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">乗り方・きっぷ購入<span aria-hidden=\"true\">›</span></a><a href=\"Feature.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">特集<span aria-hidden=\"true\">›</span></a><a href=\"Access.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">アクセス<span aria-hidden=\"true\">›</span></a><a href=\"FAQ.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">よくある質問<span aria-hidden=\"true\">›</span></a></nav>\n      </details>\n    </div>\n  </header>\n\n  <!-- ページ見出し -->\n  <section style=\"background: #2F4A3C; color: #F5F1E8; padding: 64px 24px 56px\">\n    <div style=\"max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px\">\n      <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 20px; letter-spacing: 0.3em; color: #D9C9A6\">HOW TO RIDE &amp; BUY TICKETS</span>\n      <h1 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: clamp(28px, 3.6vw, 44px); letter-spacing: 0.06em\">乗り方・きっぷ購入</h1>\n      <p style=\"margin: 0; font-size: 16px; line-height: 1.9; color: #E2DACA; max-width: 760px\">きっぷの買い方と受け取り方、電車の乗り方、路線図や駅の構内図をまとめています。はじめての方も安心して地鉄の旅をお楽しみください。</p>\n    </div>\n  </section>\n  <div style=\"border-bottom: 1px solid #D8CFBD\"><div style=\"max-width: 1280px; margin: 0 auto; padding: 0 24px; display: flex; gap: 8px\">\n    <a href=\"RideRail.html\" style=\"text-decoration: none; padding: 16px 22px; white-space: nowrap; color: #2B2B2B; font-weight: 700; border-bottom: 3px solid #B5523B\">鉄道線</a>\n    <a href=\"RideTram.html\" style=\"text-decoration: none; padding: 16px 22px; white-space: nowrap; color: #4A4438\">市内電車</a>\n  </div></div>\n  <nav aria-label=\"このページの内容\" style=\"padding: 20px 24px 0\"><div style=\"max-width: 1280px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px\">\n    <a href=\"#buy\" style=\"text-decoration: none; font-size: 13px; color: #2F4A3C; border: 1px solid #B7AC97; background: #FFFDF8; padding: 8px 14px\">きっぷの購入</a><a href=\"#receive\" style=\"text-decoration: none; font-size: 13px; color: #2F4A3C; border: 1px solid #B7AC97; background: #FFFDF8; padding: 8px 14px\">WEBきっぷの受け取り</a><a href=\"#ride\" style=\"text-decoration: none; font-size: 13px; color: #2F4A3C; border: 1px solid #B7AC97; background: #FFFDF8; padding: 8px 14px\">電車の乗り方</a><a href=\"#map\" style=\"text-decoration: none; font-size: 13px; color: #2F4A3C; border: 1px solid #B7AC97; background: #FFFDF8; padding: 8px 14px\">路線図</a><a href=\"#transfer\" style=\"text-decoration: none; font-size: 13px; color: #2F4A3C; border: 1px solid #B7AC97; background: #FFFDF8; padding: 8px 14px\">乗換案内</a><a href=\"#area\" style=\"text-decoration: none; font-size: 13px; color: #2F4A3C; border: 1px solid #B7AC97; background: #FFFDF8; padding: 8px 14px\">富山駅周辺図</a><a href=\"#station\" style=\"text-decoration: none; font-size: 13px; color: #2F4A3C; border: 1px solid #B7AC97; background: #FFFDF8; padding: 8px 14px\">駅の構内図</a>\n  </div></nav>\n  <!-- きっぷの購入場所 -->\n  <section id=\"buy\" style=\"padding: 72px 24px 0\">\n    <div style=\"max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px\">\n      <div style=\"display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; justify-content: space-between\">\n        <div style=\"display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline\">\n          <h2 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: 28px\">きっぷの購入場所</h2>\n          <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 18px; letter-spacing: 0.2em; color: #8A4A35\">WHERE TO BUY</span>\n        </div>\n      </div>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px\">\n        <div style=\"background: #FFFDF8; border: 1px solid #D8CFBD; border-top: 4px solid #2F4A3C; padding: 24px; display: flex; flex-direction: column; gap: 14px; min-width: 0\">\n          <span style=\"align-self: flex-start; font-size: 12px; font-weight: 700; color: #FFFFFF; background: #2F4A3C; padding: 3px 10px\">立山黒部アルペンルートへ行く</span>\n          <span style=\"font-family: 'Noto Serif JP', serif; font-size: 22px; font-weight: 700; line-height: 1.5\">アルペンルートのきっぷ</span>\n          <div style=\"display: flex; flex-direction: column; gap: 4px; border-top: 1px solid #EFE8D8; padding-top: 12px\"><span style=\"font-size: 16px; font-weight: 700\">駅の窓口</span><span style=\"font-size: 14px; line-height: 1.8; color: #4A4438\">電鉄富山駅・立山駅のアルペンルートきっぷ売り場で購入できます。</span></div><div style=\"display: flex; flex-direction: column; gap: 4px; border-top: 1px solid #EFE8D8; padding-top: 12px\"><span style=\"font-size: 16px; font-weight: 700\">WEBきっぷ（事前予約）</span><span style=\"font-size: 14px; line-height: 1.8; color: #4A4438\">乗車日・時間を指定して事前に予約できます。混雑する時期は事前の予約がおすすめです。購入したきっぷは駅の自動受取機で受け取ります。</span></div><a href=\"https://www.alpen-route.com/webticket/\" style=\"align-self: flex-start; text-decoration: none; font-size: 15px; font-weight: 700; color: #FFFFFF; background: #2F4A3C; padding: 14px 20px; margin-top: 4px\">WEBきっぷの購入はこちら ↗</a>\n        </div>\n        <div style=\"background: #FFFDF8; border: 1px solid #D8CFBD; border-top: 4px solid #6F8FA8; padding: 24px; display: flex; flex-direction: column; gap: 14px; min-width: 0\">\n          <span style=\"align-self: flex-start; font-size: 12px; font-weight: 700; color: #FFFFFF; background: #6F8FA8; padding: 3px 10px\">宇奈月温泉・上市・魚津などへ</span>\n          <span style=\"font-family: 'Noto Serif JP', serif; font-size: 22px; font-weight: 700; line-height: 1.5\">地鉄線のふつうのきっぷ</span>\n          <div style=\"display: flex; flex-direction: column; gap: 4px; border-top: 1px solid #EFE8D8; padding-top: 12px\"><span style=\"font-size: 16px; font-weight: 700\">駅の窓口</span><span style=\"font-size: 14px; line-height: 1.8; color: #4A4438\">駅員のいる駅の窓口で購入できます。</span></div><div style=\"display: flex; flex-direction: column; gap: 4px; border-top: 1px solid #EFE8D8; padding-top: 12px\"><span style=\"font-size: 16px; font-weight: 700\">券売機</span><span style=\"font-size: 14px; line-height: 1.8; color: #4A4438\">駅員のいる駅の券売機で購入できます。</span></div><div style=\"display: flex; flex-direction: column; gap: 4px; border-top: 1px solid #EFE8D8; padding-top: 12px\"><span style=\"font-size: 16px; font-weight: 700\">駅員のいない駅から乗るとき</span><span style=\"font-size: 14px; line-height: 1.8; color: #4A4438\">駅ではきっぷを買えません。車内で整理券を取り、降りるときに運賃を支払います（下の「電車の乗り方」をご覧ください）。</span></div>\n        </div>\n      </div>\n    </div>\n  </section>\n  <!-- WEBきっぷの受け取り -->\n  <section id=\"receive\" style=\"padding: 72px 24px 0\">\n    <div style=\"max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px\">\n      <div style=\"display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; justify-content: space-between\">\n        <div style=\"display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline\">\n          <h2 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: 28px\">WEBきっぷの受け取り</h2>\n          <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 18px; letter-spacing: 0.2em; color: #8A4A35\">TICKET PICKUP</span>\n        </div>\n      </div>\n      <p style=\"margin: 0; font-size: 15px; line-height: 1.8; color: #4A4438\">WEBで購入したアルペンルートのきっぷは、次の駅の自動受取機で受け取れます。ご利用日の前日正午から受け取り可能です。</p>\n      <div style=\"background: #FFFDF8; border: 1px solid #D8CFBD\">\n        <div class=\"pc-only\" style=\"display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) minmax(0, 1.6fr); gap: 12px; padding: 12px 20px; font-size: 13px; color: #5E5648; background: #E6DECC\"><span>受け取り場所</span><span>自動受取機の利用時間</span><span>補足</span></div>\n        <div class=\"pf-row\" style=\"display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) minmax(0, 1.6fr); gap: 6px 12px; padding: 16px 20px; border-top: 1px solid #EFE8D8; align-items: center\"><span style=\"font-size: 16px; font-weight: 700\">電鉄富山駅</span><span style=\"font-size: 16px; font-weight: 700; color: #2F4A3C; font-variant-numeric: tabular-nums\">5:00 〜 23:00</span><span style=\"font-size: 13px; color: #4A4438; line-height: 1.7\"></span></div><div class=\"pf-row\" style=\"display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) minmax(0, 1.6fr); gap: 6px 12px; padding: 16p
