body{margin:0;background:#F5F1E8}

<script>window.__DC_TPL="\n\n<div style=\"font-family: 'Noto Sans JP', sans-serif; color: #2B2B2B; background: #F5F1E8; min-height: 100vh\">\n\n  <!-- 災害・運行情報テロップ -->\n  <sc-if value=\"{{ normal }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"background: #E3ECE4; border-bottom: 1px solid #B9CDBD; font-size: 14px\">\n      <div style=\"max-width: 1280px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 10px 16px; align-items: center\">\n        <span style=\"background: #2B2B2B; color: #FFFFFF; font-weight: 700; font-size: 12px; padding: 4px 10px; border-radius: 2px; white-space: nowrap\">災害・運行情報</span>\n        <span style=\"display: flex; align-items: center; gap: 6px; font-weight: 700; color: #2F4A3C; white-space: nowrap\"><span style=\"width: 10px; height: 10px; border-radius: 50%; background: #3E7A55\"></span>平常運行</span>\n        <span class=\"pc-only\" style=\"font-size: 12px; color: #5E5648; white-space: nowrap\">○時○分 更新</span>\n        <a href=\"Service.html\" style=\"margin-left: auto; font-size: 13px; font-weight: 700; white-space: nowrap\">詳しく見る →</a>\n      </div>\n    </div>\n  </sc-if>\n  <sc-if value=\"{{ alert }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"background: #8A3B26; color: #FFFFFF; font-size: 14px\">\n      <div style=\"max-width: 1280px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 10px 16px; align-items: center\">\n        <span style=\"background: #FFFFFF; color: #8A3B26; font-weight: 700; font-size: 12px; padding: 4px 10px; border-radius: 2px; white-space: nowrap\">災害・運行情報</span>\n        <span style=\"display: flex; align-items: center; gap: 6px; font-weight: 700; white-space: nowrap\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\"><path d=\"M12 3 2 21h20L12 3z\"></path><path d=\"M12 10v5M12 18v.5\"></path></svg>遅れ・運休あり</span>\n        <span class=\"pc-only\" style=\"font-size: 12px; white-space: nowrap\">○時○分 更新</span>\n        <a href=\"Service.html\" style=\"margin-left: auto; font-size: 13px; font-weight: 700; color: #FFFFFF; white-space: nowrap\">詳しく見る →</a>\n      </div>\n    </div>\n  </sc-if>\n\n  <!-- ヘッダー -->\n  <header style=\"border-bottom: 1px solid #D8CFBD; background: #F5F1E8; position: relative\">\n    <div style=\"max-width: 1280px; margin: 0 auto; padding: 14px 16px; display: flex; gap: 12px 32px; align-items: center\">\n      <a href=\"Main.html\" style=\"flex: 1 1 auto; text-decoration: none; color: #2B2B2B; display: flex; flex-direction: column; gap: 2px; min-width: 0\">\n        <span style=\"font-family: 'Cormorant Garamond', serif; font-size: clamp(16px, 2vw, 28px); font-weight: 600; letter-spacing: 0.1em; white-space: nowrap\">TOYAMA LOCAL TRACKS</span>\n        <span style=\"font-size: 11px; letter-spacing: 0.2em; color: #5E5648\">富山地方鉄道 観光ガイド</span>\n      </a>\n      <nav class=\"pc-only\" aria-label=\"メインメニュー\" style=\"display: flex; flex-wrap: wrap; gap: 4px 20px; font-size: 14px; font-weight: 500\"><a href=\"Tateyama.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 0\">エリア</a><a href=\"Courses.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 0\">モデルコース</a><a href=\"Tickets.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 0\">お得なチケット</a><a href=\"RideRail.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 0; border-bottom: 2px solid #2B2B2B\">乗り方・きっぷ購入</a><a href=\"Feature.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 0\">特集</a><a href=\"Access.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 0\">アクセス</a><a href=\"FAQ.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 0\">よくある質問</a><a href=\"Terms.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 10px 0\">利用規約</a></nav>\n      <button aria-label=\"言語を選択\" style=\"flex: 0 0 auto; font-family: inherit; font-size: 13px; background: transparent; border: 1px solid #8C8270; border-radius: 2px; padding: 0 12px; color: #2B2B2B; display: flex; gap: 6px; align-items: center; justify-content: center; min-height: 44px; min-width: 44px; box-sizing: border-box\">\n        <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18\"></path></svg>\n        <span class=\"pc-only\">日本語</span>\n      </button>\n      <details class=\"menu sp-only\" style=\"flex: 0 0 auto\">\n        <summary aria-label=\"メニューを開く\" style=\"width: 44px; height: 44px; border: 1px solid #2B2B2B; border-radius: 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; box-sizing: border-box\">\n          <span style=\"width: 20px; height: 2px; background: #2B2B2B\"></span><span style=\"width: 20px; height: 2px; background: #2B2B2B\"></span><span style=\"width: 20px; height: 2px; background: #2B2B2B\"></span>\n        </summary>\n        <nav aria-label=\"メインメニュー\" style=\"position: absolute; left: 0; right: 0; top: 100%; z-index: 10; background: #F5F1E8; border-bottom: 1px solid #D8CFBD; padding: 8px 20px 20px; display: flex; flex-direction: column; font-size: 16px; font-weight: 500; box-shadow: 0 12px 24px rgba(60,45,20,0.12)\"><a href=\"Tateyama.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">エリア<span aria-hidden=\"true\">›</span></a><a href=\"Courses.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">モデルコース<span aria-hidden=\"true\">›</span></a><a href=\"Tickets.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">お得なチケット<span aria-hidden=\"true\">›</span></a><a href=\"RideRail.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">乗り方・きっぷ購入<span aria-hidden=\"true\">›</span></a><a href=\"Feature.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">特集<span aria-hidden=\"true\">›</span></a><a href=\"Access.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">アクセス<span aria-hidden=\"true\">›</span></a><a href=\"FAQ.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">よくある質問<span aria-hidden=\"true\">›</span></a><a href=\"Terms.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">利用規約<span aria-hidden=\"true\">›</span></a></nav>\n      </details>\n    </div>\n  </header>\n\n  <!-- ページ見出し -->\n  <section style=\"background: #2F4A3C; color: #F5F1E8; padding: 64px 24px 56px\">\n    <div style=\"max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px\">\n      <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 20px; letter-spacing: 0.3em; color: #D9C9A6\">HOW TO RIDE &amp; BUY TICKETS</span>\n      <h1 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: clamp(28px, 3.6vw, 44px); letter-spacing: 0.06em\">乗り方・きっぷ購入</h1>\n      <p style=\"margin: 0; font-size: 16px; line-height: 1.9; color: #E2DACA; max-width: 760px\">きっぷの買い方と受け取り方、電車の乗り方、路線図や駅の構内図をまとめています。はじめての方も安心して地鉄の旅をお楽しみください。</p>\n    </div>\n  </section>\n  <div style=\"border-bottom: 1px solid #D8CFBD\"><div style=\"max-width: 1280px; margin: 0 auto; padding: 0 24px; display: flex; gap: 8px\">\n    <a href=\"RideRail.html\" style=\"text-decoration: none; padding: 16px 22px; white-space: nowrap; color: #2B2B2B; font-weight: 700; border-bottom: 3px solid #B5523B\">鉄道線</a>\n    <a href=\"RideTram.html\" style=\"text-decoration: none; padding: 16px 22px; white-space: nowrap; color: #4A4438\">市内電車</a>\n  </div></div>\n  <nav aria-label=\"このページの内容\" style=\"padding: 20px 24px 0\"><div style=\"max-width: 1280px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px\">\n    <a href=\"#buy\" style=\"text-decoration: none; font-size: 13px; color: #2F4A3C; border: 1px solid #B7AC97; background: #FFFDF8; padding: 8px 14px\">きっぷの購入</a><a href=\"#receive\" style=\"text-decoration: none; font-size: 13px; color: #2F4A3C; border: 1px solid #B7AC97; background: #FFFDF8; padding: 8px 14px\">WEBきっぷの受け取り</a><a href=\"#ride\" style=\"text-decoration: none; font-size: 13px; color: #2F4A3C; border: 1px solid #B7AC97; background: #FFFDF8; padding: 8px 14px\">電車の乗り方</a><a href=\"#map\" style=\"text-decoration: none; font-size: 13px; color: #2F4A3C; border: 1px solid #B7AC97; background: #FFFDF8; padding: 8px 14px\">路線図</a><a href=\"#transfer\" style=\"text-decoration: none; font-size: 13px; color: #2F4A3C; border: 1px solid #B7AC97; background: #FFFDF8; padding: 8px 14px\">乗換案内</a><a href=\"#area\" style=\"text-decoration: none; font-size: 13px; color: #2F4A3C; border: 1px solid #B7AC97; background: #FFFDF8; padding: 8px 14px\">富山駅周辺図</a><a href=\"#station\" style=\"text-decoration: none; font-size: 13px; color: #2F4A3C; border: 1px solid #B7AC97; background: #FFFDF8; padding: 8px 14px\">駅の構内図</a>\n  </div></nav>\n  <!-- きっぷの購入場所 -->\n  <section id=\"buy\" style=\"padding: 72px 24px 0\">\n    <div style=\"max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px\">\n      <div style=\"display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; justify-content: space-between\">\n        <div style=\"display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline\">\n          <h2 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: 28px\">きっぷの購入場所</h2>\n          <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 18px; letter-spacing: 0.2em; color: #8A4A35\">WHERE TO BUY</span>\n        </div>\n      </div>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px\">\n        <div style=\"background: #FFFDF8; border: 1px solid #D8CFBD; border-top: 4px solid #2F4A3C; padding: 24px; display: flex; flex-direction: column; gap: 14px; min-width: 0\">\n          <span style=\"align-self: flex-start; font-size: 12px; font-weight: 700; color: #FFFFFF; background: #2F4A3C; padding: 3px 10px\">立山黒部アルペンルートへ行く</span>\n          <span style=\"font-family: 'Noto Serif JP', serif; font-size: 22px; font-weight: 700; line-height: 1.5\">アルペンルートのきっぷ</span>\n          <div style=\"display: flex; flex-direction: column; gap: 4px; border-top: 1px solid #EFE8D8; padding-top: 12px\"><span style=\"font-size: 16px; font-weight: 700\">駅の窓口</span><span style=\"font-size: 14px; line-height: 1.8; color: #4A4438\">電鉄富山駅・立山駅のアルペンルートきっぷ売り場で購入できます。</span></div><div style=\"display: flex; flex-direction: column; gap: 4px; border-top: 1px solid #EFE8D8; padding-top: 12px\"><span style=\"font-size: 16px; font-weight: 700\">WEBきっぷ（事前予約）</span><span style=\"font-size: 14px; line-height: 1.8; color: #4A4438\">乗車日・時間を指定して事前に予約できます。混雑する時期は事前の予約がおすすめです。購入したきっぷは駅の自動受取機で受け取ります。</span></div><a href=\"https://www.alpen-route.com/webticket/\" style=\"align-self: flex-start; text-decoration: none; font-size: 15px; font-weight: 700; color: #FFFFFF; background: #2F4A3C; padding: 14px 20px; margin-top: 4px\">WEBきっぷの購入はこちら ↗</a>\n        </div>\n        <div style=\"background: #FFFDF8; border: 1px solid #D8CFBD; border-top: 4px solid #6F8FA8; padding: 24px; display: flex; flex-direction: column; gap: 14px; min-width: 0\">\n          <span style=\"align-self: flex-start; font-size: 12px; font-weight: 700; color: #FFFFFF; background: #6F8FA8; padding: 3px 10px\">宇奈月温泉・上市・魚津などへ</span>\n          <span style=\"font-family: 'Noto Serif JP', serif; font-size: 22px; font-weight: 700; line-height: 1.5\">地鉄線のふつうのきっぷ</span>\n          <div style=\"display: flex; flex-direction: column; gap: 4px; border-top: 1px solid #EFE8D8; padding-top: 12px\"><span style=\"font-size: 16px; font-weight: 700\">駅の窓口</span><span style=\"font-size: 14px; line-height: 1.8; color: #4A4438\">駅員のいる駅の窓口で購入できます。</span></div><div style=\"display: flex; flex-direction: column; gap: 4px; border-top: 1px solid #EFE8D8; padding-top: 12px\"><span style=\"font-size: 16px; font-weight: 700\">券売機</span><span style=\"font-size: 14px; line-height: 1.8; color: #4A4438\">駅員のいる駅の券売機で購入できます。</span></div><div style=\"display: flex; flex-direction: column; gap: 4px; border-top: 1px solid #EFE8D8; padding-top: 12px\"><span style=\"font-size: 16px; font-weight: 700\">駅員のいない駅から乗るとき</span><span style=\"font-size: 14px; line-height: 1.8; color: #4A4438\">駅ではきっぷを買えません。車内で整理券を取り、降りるときに運賃を支払います（下の「電車の乗り方」をご覧ください）。</span></div>\n        </div>\n      </div>\n    </div>\n  </section>\n  <!-- WEBきっぷの受け取り -->\n  <section id=\"receive\" style=\"padding: 72px 24px 0\">\n    <div style=\"max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px\">\n      <div style=\"display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; justify-content: space-between\">\n        <div style=\"display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline\">\n          <h2 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: 28px\">WEBきっぷの受け取り</h2>\n          <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 18px; letter-spacing: 0.2em; color: #8A4A35\">TICKET PICKUP</span>\n        </div>\n      </div>\n      <p style=\"margin: 0; font-size: 15px; line-height: 1.8; color: #4A4438\">WEBで購入したアルペンルートのきっぷは、次の駅の自動受取機で受け取れます。ご利用日の前日正午から受け取り可能です。</p>\n      <div style=\"background: #FFFDF8; border: 1px solid #D8CFBD\">\n        <div class=\"pc-only\" style=\"display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) minmax(0, 1.6fr); gap: 12px; padding: 12px 20px; font-size: 13px; color: #5E5648; background: #E6DECC\"><span>受け取り場所</span><span>自動受取機の利用時間</span><span>補足</span></div>\n        <div class=\"pf-row\" style=\"display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) minmax(0, 1.6fr); gap: 6px 12px; padding: 16px 20px; border-top: 1px solid #EFE8D8; align-items: center\"><span style=\"font-size: 16px; font-weight: 700\">電鉄富山駅</span><span style=\"font-size: 16px; font-weight: 700; color: #2F4A3C; font-variant-numeric: tabular-nums\">午前5時00分 〜 午後11時00分</span><span style=\"font-size: 13px; color: #4A4438; line-height: 1.7\"></span></div><div class=\"pf-row\" style=\"display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) minmax(0, 1.6fr); gap: 6px 12px; padding: 16px 20px; border-top: 1px solid #EFE8D8; align-items: center\"><span style=\"font-size: 16px; font-weight: 700\">立山駅</span><span style=\"font-size: 16px; font-weight: 700; color: #2F4A3C; font-variant-numeric: tabular-nums\">始発便の60分前 〜 午後5時00分</span><span style=\"font-size: 13px; color: #4A4438; line-height: 1.7\"></span></div><div class=\"pf-row\" style=\"display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) minmax(0, 1.6fr); gap: 6px 12px; padding: 16px 20px; border-top: 1px solid #EFE8D8; align-items: center\"><span style=\"font-size: 16px; font-weight: 700\">扇沢駅</span><span style=\"font-size: 16px; font-weight: 700; color: #2F4A3C; font-variant-numeric: tabular-nums\">始発便の50分前 〜 午後2時30分</span><span style=\"font-size: 13px; color: #4A4438; line-height: 1.7\">午後2時30分〜午後5時00分は、きっぷ売り場で対応</span></div>\n      </div>\n      <div style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #4A4438; line-height: 1.8\">\n        <span>※ 扇沢駅は、11月上旬からの冬期ダイヤ実施日以降、始発便の30分前〜午後2時30分（午後2時30分〜午後4時00分はきっぷ売り場で対応）となります。</span>\n        <span>※ 受け取り時間は変更になる場合があります。最新の情報は立山黒部アルペンルート公式サイトでご確認ください。</span>\n      </div>\n      <a href=\"https://www.alpen-route.com/_wp/webticket_receiving\" style=\"align-self: flex-start; font-size: 15px; font-weight: 700\">WEBきっぷの受け取りについて（立山黒部アルペンルート公式サイト）↗</a>\n    </div>\n  </section>\n  <!-- 電車の乗り方 -->\n  <section id=\"ride\" style=\"padding: 72px 24px 0\">\n    <div style=\"max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px\">\n      <div style=\"display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; justify-content: space-between\">\n        <div style=\"display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline\">\n          <h2 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: 28px\">電車の乗り方</h2>\n          <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 18px; letter-spacing: 0.2em; color: #8A4A35\">HOW TO RIDE</span>\n        </div>\n      </div>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px\">\n        <div style=\"background: #FFFDF8; border: 1px solid #D8CFBD; border-top: 4px solid #2F4A3C; padding: 24px; display: flex; flex-direction: column; gap: 14px; min-width: 0\">\n          <span style=\"align-self: flex-start; font-size: 12px; font-weight: 700; color: #FFFFFF; background: #2F4A3C; padding: 3px 10px\">駅員のいる駅</span>\n          <span style=\"font-family: 'Noto Serif JP', serif; font-size: 22px; font-weight: 700; line-height: 1.5\">改札を通って乗る</span>\n          <ol style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px\"><li style=\"display: flex; gap: 12px; align-items: flex-start\">\n            <span style=\"flex: 0 0 28px; height: 28px; border-radius: 50%; background: #2F4A3C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px\">1</span>\n            <span style=\"font-size: 15px; line-height: 1.8\">駅の窓口または券売機できっぷを購入</span>\n          </li><li style=\"display: flex; gap: 12px; align-items: flex-start\">\n            <span style=\"flex: 0 0 28px; height: 28px; border-radius: 50%; background: #2F4A3C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px\">2</span>\n            <span style=\"font-size: 15px; line-height: 1.8\">改札できっぷを見せてホームへ（どのドアからでも乗れます）</span>\n          </li><li style=\"display: flex; gap: 12px; align-items: flex-start\">\n            <span style=\"flex: 0 0 28px; height: 28px; border-radius: 50%; background: #2F4A3C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px\">3</span>\n            <span style=\"font-size: 15px; line-height: 1.8\">降りる駅では、改札できっぷを渡す</span>\n          </li></ol>\n        </div>\n        <div style=\"background: #FFFDF8; border: 1px solid #D8CFBD; border-top: 4px solid #B5523B; padding: 24px; display: flex; flex-direction: column; gap: 14px; min-width: 0\">\n          <span style=\"align-self: flex-start; font-size: 12px; font-weight: 700; color: #FFFFFF; background: #B5523B; padding: 3px 10px\">駅員のいない駅</span>\n          <span style=\"font-family: 'Noto Serif JP', serif; font-size: 22px; font-weight: 700; line-height: 1.5\">後ろから乗って、前から降りる</span>\n          <ol style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px\"><li style=\"display: flex; gap: 12px; align-items: flex-start\">\n            <span style=\"flex: 0 0 28px; height: 28px; border-radius: 50%; background: #2F4A3C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px\">1</span>\n            <span style=\"font-size: 15px; line-height: 1.8\">駅ではきっぷを買えません。そのままホームへ</span>\n          </li><li style=\"display: flex; gap: 12px; align-items: flex-start\">\n            <span style=\"flex: 0 0 28px; height: 28px; border-radius: 50%; background: #2F4A3C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px\">2</span>\n            <span style=\"font-size: 15px; line-height: 1.8\">1両目の後ろのドアから乗り、整理券を取る</span>\n          </li><li style=\"display: flex; gap: 12px; align-items: flex-start\">\n            <span style=\"flex: 0 0 28px; height: 28px; border-radius: 50%; background: #2F4A3C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px\">3</span>\n            <span style=\"font-size: 15px; line-height: 1.8\">降りる駅が近づいたら、車内前方の運賃表示器で運賃を確認</span>\n          </li><li style=\"display: flex; gap: 12px; align-items: flex-start\">\n            <span style=\"flex: 0 0 28px; height: 28px; border-radius: 50%; background: #2F4A3C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px\">4</span>\n            <span style=\"font-size: 15px; line-height: 1.8\">1両目の前のドアで、整理券と運賃を運賃箱へ（おつりは出ません。両替は千円札まで）</span>\n          </li></ol>\n        </div>\n      </div>\n      <span style=\"font-size: 13px; color: #4A4438; line-height: 1.8\">※ フリーきっぷの場合は、降りるときに日付部分を運転士・駅員に見せてください。</span>\n      <a href=\"https://www.chitetsu.co.jp/?page_id=25282\" style=\"align-self: flex-start; font-size: 15px; font-weight: 700\">くわしい乗り方（富山地方鉄道）↗</a>\n    </div>\n  </section>\n  <!-- 路線図 -->\n  <section id=\"map\" style=\"padding: 72px 24px 0\">\n    <div style=\"max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px\">\n      <div style=\"display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; justify-content: space-between\">\n        <div style=\"display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline\">\n          <h2 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: 28px\">路線図</h2>\n          <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 18px; letter-spacing: 0.2em; color: #8A4A35\">ROUTE MAP</span>\n        </div><button class=\"sp-only\" onClick=\"{{ z_line }}\" style=\"font-family: inherit; font-size: 14px; font-weight: 700; color: #2F4A3C; background: #FFFFFF; border: 1px solid #2F4A3C; padding: 0 16px; min-height: 44px; display: flex; gap: 6px; align-items: center\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"7\"></circle><path d=\"M16 16l5 5M11 8v6M8 11h6\"></path></svg>拡大して見る</button>\n      </div>\n      <div style=\"background: #FFFDF8; border: 1px solid #D8CFBD; padding: 12px\"><img class=\"pc-only\" src=\"img/railways-linemap_jp.gif\" alt=\"富山地方鉄道 鉄道線の路線図\" style=\"display: block; width: 100%; height: auto\"><button class=\"sp-only\" onClick=\"{{ z_line }}\" aria-label=\"富山地方鉄道 鉄道線の路線図を拡大\" style=\"width: 100%; padding: 0; border: none; background: #FFFFFF\"><img src=\"img/railways-linemap_jp.gif\" alt=\"富山地方鉄道 鉄道線の路線図\" style=\"display: block; width: 100%; height: auto\"></button></div>\n      <span class=\"sp-only\" style=\"font-size: 13px; color: #4A4438\">図を押すと拡大して表示します。</span>\n    </div>\n  </section>\n  <!-- 乗換案内 -->\n  <section id=\"transfer\" style=\"padding: 72px 24px 0\">\n    <div style=\"max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px\">\n      <div style=\"display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; justify-content: space-between\">\n        <div style=\"display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline\">\n          <h2 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: 28px\">乗換案内</h2>\n          <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 18px; letter-spacing: 0.2em; color: #8A4A35\">TRANSFERS</span>\n        </div>\n      </div>\n      <p style=\"margin: 0; font-size: 15px; line-height: 1.8; color: #4A4438\">新幹線・JR・市内電車・空港から電鉄富山駅へ。電鉄富山駅から立山線・本線に乗り換えて、各エリアへ向かいます。</p>\n      <div class=\"sp-only\" style=\"flex-direction: column; gap: 8px\">\n        <div style=\"background: #FFFDF8; border: 1px solid #D8CFBD; padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; justify-content: space-between\"><span style=\"display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 15px; font-weight: 700\">北陸新幹線</span><span style=\"font-size: 12px; color: #5E5648\">JR富山駅</span></span><span style=\"font-size: 12px; font-weight: 700; color: #2F4A3C; border: 1px solid #9FB3AE; background: #F5F1E8; padding: 2px 8px; white-space: nowrap\">徒歩約15分</span></div><div style=\"background: #FFFDF8; border: 1px solid #D8CFBD; padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; justify-content: space-between\"><span style=\"display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 15px; font-weight: 700\">あいの風とやま鉄道</span><span style=\"font-size: 12px; color: #5E5648\">富山駅</span></span><span style=\"font-size: 12px; font-weight: 700; color: #2F4A3C; border: 1px solid #9FB3AE; background: #F5F1E8; padding: 2px 8px; white-space: nowrap\">徒歩約15分</span></div><div style=\"background: #FFFDF8; border: 1px solid #D8CFBD; padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; justify-content: space-between\"><span style=\"display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 15px; font-weight: 700\">市内電車</span><span style=\"font-size: 12px; color: #5E5648\">富山駅</span></span><span style=\"font-size: 12px; font-weight: 700; color: #2F4A3C; border: 1px solid #9FB3AE; background: #F5F1E8; padding: 2px 8px; white-space: nowrap\">徒歩約15分</span></div><div style=\"background: #FFFDF8; border: 1px solid #D8CFBD; padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; justify-content: space-between\"><span style=\"display: flex; flex-direction: column; gap: 2px\"><span style
