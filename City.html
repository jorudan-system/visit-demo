<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Noto+Serif+JP:wght@500;700&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F1E8}
a{color:#2F4A3C}a:hover{color:#1E3328}
.sp-only{display:none !important}
.hide{display:none !important}
.scroller{scrollbar-width:thin}
details.menu>summary{list-style:none;cursor:pointer}
details.menu>summary::-webkit-details-marker{display:none}
.spots{display:flex;gap:24px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:12px}
.spots>*{flex:0 0 320px;scroll-snap-align:start}
.route-inner .route-card{flex:1 1 0 !important;min-width:0}
@media (max-width:767px){
.pc-only{display:none !important}.sp-only{display:flex !important}.sp-hide{display:none !important}
.spots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;overflow:visible}
.spots>*{flex:none}
.route-inner{width:max-content !important;max-width:none !important}
.route-inner .route-card{flex:0 0 168px !important}
.fare-grid{min-width:0 !important}
.pf-row{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
.pf-row>span:first-child{grid-column:1 / -1}
.map-wrap{display:none}
.map-wrap.open{display:block;position:fixed;inset:0;z-index:60;background:#F5F1E8;overflow:auto}
.map-wrap.open .tram-map{min-width:760px !important}
.fare-grid>div{padding:10px 3px !important;font-size:12px !important;word-break:keep-all;overflow-wrap:anywhere}
.tt-grid{padding-left:10px !important;padding-right:10px !important;gap:6px !important}
.tt-grid>span{font-size:11px}
}
@media (max-width:767px){
.sptabs>[data-sec]{padding-top:28px !important}
.sptabs[data-tab="route"]>[data-sec]:not([data-sec="route"]),.sptabs[data-tab="enjoy"]>[data-sec]:not([data-sec="enjoy"]),.sptabs[data-tab="fare"]>[data-sec]:not([data-sec="fare"]),.sptabs[data-tab="spot"]>[data-sec]:not([data-sec="spot"]){display:none !important}
}

body{overflow-wrap:break-word}
h1,h2,h3,button,a,span,p,li,td,th{overflow-wrap:anywhere;word-break:normal}
details.lang>summary::-webkit-details-marker{display:none}
.hero-slides{position:relative;overflow:hidden}
.hero-slides>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;animation:heroFade 15s infinite}
.hero-slides>img:nth-of-type(1){position:relative;opacity:1;animation:none}
.hero-slides>img:nth-of-type(2){animation-delay:5s}
.hero-slides>img:nth-of-type(3){animation-delay:10s}
@keyframes heroFade{0%{opacity:0}4%{opacity:1}33%{opacity:1}37%{opacity:0}100%{opacity:0}}
.hero-dots{position:absolute;right:20px;bottom:16px;display:flex;gap:6px;z-index:2}
.hero-dots>span{width:22px;height:4px;background:rgba(255,255,255,0.5);animation:heroDot 15s infinite}
.hero-dots>span:nth-child(2){animation-delay:5s}.hero-dots>span:nth-child(3){animation-delay:10s}
@keyframes heroDot{0%{background:#FFFFFF}33%{background:#FFFFFF}34%{background:rgba(255,255,255,0.5)}100%{background:rgba(255,255,255,0.5)}}
@media (prefers-reduced-motion: reduce){.hero-slides>img{animation:none}.hero-slides>img:nth-of-type(1){opacity:1}}
</style>

<script>window.__DC_TPL="\n\n<div style=\"font-family: 'Noto Sans JP', sans-serif; color: #2B2B2B; background: #F5F1E8; min-height: 100vh\">\n\n  <!-- 災害・運行情報テロップ -->\n  <sc-if value=\"{{ normal }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"background: #E3ECE4; border-bottom: 1px solid #B9CDBD; font-size: 14px\">\n      <div style=\"max-width: 1280px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 10px 16px; align-items: center\">\n        <span style=\"background: #2B2B2B; color: #FFFFFF; font-weight: 700; font-size: 12px; padding: 4px 10px; border-radius: 2px; white-space: nowrap\">災害・運行情報</span>\n        <span style=\"display: flex; align-items: center; gap: 6px; font-weight: 700; color: #2F4A3C; white-space: nowrap\"><span style=\"width: 10px; height: 10px; border-radius: 50%; background: #3E7A55\"></span>平常運行</span>\n        <span class=\"pc-only\" style=\"font-size: 12px; color: #5E5648; white-space: nowrap\">○時○分 更新</span>\n        <a href=\"Service.html\" style=\"margin-left: auto; font-size: 13px; font-weight: 700; white-space: nowrap\">詳しく見る →</a>\n      </div>\n    </div>\n  </sc-if>\n  <sc-if value=\"{{ alert }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"background: #8A3B26; color: #FFFFFF; font-size: 14px\">\n      <div style=\"max-width: 1280px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 10px 16px; align-items: center\">\n        <span style=\"background: #FFFFFF; color: #8A3B26; font-weight: 700; font-size: 12px; padding: 4px 10px; border-radius: 2px; white-space: nowrap\">災害・運行情報</span>\n        <span style=\"display: flex; align-items: center; gap: 6px; font-weight: 700; white-space: nowrap\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\"><path d=\"M12 3 2 21h20L12 3z\"></path><path d=\"M12 10v5M12 18v.5\"></path></svg>遅れ・運休あり</span>\n        <span class=\"pc-only\" style=\"font-size: 12px; white-space: nowrap\">○時○ r; justify-content: center; gap: 5px; box-sizing: border-box\">\n          <span style=\"width: 20px; height: 2px; background: #2B2B2B\"></span><span style=\"width: 20px; height: 2px; background: #2B2B2B\"></span><span style=\"width: 20px; height: 2px; background: #2B2B2B\"></span>\n        </summary>\n        <nav aria-label=\"メインメニュー\" style=\"position: absolute; left: 0; right: 0; top: 100%; z-index: 10; background: #F5F1E8; border-bottom: 1px solid #D8CFBD; padding: 8px 20px 20px; display: flex; flex-direction: column; font-size: 16px; font-weight: 500; box-shadow: 0 12px 24px rgba(60,45,20,0.12)\"><a href=\"Tateyama.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">エリア<span aria-hidden=\"true\">›</span></a><a href=\"Courses.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">モデルコース<span aria-hidden=\"true\">›</span></a><a href=\"Tickets.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">お得なチケット<span aria-hidden=\"true\">›</span></a><a href=\"RideRail.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">乗り方・きっぷ購入<span aria-hidden=\"true\">›</span></a><a href=\"Feature.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">特集<span aria-hidden=\"true\">›</span></a><a href=\"Access.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">アクセス<span aria-hidden=\"true\">›</span></a><a href=\"FAQ.html\" style=\"text-decoration: none; color: #2B2B2B; padding: 16px 4px; border-bottom: 1px solid #E2D9C6; display: flex; justify-content: space-between\">よくある質問<span aria-hidden=\"true\">›</span></a></nav>\n      </details>\n    </div>\n  </header>\n\n  <!-- エリア切替タブ -->\n  <div style=\"border-bottom: 1px solid #D8CFBD; overflow-x: auto\">\n    <div style=\"max-width: 1280px; margin: 0 auto; padding: 0 24px; display: flex; gap: 8px\">\n      <a href=\"Tateyama.html\" style=\"text-decoration: none; color: #4A4438; padding: 16px 18px; white-space: nowrap\">立山</a>\n      <a href=\"Kurobe.html\" style=\"text-decoration: none; color: #4A4438; padding: 16px 18px; white-space: nowrap\">黒部・宇奈月</a>\n      <a href=\"Uozu.html\" style=\"text-decoration: none; color: #4A4438; padding: 16px 18px; white-space: nowrap\">魚津・滑川・上市</a>\n      <a href=\"City.html\" style=\"text-decoration: none; color: #2B2B2B; font-weight: 700; padding: 16px 18px; border-bottom: 3px solid #B5523B; white-space: nowrap\">富山市内</a>\n    </div>\n  </div>\n\n  <!-- お知らせ枠（特別なお知らせがある場合のみ表示） -->\n  <sc-if value=\"{{ noticeShow }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"padding: 24px 24px 0\">\n    <div style=\"max-width: 1280px; margin: 0 auto; background: #FBF1D6; border: 1px solid #E2C77E; padding: 16px 20px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center\">\n      <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7A5A10\" stroke-width=\"1.8\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M12 7v6M12 16.5v.5\"></path></svg>\n      <span style=\"font-weight: 700; color: #5E4510\">お知らせ</span>\n      <span style=\"flex: 1 1 240px; color: #4A3A10; font-size: 15px\">［表示例］○月○日はイベント開催のため、一部区間で臨時ダイヤとなります。</span>\n    </div>\n  </div>\n  </sc-if>\n  <!-- ヒーロー -->\n  <section style=\"padding: 24px 24px 0\">\n    <div style=\"max-width: 1280px; margin: 0 auto; position: relative\">\n      <div class=\"hero-slides\"><img src=\"img/hero_city.jpg\" alt=\"富山城と街並み、市内電車のイラスト\" style=\"display: block; width: 100%; height: clamp(260px, 36vw, 520px); object-fit: cover\"><img src=\"img/gi_03.jpg\" alt=\"富山城の前を走る市内電車\" style=\"display: block; width: 100%; height: clamp(260px, 36vw, 520px); object-fit: cover\"><img src=\"img/st_minamitoyama.jpg\" alt=\"南富山駅\" style=\"display: block; width: 100%; height: clamp(260px, 36vw, 520px); object-fit: cover\"><div class=\"hero-dots\" aria-hidden=\"true\"><span></span><span></span><span></span></div></div>\n      <div style=\"position: absolute; left: clamp(16px, 3vw, 40px); top: clamp(16px, 3vw, 40px); display: flex; flex-direction: column; gap: 8px\">\n        <span style=\"font-family: 'Cormorant Garamond', serif; font-size: clamp(14px, 1.6vw, 22px); letter-spacing: 0.3em; color: #2F4A3C\">TOYAMA CITY</span>\n        <h1 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: clamp(32px, 4vw, 56px); letter-spacing: 0.08em\">富山市内</h1>\n      </div>\n    </div>\n    <div style=\"max-width: 1280px; margin: 0 auto; padding: 48px 0 0; display: flex; flex-wrap: wrap; gap: 32px 64px\">\n      <h2 style=\"margin: 0; flex: 1 1 320px; font-family: 'Noto Serif JP', serif; font-size: 30px; line-height: 1.7\">市内電車に乗って、<br>富山のまちをぐるっと。</h2>\n      <p style=\"margin: 0; flex: 1 1 320px; font-size: 16px; line-height: 2; color: #4A4438\">富山駅を中心に、まちなかを縦横に走る市内電車。富山城や美術館、運河沿いの公園、岩瀬のレトロな町並みへ。1日乗り放題のきっぷなら、気になった停留場で降りて、気ままに寄り道できます。</p>\n    </div>\n  </section>\n  <!-- スマホ用タブ -->\n  <nav class=\"sp-only sp-tabbar\" aria-label=\"ページ内メニュー\" style=\"position: sticky; top: 0; z-index: 30; background: #F5F1E8; padding: 12px 12px 8px; margin-top: 40px; border-bottom: 1px solid #D8CFBD; gap: 6px\">\n    <sc-for list=\"{{ spTabs }}\" as=\"t\" hint-placeholder-count=\"4\"><button onClick=\"{{ t.pick }}\" style=\"flex: 1 1 0; font-family: inherit; font-size: 13px; font-weight: 700; border: 1px solid #2F4A3C; border-radius: 999px; background: {{ t.bg }}; color: {{ t.color }}; min-height: 42px; padding: 0 4px; white-space: nowrap\">{{ t.label }}</butto  class=\"sp-only\">※ 図は横にスクロールして見ることができます。</span>\n        <span>※ ほかの場所から出発する場合は、<a href=\"https://visit.jorudan.co.jp/trip/ja/?tp=\">JORUDAN VISIT ↗</a>で経路を検索できます。</span>\n      </div>\n    </div>\n  </section>\n\n  <!-- 停留場ごとの観光スポット -->\n  <section data-sec=\"spot\" style=\"padding: 88px 24px 0\">\n    <div style=\"max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px\">\n      <div style=\"display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; justify-content: space-between\">\n        <div style=\"display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline\">\n          <h2 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: 28px\">市内電車で行く観光スポット</h2>\n          <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 18px; letter-spacing: 0.2em; color: #8A4A35\">SIGHTSEEING</span>\n        </div><div class=\"pc-only\" style=\"gap: 8px; display: flex\">\n          <button aria-label=\"前へ\" style=\"width: 44px; height: 44px; border-radius: 50%; border: 1px solid #2B2B2B; background: transparent; font-size: 18px\">‹</button>\n          <button aria-label=\"次へ\" style=\"width: 44px; height: 44px; border-radius: 50%; border: 1px solid #2B2B2B; background: #2B2B2B; color: #FFFFFF; font-size: 18px\">›</button>\n        </div>\n      </div>\n      <div class=\"spots scroller\">\n        <sc-for list=\"{{ spotCards }}\" as=\"c\" hint-placeholder-count=\"8\">\n          <div style=\"background: #FFFDF8; border: 1px solid #D8CFBD; display: flex; flex-direction: column\">\n            <div style=\"aspect-ratio: 4 / 3; background: {{ c.tint }}; display: flex; justify-content: space-between; align-items: flex-end; padding: 10px; box-sizing: border-box\"><span style=\"width: 28px; height: 28px; border-radius: 50%; background: #B5523B; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; align-self: flex-start\">{{ c.no }}</span><span style= align-items: baseline; justify-content: space-between\">\n        <div style=\"display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline\">\n          <h2 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: 28px\">富山駅の乗り場と行き先</h2>\n          <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 18px; letter-spacing: 0.2em; color: #8A4A35\">PLATFORMS</span>\n        </div>\n      </div>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 24px\">\n        <div style=\"flex: 1 1 100%; min-width: 0; background: #FFFDF8; border: 1px solid #D8CFBD\">\n          <div class=\"pc-only\" style=\"display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 0.7fr) minmax(0, 0.7fr) minmax(0, 1.4fr) minmax(0, 0.8fr); gap: 10px; padding: 12px 18px; font-size: 12px; color: #5E5648; background: #E6DECC\"><span>行き先</span><span>のりば</span><span>系統</span><span>降りる停留場</span><span>停留場から</span></div>\n          <sc-for list=\"{{ spotCards }}\" as=\"c\" hint-placeholder-count=\"8\">\n            <div class=\"pf-row\" style=\"display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 0.7fr) minmax(0, 0.7fr) minmax(0, 1.4fr) minmax(0, 0.8fr); gap: 6px 10px; padding: 14px 18px; border-top: 1px solid #EFE8D8; align-items: center\">\n              <span style=\"display: flex; gap: 8px; align-items: center; font-size: 15px; font-weight: 700; min-width: 0\"><span style=\"flex: 0 0 24px; height: 24px; border-radius: 50%; background: #B5523B; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 12px\">{{ c.no }}</span><span style=\"overflow-wrap: anywhere\">{{ c.name }}</span></span>\n              <span style=\"font-size: 14px\"><span class=\"sp-only\" style=\"font-size: 12px; color: #5E5648\">のりば　</span>{{ c.platform }}</span>\n              <span style=\"font-size: 14px\"><span class=\"sp-only\" style=\"font-size: 12px; color: #5E5648\">系統　</span>{{ c.line }}</span>\n              <span style=\"font-size: 14px; overflow-wrap: anywhere\">{{ c.stop }}</span>\n              <span style=\"font-size: 14px\">{{ c.walk }}</span>\n            </div>\n          </sc-for>\n        </div>\n      </div>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center\">\n        <a href=\"https://www.chitetsu.co.jp/wp-content/themes/custom2/pdf/stationbusstop.pdf\" style=\"font-size: 15px; font-weight: 700\">富山駅停留場ののりば案内図はこちら ↗</a>\n        <span style=\"font-size: 13px; color: #4A4438\">※ のりば・系統は表示イメージ（仮）です。行き先によって、複数ののりば（例：3・4番）から乗車できる場合があります。</span>\n      </div>\n    </div>\n  </section>\n  <!-- 運賃・乗り方 -->\n  <section data-sec=\"fare\" style=\"padding: 88px 24px 0\">\n    <div style=\"max-width: 1280px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 48px\">\n      <div style=\"flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 20px\">\n        <h2 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: 28px\">運賃（全区間均一）</h2>\n        <div style=\"background: #FFFDF8; border: 1px solid #D8CFBD\">\n          <div style=\"display: grid; grid-template-columns: minmax(0, 1.6fr) repeat(2, minmax(0, 1fr)); padding: 12px 20px; font-size: 13px; color: #5E5648; background: #E6DECC\"><span>支払い方法</span><span>大人</span><span>こども</span></div>\n          <div style=\"display: grid; grid-template-columns: minmax(0, 1.6fr) repeat(2, minmax(0, 1fr)); padding: 16px 20px; border-top: 1px solid #EFE8D8; font-size: 15px; align-items: center\"><span style=\"font-weight: 700\">現金・全国交通系ICカード</span><span style=\"font-size: 20px; font-weight: 700\">240円</span><span style=\"font-size: 20px; font-weight: 700\">120円</span></div>\n          <div style=\"display: grid; grid-template-columns: minmax(0, 1.6fr) repeat(2, minmax(0, 1fr)); padding: 16px 20px; border-top: 1px solid #EFE8D8; font-size: 15px; align-items: center\"><span style=\"font-weight: 700\">えこまいか・パスカ</span><span>220円</span><span>110円</span></div>\n        </div>\n        <span style=\"font-size: 13px; color: #4A4438; line-height: 1.8\">3回以上乗るなら、1日乗り放題のきっぷがお得です。</span>\n      </div>\n      <div style=\"flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 20px\">\n        <h2 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: 28px\">市内電車の乗り方</h2>\n        <div style=\"background: #FFFDF8; border: 1px solid #D8CFBD; padding: 20px\">\n          <ol style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px\"><li style=\"display: flex; gap: 12px; align-items: flex-start\">\n            <span style=\"flex: 0 0 28px; height: 28px; border-radius: 50%; background: #2F4A3C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px\">1</span>\n            <span style=\"font-size: 15px; line-height: 1.8\">乗り口専用のドア（中ほど）から乗車（整理券はありません）</span>\n          </li><li style=\"display: flex; gap: 12px; align-items: flex-start\">\n            <span style=\"flex: 0 0 28px; height: 28px; border-radius: 50%; background: #2F4A3C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px\">2</span>\n            <span style=\"font-size: 15px; line-height: 1.8\">降りる停留場が近づいたら、降車ボタンを押す</span>\n          </li><li style=\"display: flex; gap: 12px; align-items: flex-start\">\n            <span style=\"flex: 0 0 28px; height: 28px; border-radius: 50%; background: #2F4A3C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px\">3</span>\n            <span style=\"font-size: 15px; line-height: 1.8\">前のドアの運賃箱に運賃を入れる（ICカードはタッチ）</span>\n          </li><li style=\"display: flex; gap: 12px; align-items: flex-start\">\n            <span style=\"flex: 0 0 28px; height: 28px; border-radius: 50%; background: #2F4A3C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px\">4</span>\n            <span
