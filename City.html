<style>
body{margin:0;background:#F5F1E8}
a{color:#2F4A3C}a:hover{color:#1E3328}
.sp-only{display:none !important}
.hide{display:none !important}
.scroller{scrollbar-width:thin}
details.menu>summary{list-style:none;cursor:pointer}
details.menu>summary::-webkit-details-marker{display:none}
.spots{display:flex;gap:24px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:12px}
.spots>*{flex:0 0 320px;scroll-snap-align:start}
.route-inner .route-card{flex:1 1 0 !important;min-width:0}
@media (max-width:767px){
.pc-only{display:none !important}.sp-only{display:flex !important}.sp-hide{display:none !important}
.spots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;overflow:visible}
.spots>*{flex:none}
.route-inner{width:max-content !important;max-width:none !important}
.route-inner .route-card{flex:0 0 168px !important}
.fare-grid{min-width:0 !important}
.pf-row{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
.pf-row>span:first-child{grid-column:1 / -1}
.map-wrap{display:none}
.map-wrap.open{display:block;position:fixed;inset:0;z-index:60;background:#F5F1E8;overflow:auto}
.map-wrap.open .tram-map{min-width:760px !important}
.fare-grid>div{padding:10px 3px !important;font-size:12px !important;word-break:keep-all;overflow-wrap:anywhere}
.tt-grid{padding-left:10px !important;padding-right:10px !important;gap:6px !important}
.tt-grid>span{font-size:11px}
}
@media (max-width:767px){
.sptabs>[data-sec]{padding-top:28px !important}
.sptabs[data-tab="route"]>[data-sec]:not([data-sec="route"]),.sptabs[data-tab="enjoy"]>[data-sec]:not([data-sec="enjoy"]),.sptabs[data-tab="fare"]>[data-sec]:not([data-sec="fare"]),.sptabs[data-tab="spot"]>[data-sec]:not([data-sec="spot"]){display:none !important}
}

body{overflow-wrap:break-word}
h1,h2,h3,button,a,span,p,li,td,th{overflow-wrap:anywhere;word-break:normal}
details.lang>summary::-webkit-details-marker{display:none}
.hero-slides{position:relative;overflow:hidden}
.hero-slides>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;animation:heroFade 15s infinite}
.hero-slides>img:nth-of-type(1){position:relative;opacity:1;animation:none}
.hero-slides>img:nth-of-type(2){animation-delay:5s}
.hero-slides>img:nth-of-type(3){animation-delay:10s}
@keyframes heroFade{0%{opacity:0}4%{opacity:1}33%{opacity:1}37%{opacity:0}100%{opacity:0}}
.hero-dots{position:absolute;right:20px;bottom:16px;display:flex;gap:6px;z-index:2}
.hero-dots>span{width:22px;height:4px;background:rgba(255,255,255,0.5);animation:heroDot 15s infinite}
.hero-dots>span:nth-child(2){animation-delay:5s}.hero-dots>span:nth-child(3){animation-delay:10s}
@keyframes heroDot{0%{background:#FFFFFF}33%{background:#FFFFFF}34%{background:rgba(255,255,255,0.5)}100%{background:rgba(255,255,255,0.5)}}
@media (prefers-reduced-motion: reduce){.hero-slides>img{animation:none}.hero-slides>img:nth-of-type(1){opacity:1}}
@media (max-width:767px){.area-tabs{display:grid !important;grid-template-columns:1fr 1fr;gap:0 !important;padding:0 !important}.area-tabs>a{text-align:center;padding:12px 6px !important;font-size:14px;border-bottom-width:3px;border-right:1px solid #E6DECC;border-top:1px solid #E6DECC}.sptabs{padding-bottom:56px}.why-sec{padding-top:56px !important}}
.hscity>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;animation:hscityF 15s infinite}.hscity>img:first-child{position:relative;opacity:1;animation:none}.hscity>img:nth-child(2){animation-delay:5s}.hscity>img:nth-child(3){animation-delay:10s}@keyframes hscityF{0%{opacity:0}4.00%{opacity:1}33.33%{opacity:1}37.33%{opacity:0}100%{opacity:0}}
</style>

    <span style=\"font-size: 12px; color: #4A4438; line-height: 1.6\">{{ c.stop }}下車　{{ c.walk }}</span>\n              <div style=\"flex-wrap: wrap; gap: 8px; margin-top: auto; display: flex\">\n                <sc-if value=\"{{ c.hasLink }}\" hint-placeholder-val=\"{{ true }}\"><a href=\"https://www.info-toyama.com/\" style=\"flex: 1 1 auto; text-align: center; text-decoration: none; color: #2B2B2B; font-size: 14px; border: 1px solid #2B2B2B; padding: 10px 12px; border-radius: 2px\">詳細（公式サイト）↗</a></sc-if><sc-if value=\"{{ c.hasGo }}\" hint-placeholder-val=\"{{ true }}\">\n                <a href=\"https://visit.jorudan.co.jp/trip/ja/?tp=\" style=\"flex: 1 1 auto; text-align: center; text-decoration: none; font-size: 14px; font-weight: 700; background: #2F4A3C; color: #FFFFFF; padding: 11px 12px; border-radius: 2px\">ここへ行く ↗</a>\n                <a href=\"#tram-map\" style=\"flex: 1 1 100%; text-align: center; text-decoration: none; color: #2F4A3C; font-size: 13px; padding: 4px 0\">マップで場所を見る</a></sc-if>\n              </div>\n            </div>\n          </div>\n        </sc-for>\n      </div>\n      <span style=\"font-size: 13px; color: #5E5648\">「マップで場所を見る」で上の簡略図に移動します。「アクセスを調べる」は遠方からの行き方を JORUDAN VISIT で調べます。</span>\n    </div>\n  </section>\n  <!-- 運賃・乗り方 -->\n  <section data-sec=\"fare\" style=\"padding: 88px 24px 0\">\n    <div style=\"max-width: 1280px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 48px\">\n      <div style=\"flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 20px\">\n        <h2 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: 28px\">運賃（全区間均一）</h2>\n        <div style=\"background: #FFFDF8; border: 1px solid #D8CFBD\">\n          <div style=\"display: grid; grid-template-columns: minmax(0, 1.6fr) repeat(2, minmax(0, 1fr)); padding: 12px 20px; font-size: 13px; color: #5E5648; background: #E6DECC\"><span>支払い方法</span><span>大人</span><span>こども</span></div>\n          <div style=\"display: grid; grid-template-columns: minmax(0, 1.6fr) repeat(2, minmax(0, 1fr)); padding: 16px 20px; border-top: 1px solid #EFE8D8; font-size: 15px; align-items: center\"><span style=\"font-weight: 700\">現金・全国交通系ICカード</span><span style=\"font-size: 20px; font-weight: 700\">240円</span><span style=\"font-size: 20px; font-weight: 700\">120円</span></div>\n          <div style=\"display: grid; grid-template-columns: minmax(0, 1.6fr) repeat(2, minmax(0, 1fr)); padding: 16px 20px; border-top: 1px solid #EFE8D8; font-size: 15px; align-items: center\"><span style=\"font-weight: 700\">えこまいか・パスカ</span><span>220円</span><span>110円</span></div>\n        </div>\n        <span style=\"font-size: 13px; color: #4A4438; line-height: 1.8\">3回以上乗るなら、1日乗り放題のきっぷがお得です。</span>\n      </div>\n      <div style=\"flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 20px\">\n        <h2 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: 28px\">市内電車の乗り方</h2>\n        <div style=\"background: #FFFDF8; border: 1px solid #D8CFBD; padding: 20px\">\n          <ol style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px\"><li style=\"display: flex; gap: 12px; align-items: flex-start\">\n            <span style=\"flex: 0 0 28px; height: 28px; border-radius: 50%; background: #2F4A3C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px\">1</span>\n            <span style=\"font-size: 15px; line-height: 1.8\">乗り口専用のドア（中ほど）から乗車（整理券はありません）</span>\n          </li><li style=\"display: flex; gap: 12px; align-items: flex-start\">\n            <span style=\"flex: 0 0 28px; height: 28px; border-radius: 50%; background: #2F4A3C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px\">2</span>\n            <span style=\"font-size: 15px; line-height: 1.8\">降りる停留場が近づいたら、降車ボタンを押す</span>\n          </li><li style=\"display: flex; gap: 12px; align-items: flex-start\">\n            <span style=\"flex: 0 0 28px; height: 28px; border-radius: 50%; background: #2F4A3C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px\">3</span>\n            <span style=\"font-size: 15px; line-height: 1.8\">前のドアの運賃箱に運賃を入れる（ICカードはタッチ）</span>\n          </li><li style=\"display: flex; gap: 12px; align-items: flex-start\">\n            <span style=\"flex: 0 0 28px; height: 28px; border-radius: 50%; background: #2F4A3C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px\">4</span>\n            <span style=\"font-size: 15px; line-height: 1.8\">1日乗り放題のきっぷは、降りるときに運転士に見せる</span>\n          </li></ol>\n        </div>\n        <span style=\"font-size: 13px; color: #4A4438; line-height: 1.8\">両替は停車中に車内の両替機で。乗り方の内容は地鉄様にご確認のうえ確定します。</span>\n        <a href=\"RideTram.html\" style=\"font-size: 14px; font-weight: 700\">詳しい乗り方・きっぷの購入場所を見る →</a>\n      </div>\n    </div>\n  </section>\n  <!-- お得なチケット -->\n  <section data-sec=\"fare\" style=\"padding: 88px 24px 0\">\n    <div style=\"max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px\">\n      <div style=\"display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; justify-content: space-between\">\n        <div style=\"display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline\">\n          <h2 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: 28px\">富山市内のお得なチケット</h2>\n          <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 18px; letter-spacing: 0.2em; color: #8A4A35\">VALUE TICKETS</span>\n        </div><a class=\"pc-only\" href=\"Tickets.html\" style=\"font-size: 14px\">チケットをもっと見る →</a>\n      </div>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px\">\n        <a href=\"TicketDetail.html#t5\" style=\"text-decoration: none; display: flex; gap: 20px; align-items: center; background: #2F4A3C; color: #F5F1E8; padding: 24px\">\n          <div style=\"flex: 0 0 110px; height: 76px; background: #EFE8D8; display: flex; align-items: center; justify-content: center; padding: 6px; box-sizing: border-box\"><img src=\"img/tk_gourmet.jpg\" alt=\"ぐるっとグルメぐりクーポンの券面\" style=\"display: block; max-width: 100%; max-height: 100%; object-fit: contain\"></div>\n          <div style=\"display: flex; flex-direction: column; gap: 6px; min-width: 0\"><span style=\"font-size: 17px; font-weight: 700\">ぐるっとグルメぐりクーポン</span><span style=\"font-size: 14px; color: #DCD3BF\">市内電車1日乗り放題＋名物引換クーポン2枚</span><span style=\"font-size: 16px; font-weight: 700; color: #F5F1E8\">1,000円</span></div>\n        </a>\n        <a href=\"TicketDetail.html#t1\" style=\"text-decoration: none; display: flex; gap: 20px; align-items: center; background: #FFFDF8; border: 1px solid #D8CFBD; color: #2B2B2B; padding: 24px\">\n          <div style=\"flex: 0 0 110px; height: 76px; background: #EFE8D8; display: flex; align-items: center; justify-content: center; padding: 6px; box-sizing: border-box\"><img src=\"img/tk_tram1day.jpg\" alt=\"市内電車1日フリーきっぷの券面\" style=\"display: block; max-width: 100%; max-height: 100%; object-fit: contain\"></div>\n          <div style=\"display: flex; flex-direction: column; gap: 6px; min-width: 0\"><span style=\"font-size: 17px; font-weight: 700\">市内電車1日フリーきっぷ</span><span style=\"font-size: 14px; color: #4A4438\">市内電車と電鉄富山〜南富山が1日乗り放題</span><span style=\"font-size: 16px; font-weight: 700; color: #8A3B26\">大人 650円</span></div>\n        </a>\n      </div>\n      <a class=\"sp-only\" href=\"Tickets.html\" style=\"justify-content: center; text-decoration: none; font-size: 15px; font-weight: 700; color: #2F4A3C; border: 1px solid #2F4A3C; padding: 14px; min-height: 48px; box-sizing: border-box\">お得なチケットをもっと見る</a>\n    </div>\n  </section>\n  <!-- モデルコース -->\n  <section data-sec=\"spot\" style=\"padding: 88px 24px 64px\">\n    <di
